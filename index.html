<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Arcade Hub</title><style>*{box-sizing:border-box}body{margin:0;background:#08090d;color:#fff;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif}.wrap{max-width:1000px;margin:auto;padding:24px 16px 50px}h1{font-size:34px;margin:8px 0}.sub{color:#a8adbd;margin-bottom:20px}.search{width:100%;padding:14px 16px;border-radius:14px;border:1px solid #252a38;background:#11141c;color:white;font-size:16px;margin-bottom:18px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.card{background:#121722;border:1px solid #252c3d;border-radius:20px;overflow:hidden;text-decoration:none;color:white;display:block}.art{height:115px;display:grid;place-items:center;font-size:48px;background:linear-gradient(145deg,#19233b,#30265b)}.body{padding:12px}.name{font-weight:800;font-size:17px}.tag{color:#9da4b5;font-size:13px;margin-top:4px}@media(min-width:700px){.grid{grid-template-columns:repeat(3,1fr)}.art{height:160px}}</style></head><body><div class="wrap"><h1>Arcade Hub</h1><div class="sub">Tap a game and play instantly.</div><input id="q" class="search" placeholder="Search games"><div class="grid" id="grid"></div></div><script>const games=[['Block Dash','games/block-dash.html','⚡','Runner'],['Flappy Square','games/flappy-square.html','🪽','Arcade'],['Snake','games/snake.html','🐍','Classic'],['Pong','games/pong.html','🏓','Sports'],['Breakout','games/breakout.html','🧱','Arcade'],['Memory Match','games/memory.html','🧠','Puzzle']];function draw(){let s=q.value.toLowerCase();grid.innerHTML=games.filter(x=>x[0].toLowerCase().includes(s)).map(x=>`<a class="card" href="${x[1]}"><div class="art">${x[2]}</div><div class="body"><div class="name">${x[0]}</div><div class="tag">${x[3]}</div></div></a>`).join('')}q.oninput=draw;draw();</script></body></html>
