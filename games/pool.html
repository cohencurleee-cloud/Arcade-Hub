<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

}

.topbar{position:fixed;z-index:40;top:max(8px,env(safe-area-inset-top));left:8px;right:8px;height:76px;display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:8px;pointer-events:none}
.topbar>*{pointer-events:auto}

.scoreboard{min-width:0;height:68px;display:grid;grid-template-columns:minmax(0,1fr) 44px minmax(0,1fr);align-items:center;border:1px solid rgba(255,255,255,.11);border-radius:21px;background:linear-gradient(180deg,rgba(16,26,22,.92),rgba(8,14,12,.92));box-shadow:0 12px 30px #0007;overflow:hidden}
.player{min-width:0;height:100%;display:grid;grid-template-columns:40px minmax(0,1fr);align-items:center;gap:8px;padding:8px 10px}
.player.right{grid-template-columns:minmax(0,1fr) 40px;text-align:right}

.pname{font-size:11px;font-weight:950;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.groupText{font-size:9px;color:#92a79e;font-weight:800;margin-top:2px}.ballRow{display:flex;gap:3px;margin-top:4px;min-height:8px;align-items:center}.player.right .ballRow{justify-content:flex-end}.miniBall{width:8px;height:8px;border-radius:50%;border:1px solid rgba(255,255,255,.4);background:#2b3b35}.miniBall.on{background:#f3f5f4}.vs{height:100%;display:grid;place-items:center;color:#778d84;font-size:10px;font-weight:1000;border-left:1px solid rgba(255,255,255,.07);border-right:1px solid rgba(255,255,255,.07)}
.menuBtn{min-width:42px;height:42px;border-radius:13px;border:1px solid rgba(255,255,255,.14);color:#fff;background:rgba(7,13,11,.78);font-weight:950;backdrop-filter:blur(12px)}
#powerDock{position:fixed;z-index:28;right:max(7px,env(safe-area-inset-right));top:104px;bottom:79px;width:42px;border-radius:18px;background:rgba(6,12,10,.82);border:1px solid rgba(255,255,255,.12);padding:8px 6px;display:flex;flex-direction:column;align-items:center;gap:7px;backdrop-filter:blur(12px)}
#powerDock label{font-size:8px;font-weight:1000;color:#95aaa1;writing-mode:vertical-rl;transform:rotate(180deg);letter-spacing:.08em}.powerTrack{position:relative;flex:1;width:16px;border-radius:999px;background:#101d18;border:1px solid #2b4238;overflow:hidden}#powerFill{position:absolute;left:0;right:0;bottom:0;height:58%;background:linear-gradient(0deg,#42d69e,#e6f7ef 72%,#fff);border-radius:999px}#powerRange{position:absolute;inset:0;width:100%;height:100%;opacity:0;writing-mode:vertical-lr;direction:rtl}#powerPct{font-size:9px;font-weight:950;color:#dcebe5}

.status{position:fixed;z-index:22;left:50%;bottom:max(66px,calc(env(safe-area-inset-bottom) + 66px));transform:translateX(-50%);max-width:78vw;padding:6px 10px;border-radius:999px;background:rgba(4,9,7,.7);border:1px solid rgba(255,255,255,.08);color:#c4d6cf;font-size:10px;font-weight:850;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none}#rotateHint{display:none;position:fixed;z-index:21;left:50%;top:92px;transform:translateX(-50%);font-size:9px;font-weight:900;color:#8fa49b;background:rgba(5,10,8,.6);padding:5px 9px;border-radius:999px;pointer-events:none}
.overlay{position:fixed;z-index:100000;inset:0;display:grid;place-items:center;padding:18px;background:rgba(2,5,4,.78);backdrop-filter:blur(10px)}.overlay.hidden{display:none}.panel{width:min(92vw,470px);max-height:86dvh;overflow:auto;background:#0d1713;border:1px solid #30453c;border-radius:25px;padding:20px;box-shadow:0 30px 90px #000b;text-align:center}.panel h1,.panel h2{margin:0 0 7px}.panel p{margin:0 0 15px;color:#9bafa7;line-height:1.45;font-size:13px}.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}.mode{border:1px solid #30453c;background:#14231d;color:#fff;border-radius:14px;padding:12px 7px;font-weight:900}.mode span{display:block;color:#8fa29a;font-size:9px;margin-top:4px}.mode.active{background:#f1faf6;color:#102019}.mode.active span{color:#53675f}.big{width:100%;border:1px solid #3a4f46;background:#f1faf6;color:#102019;border-radius:14px;padding:12px;font-weight:950;margin-top:8px}.big.secondary{background:#16251f;color:#fff}.statsGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}.statsGrid div{border:1px solid #293c34;background:#09110e;border-radius:13px;padding:10px 5px}.statsGrid b{display:block;font-size:18px}.statsGrid span{display:block;color:#84998f;font-size:9px;font-weight:900;text-transform:uppercase;margin-top:2px}.spinSheet{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}.spinSheet button{padding:12px;border:1px solid #30453c;background:#14231d;color:#fff;border-radius:14px;font-weight:900}.spinSheet button.active{background:#f1faf6;color:#102019}
@media(max-width:720px){.topbar{height:70px}.scoreboard{height:62px}.player{grid-template-columns:32px minmax(0,1fr);padding:7px 8px;gap:5px}.player.right{grid-template-columns:minmax(0,1fr) 32px}.avatar{width:31px;height:31px;font-size:13px}.pname{font-size:10px}.groupText{font-size:8px}.miniBall{width:6px;height:6px}#stage{inset:84px 48px 72px 8px}}
@media(max-width:520px) and (orientation:portrait){#rotateHint{display:block}#stage{inset:117px 8px 121px 8px}canvas{width:96vw;max-height:none}#powerDock{left:8px;right:8px;top:auto;bottom:max(67px,calc(env(safe-area-inset-bottom) + 67px));width:auto;height:42px;flex-direction:row;padding:6px 9px}#powerDock label{writing-mode:horizontal-tb;transform:none}.powerTrack{height:14px;width:auto;flex:1}.powerTrack #powerFill{top:0;bottom:0;width:58%;height:auto;right:auto}.powerTrack #powerRange{writing-mode:horizontal-tb;direction:ltr}.bottomBar{right:8px;grid-template-columns:auto auto minmax(0,1fr) auto}.status{bottom:max(112px,calc(env(safe-area-inset-bottom) + 112px));max-width:86vw}.scoreboard{grid-template-columns:minmax(0,1fr) 30px minmax(0,1fr)}.avatar{display:none}.player,.player.right{grid-template-columns:1fr}.vs{font-size:8px}}
@media(orientation:landscape) and (max-height:560px){.topbar{height:54px}.scoreboard{height:50px}.avatar{width:29px;height:29px}.player{padding:5px 8px}.groupText{display:none}.ballRow{margin-top:2px}.miniBall{width:6px;height:6px}#stage{inset:58px 46px 54px 8px}canvas{height:calc(100dvh - 112px);width:auto;max-height:none}#powerDock{top:62px;bottom:58px;width:38px}.bottomBar{height:46px;bottom:4px}.smallBtn,.shootBtn{height:38px}.status{bottom:48px}}
</style>

<div id="gameShell"><div class="topbar"><a class="iconBtn" href="../index.html" aria-label="Back to games">‹</a><div class="scoreboard"><div class="player active" id="p0Card"><div class="avatar">YOU</div><div><div class="pname" id="p0Name">You</div><div class="groupText" id="p0Group">Open table</div><div class="ballRow" id="p0Balls"></div></div></div><div class="vs">VS</div><div class="player right" id="p1Card"><div><div class="pname" id="p1Name">CPU</div><div class="groupText" id="p1Group">Open table</div><div class="ballRow" id="p1Balls"></div></div><div class="avatar">CPU</div></div></div><button class="menuBtn" id="menuBtn">☰</button></div><div id="rotateHint">Best in landscape</div><div id="stage"><canvas id="c" width="1200" height="700"></canvas></div><div id="powerDock"><label>POWER</label><div class="powerTrack"><div id="powerFill"></div><input id="powerRange" type="range" min="15" max="100" value="58"></div><div id="powerPct">58</div></div><div class="status" id="status">Drag on the table to aim.</div><div class="bottomBar"><button class="smallBtn" id="spinBtn">Spin</button><button class="smallBtn" id="shopBtn">Shop</button><div id="spinChip">CENTER BALL</div><button class="shootBtn" id="shootBtn">SHOOT</button></div><div class="overlay" id="overlay"><div class="panel" id="panel"></div></div></div>
<script src="../arcade-economy.js"></script><script src="../admin.js"></script><script>
const c=document.getElementById('c'),ctx=c.getContext('2d'),overlay=document.getElementById('overlay'),panel=document.getElementById('panel'),powerRange=document.getElementById('powerRange'),powerFill=document.getElementById('powerFill'),powerPct=document.getElementById('powerPct'),shootBtn=document.getElementById('shootBtn'),statusEl=document.getElementById('status');
const W=1200,H=700,R=14,TABLE={l:120,t:110,r:1080,b:590,w:960,h:480},POCKET_R=30,MOUTH=42,pockets=[{x:TABLE.l,y:TABLE.t,type:'corner'},{x:(TABLE.l+TABLE.r)/2,y:TABLE.t-2,type:'side'},{x:TABLE.r,y:TABLE.t,type:'corner'},{x:TABLE.l,y:TABLE.b,type:'corner'},{x:(TABLE.l+TABLE.r)/2,y:TABLE.b+2,type:'side'},{x:TABLE.r,y:TABLE.b,type:'corner'}],COLORS={1:'#f4d33e',2:'#2875d6',3:'#d4413f',4:'#7e4bbb',5:'#ef8a2d',6:'#2c9d5b',7:'#8b2831',8:'#111',9:'#f4d33e',10:'#2875d6',11:'#d4413f',12:'#7e4bbb',13:'#ef8a2d',14:'#2c9d5b',15:'#8b2831'},PROFILE='poolProfileV2',clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),hypot=(x,y)=>Math.hypot(x,y),admin=()=>window.ArcadeAdmin?.getSettings?.()||{god:false,speed:1,poolAuto:false,poolPrediction:false};
let balls=[],mode='cpu',turn=0,groups=[null,null],phase='menu',winner=null,aim=0,power=58,spin=0,last=performance.now(),shot=null,autoAt=0,rewarded=false,notice='Drag on the table to aim.',cachedPrediction=null,predictionKey='',pointerDown=false;
function profile(){try{return{wins:0,losses:0,bestRun:0,...JSON.parse(localStorage.getItem(PROFILE)||'{}')}}catch{return{wins:0,losses:0,bestRun:0}}}function saveProfile(p){localStorage.setItem(PROFILE,JSON.stringify(p))}function speedValue(){const v=Number(admin().speed);return Number.isFinite(v)&&v>0?v:1}function cosmetic(){return window.ArcadeEconomy?.gameCosmetic?.('pool')||'default'}function applySkin(){document.body.dataset.skin=cosmetic()}function cue(world=balls){return world.find(b=>b.n===0)}function live(world=balls){return world.filter(b=>!b.pocketed)}function groupOf(n){return n===0?'cue':n===8?'eight':n<=7?'solids':'stripes'}function playerName(i){if(mode==='2p')return i?'Player 2':'Player 1';return i?'CPU':'You'}function opponent(i){return i?0:1}function remaining(g,world=balls){return g?world.filter(b=>!b.pocketed&&groupOf(b.n)===g).length:7}function targetGroup(i,world=balls){const g=groups[i];return g&&remaining(g,world)===0?'eight':g}function legalBall(b,i,world=balls){if(!b||b.pocketed||b.n===0)return false;const g=targetGroup(i,world);if(!g)return b.n!==8;return groupOf(b.n)===g}function legalNumberForTarget(n,g){if(n==null||n===0)return false;if(!g)return n!==8;if(g==='eight')return n===8;return groupOf(n)===g}function moving(world=balls){return live(world).some(b=>hypot(b.vx,b.vy)>3)}function speedForPower(p){const q=clamp(p,0,100)/100;return 260+q*q*1040}function cssPoint(e){const r=c.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height}}function cloneWorld(world=balls){return world.map(b=>({...b}))}function markPredictionDirty(){predictionKey='';cachedPrediction=null}
function rack(){balls=[{n:0,x:315,y:350,vx:0,vy:0,pocketed:false}];const rackNums=[1,10,2,11,8,3,12,4,13,5,14,6,15,7,9],apexX=760,apexY=350,dx=R*1.78,dy=R*2.04;let k=0;for(let row=0;row<5;row++)for(let j=0;j<=row;j++){const n=rackNums[k++];balls.push({n,x:apexX+row*dx,y:apexY+(j-row/2)*dy,vx:0,vy:0,pocketed:false})}}function startGame(){rack();groups=[null,null];turn=0;winner=null;phase='playing';aim=0;power=62;spin=0;shot=null;autoAt=performance.now()+650;rewarded=false;notice='Break the rack.';overlay.classList.add('hidden');syncPower();markPredictionDirty();updateHud()}function showMenu(){phase='menu';overlay.classList.remove('hidden');const p=profile();panel.innerHTML=`<h1>8 Ball Pool</h1><p>A rebuilt pool game with tighter physics, real shot simulation, accurate prediction, spin, CPU matches, local 2-player, practice mode, and table skins.</p><div class="modes"><button class="mode ${mode==='cpu'?'active':''}" data-mode="cpu">VS CPU<span>Smart opponent</span></button><button class="mode ${mode==='2p'?'active':''}" data-mode="2p">2 Player<span>Pass & play</span></button><button class="mode ${mode==='practice'?'active':''}" data-mode="practice">Practice<span>Free table</span></button></div><div class="statsGrid"><div><b>${p.wins}</b><span>Wins</span></div><div><b>${p.losses}</b><span>Losses</span></div><div><b>+45</b><span>Win coins</span></div></div><button class="big" id="playBtn">Rack 'Em</button><a class="big secondary" style="display:block;text-decoration:none" href="../shop.html">Pool Shop</a>`;panel.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;showMenu()});panel.querySelector('#playBtn').onclick=startGame}function showSpin(){overlay.classList.remove('hidden');panel.innerHTML=`<h2>Cue Ball Spin</h2><p>Follow keeps the cue ball moving forward after contact. Draw pulls it back. Prediction uses the same spin physics.</p><div class="spinSheet"><button data-spin="-1" class="${spin===-1?'active':''}">DRAW</button><button data-spin="0" class="${spin===0?'active':''}">CENTER</button><button data-spin="1" class="${spin===1?'active':''}">FOLLOW</button></div><button class="big secondary" id="spinClose">Done</button>`;panel.querySelectorAll('[data-spin]').forEach(b=>b.onclick=()=>{spin=+b.dataset.spin;markPredictionDirty();showSpin()});panel.querySelector('#spinClose').onclick=()=>overlay.classList.add('hidden')}
function syncPower(){power=+powerRange.value;powerFill.style.height=power+'%';powerFill.style.width=power+'%';powerPct.textContent=power;markPredictionDirty()}powerRange.oninput=syncPower;function miniBalls(i){const g=groups[i],count=g?remaining(g):7;return Array.from({length:7},(_,k)=>`<i class="miniBall ${k<count?'on':''}"></i>`).join('')}function updateHud(){p0Name.textContent=playerName(0);p1Name.textContent=playerName(1);p0Group.textContent=groups[0]?`${groups[0]==='solids'?'SOLIDS':'STRIPES'} • ${remaining(groups[0])} LEFT`:'OPEN TABLE';p1Group.textContent=groups[1]?`${groups[1]==='solids'?'SOLIDS':'STRIPES'} • ${remaining(groups[1])} LEFT`:'OPEN TABLE';p0Balls.innerHTML=miniBalls(0);p1Balls.innerHTML=miniBalls(1);p0Card.classList.toggle('active',phase==='playing'&&turn===0);p1Card.classList.toggle('active',phase==='playing'&&turn===1);const human=mode==='practice'||mode==='2p'||turn===0,canShoot=phase==='playing'&&!winner&&!moving()&&human&&!admin().poolAuto;shootBtn.disabled=!canShoot;powerRange.disabled=!canShoot;spinChip.textContent=spin<0?'DRAW SPIN':spin>0?'FOLLOW SPIN':'CENTER BALL';statusEl.textContent=notice+(admin().poolAuto?' • AUTOPILOT':'')+(admin().poolPrediction?' • PREDICTOR':'')}
function pocketNear(x,y){let best=null,bd=Infinity;for(const p of pockets){const d=Math.hypot(x-p.x,y-p.y);if(d<bd){bd=d;best=p}}return bd<POCKET_R?best:null}function cushionOpen(x,y,side){if(side==='top'||side==='bottom')return Math.abs(x-TABLE.l)<MOUTH||Math.abs(x-TABLE.r)<MOUTH||Math.abs(x-(TABLE.l+TABLE.r)/2)<MOUTH;return Math.abs(y-TABLE.t)<MOUTH||Math.abs(y-TABLE.b)<MOUTH}function applyCushions(b){const e=.92;if(b.x-R<TABLE.l&&!cushionOpen(b.x,b.y,'left')){b.x=TABLE.l+R;b.vx=Math.abs(b.vx)*e}if(b.x+R>TABLE.r&&!cushionOpen(b.x,b.y,'right')){b.x=TABLE.r-R;b.vx=-Math.abs(b.vx)*e}if(b.y-R<TABLE.t&&!cushionOpen(b.x,b.y,'top')){b.y=TABLE.t+R;b.vy=Math.abs(b.vy)*e}if(b.y+R>TABLE.b&&!cushionOpen(b.x,b.y,'bottom')){b.y=TABLE.b-R;b.vy=-Math.abs(b.vy)*e}if(b.x<TABLE.l-POCKET_R||b.x>TABLE.r+POCKET_R||b.y<TABLE.t-POCKET_R||b.y>TABLE.b+POCKET_R){const p=pockets.reduce((best,q)=>Math.hypot(b.x-q.x,b.y-q.y)<Math.hypot(b.x-best.x,b.y-best.y)?q:best,pockets[0]);b.x=p.x;b.y=p.y;b.pocketed=true;b.vx=b.vy=0}}function collidePair(a,b,worldState){let dx=b.x-a.x,dy=b.y-a.y,d2=dx*dx+dy*dy,min=R*2;if(d2>=min*min||d2===0)return false;const d=Math.sqrt(d2),nx=dx/d,ny=dy/d,overlap=min-d;a.x-=nx*overlap*.5;a.y-=ny*overlap*.5;b.x+=nx*overlap*.5;b.y+=ny*overlap*.5;const rvx=b.vx-a.vx,rvy=b.vy-a.vy,rel=rvx*nx+rvy*ny;if(rel<0){const restitution=.965,impulse=-(1+restitution)*rel/2;a.vx-=impulse*nx;a.vy-=impulse*ny;b.vx+=impulse*nx;b.vy+=impulse*ny}if(worldState&&worldState.firstContact==null){if(a.n===0&&b.n!==0)worldState.firstContact=b.n;else if(b.n===0&&a.n!==0)worldState.firstContact=a.n}if(worldState&&worldState.firstContact!=null&&!worldState.spinApplied){const cb=a.n===0?a:b.n===0?b:null;if(cb){const s=worldState.spin||0;if(s){const dir=worldState.shotDir||{x:1,y:0};cb.vx+=dir.x*worldState.initialSpeed*.16*s;cb.vy+=dir.y*worldState.initialSpeed*.16*s}worldState.spinApplied=true}}return true}function physicsSubstep(world,dt,stateObj,emit=false){const rolling=Math.exp(-1.55*dt);for(const b of world){if(b.pocketed)continue;b.x+=b.vx*dt;b.y+=b.vy*dt;const p=pocketNear(b.x,b.y);if(p){b.pocketed=true;b.vx=b.vy=0;if(stateObj)stateObj.pocketed.push(b.n);if(emit)window.ArcadeVibes?.play?.(b.n===0?'hit':'score');continue}applyCushions(b);if(b.pocketed&&stateObj&&!stateObj.pocketed.includes(b.n))stateObj.pocketed.push(b.n)}for(let i=0;i<world.length;i++)for(let j=i+1;j<world.length;j++){const a=world[i],b=world[j];if(a.pocketed||b.pocketed)continue;collidePair(a,b,stateObj)}for(const b of world){if(b.pocketed)continue;b.vx*=rolling;b.vy*=rolling;if(Math.hypot(b.vx,b.vy)<4){b.vx=0;b.vy=0}}}function physicsStep(world,dt,stateObj,emit=false){const maxV=world.reduce((m,b)=>b.pocketed?m:Math.max(m,Math.hypot(b.vx,b.vy)),0),n=Math.max(1,Math.min(12,Math.ceil(maxV*dt/(R*.45)))),s=dt/n;for(let k=0;k<n;k++)physicsSubstep(world,s,stateObj,emit)}
function shoot(angle=aim,pct=power,who=turn,spinValue=spin){if(phase!=='playing'||winner||moving())return false;const cb=cue();if(!cb||cb.pocketed)return false;const sp=speedForPower(pct),dx=Math.cos(angle),dy=Math.sin(angle),targetAtStart=targetGroup(who);cb.vx=dx*sp;cb.vy=dy*sp;shot={who,targetAtStart,firstContact:null,pocketed:[],scratch:false,spin:spinValue,spinApplied:false,shotDir:{x:dx,y:dy},initialSpeed:sp};notice=`${playerName(who)} shot`;markPredictionDirty();window.ArcadeVibes?.play?.('hit');updateHud();return true}function placeCue(){const cb=cue();cb.pocketed=false;cb.vx=cb.vy=0;let x=315,y=350;for(let tries=0;tries<80;tries++){const bad=balls.some(b=>b!==cb&&!b.pocketed&&Math.hypot(x-b.x,y-b.y)<R*2.2);if(!bad)break;y=clamp(170+Math.random()*360,TABLE.t+R+6,TABLE.b-R-6);x=300+Math.random()*80}cb.x=x;cb.y=y;markPredictionDirty()}function resolveShot(){if(!shot)return;const s=shot;shot=null;s.scratch=s.pocketed.includes(0);if(mode==='practice'){if(s.scratch)placeCue();notice=s.pocketed.filter(n=>n!==0).length?'Nice shot.':'Practice — line up the next one.';autoAt=performance.now()+500;updateHud();return}const tgBefore=s.targetAtStart,legalFirst=legalNumberForTarget(s.firstContact,tgBefore),eightPocketed=s.pocketed.includes(8);if(eightPocketed){const canEight=tgBefore==='eight';if(canEight&&legalFirst&&!s.scratch)finishGame(s.who,'8 ball down');else finishGame(opponent(s.who),canEight?'scratch on the 8':'8 ball too early');return}const foul=s.scratch||!legalFirst;if(!groups[0]&&!foul){const firstScored=s.pocketed.find(n=>n>=1&&n<=15&&n!==8);if(firstScored){groups[s.who]=groupOf(firstScored);groups[opponent(s.who)]=groups[s.who]==='solids'?'stripes':'solids'}}const legalPots=s.pocketed.filter(n=>n!==0&&n!==8&&(!groups[s.who]||groupOf(n)===groups[s.who])).length;if(s.scratch)placeCue();if(foul){turn=opponent(s.who);notice=`Foul — ${playerName(turn)} has the table.`}else if(legalPots>0){turn=s.who;notice=`${playerName(turn)} continues.`}else{turn=opponent(s.w function pointSegmentDistance(p,a,b){const vx=b.x-a.x,vy=b.y-a.y,L2=vx*vx+vy*vy;if(L2<1)return Math.hypot(p.x-a.x,p.y-a.y);const t=clamp(((p.x-a.x)*vx+(p.y-a.y)*vy)/L2,0,1);return Math.hypot(p.x-(a.x+vx*t),p.y-(a.y+vy*t))}function lineClear(a,b,ignore=[]){for(const q of live()){if(ignore.includes(q.n))continue;if(pointSegmentDistance(q,a,b)<R*2.05)return false}return true}function directPlans(player){const cb=cue(),plans=[];if(!cb||cb.pocketed)return plans;const targets=live().filter(b=>legalBall(b,player));for(const t of targets)for(const p of pockets){const vx=p.x-t.x,vy=p.y-t.y,L=Math.hypot(vx,vy);if(L<70)continue;const ux=vx/L,uy=vy/L,ghost={x:t.x-ux*R*2.02,y:t.y-uy*R*2.02};if(ghost.x<TABLE.l+R||ghost.x>TABLE.r-R||ghost.y<TABLE.t+R||ghost.y>TABLE.b-R)continue;if(!lineClear(t,p,[t.n,0])||!lineClear(cb,ghost,[0,t.n]))continue;const cueDist=Math.hypot(ghost.x-cb.x,ghost.y-cb.y),shotUx=(ghost.x-cb.x)/Math.max(1,cueDist),shotUy=(ghost.y-cb.y)/Math.max(1,cueDist),impactUx=(t.x-ghost.x)/(R*2.02),impactUy=(t.y-ghost.y)/(R*2.02),alignment=shotUx*impactUx+shotUy*impactUy;if(alignment<.18)continue;const pct=clamp(31+cueDist*.035+L*.028+(1-alignment)*28,28,92),angle=Math.atan2(ghost.y-cb.y,ghost.x-cb.x);plans.push({angle,power:pct,target:t.n,pocket:p,ghost,score:L*.25+cueDist*.08+(1-alignment)*210})}return plans.sort((a,b)=>a.score-b.score)}function simulateShot(angle,pct,spinValue=0,maxTime=7,source=balls){const world=cloneWorld(source),cb=cue(world);if(!cb||cb.pocketed)return null;const sp=speedForPower(pct),dx=Math.cos(angle),dy=Math.sin(angle);cb.vx=dx*sp;cb.vy=dy*sp;const sim={who:turn,firstContact:null,pocketed:[],spin:spinValue,spinApplied:false,shotDir:{x:dx,y:dy},initialSpeed:sp},cuePath=[{x:cb.x,y:cb.y}],objPaths=new Map(),dt=1/180;let t=0,lastCue={x:cb.x,y:cb.y},trackedObj=null;while(t<maxTime&&moving(world)){physicsStep(world,dt,sim,false);t+=dt;const cc=cue(world);if(cc&&!cc.pocketed&&Math.hypot(cc.x-lastCue.x,cc.y-lastCue.y)>7){cuePath.push({x:cc.x,y:cc.y});lastCue={x:cc.x,y:cc.y}}if(sim.firstContact!=null&&!trackedObj)trackedObj=world.find(b=>b.n===sim.firstContact)||null;if(trackedObj&&!trackedObj.pocketed){let arr=objPaths.get(trackedObj.n);if(!arr){arr=[{x:trackedObj.x,y:trackedObj.y}];objPaths.set(trackedObj.n,arr)}const q=arr[arr.length-1];if(Math.hypot(trackedObj.x-q.x,trackedObj.y-q.y)>7)arr.push({x:trackedObj.x,y:trackedObj.y})}}return{world,sim,cuePath,objPaths,time:t}}function choosePlan(player,deep=true){const cb=cue();if(!cb)return null;if(live().filter(b=>b.n!==0).length===15&&groups[0]==null){const apex=balls.find(b=>b.n!==0&&!b.pocketed);return{angle:Math.atan2(apex.y-cb.y,apex.x-cb.x),power:94,target:apex.n,score:0}}const plans=directPlans(player).slice(0,10);if(deep){let best=null;for(const p of plans)for(const extra of [0,7]){const pct=clamp(p.power+extra,20,96),sim=simulateShot(p.angle,pct,0,6);if(!sim)continue;const targetPotted=sim.world.find(b=>b.n===p.target)?.pocketed,cueScratch=sim.world.find(b=>b.n===0)?.pocketed,legalCount=sim.sim.pocketed.filter(n=>n!==0&&n!==8).length,score=p.score-targetPotted*500-legalCount*90+cueScratch*550;if(!best||score<best.score)best={...p,power:pct,score,verified:targetPotted}}if(best)return best}if(plans[0])return plans[0];const targets=live().filter(b=>legalBall(b,player));let best=null;for(const t of targets){if(!lineClear(cb,t,[0,t.n]))continue;const d=Math.hypot(t.x-cb.x,t.y-cb.y),p={angle:Math.atan2(t.y-cb.y,t.x-cb.x),power:clamp(38+d*.035,38,78),target:t.n,score:d};if(!best||p.score<best.score)best=p}return best}function runAuto(){if(phase!=='playing'||winner||moving()||performance.now()<autoAt)return;const isCpu=mode==='cpu'&&turn===1,isAdmin=admin().poolAuto&&(mode!=='2p'||turn===0);if(!isCpu&&!isAdmin)return;const plan=choosePlan(turn,true);if(plan){const planTurn=turn;aim=plan.angle;power=Math.round(plan.power);powerRange.value=power;syncPower();spin=0;notice=(isCpu?'CPU':'Autopilot')+(plan.verified?' found a pot.':' is lining up…');updateHud();autoAt=per Style='rgba(103,232,255,.82)';drawPath(p.cuePath);ctx.setLineDash([5,6]);ctx.strokeStyle='rgba(255,222,102,.92)';for(const arr of p.objPaths.values())drawPath(arr);ctx.setLineDash([]);if(p.sim.firstContact!=null){const original=balls.find(x=>x.n===p.sim.firstContact);if(original){ctx.beginPath();ctx.arc(original.x,original.y,R+5,0,Math.PI*2);ctx.strokeStyle='rgba(255,221,96,.9)';ctx.lineWidth=2;ctx.stroke()}}const cb=p.world.find(b=>b.n===0);if(cb&&!cb.pocketed){ctx.beginPath();ctx.arc(cb.x,cb.y,R+3,0,Math.PI*2);ctx.strokeStyle='rgba(103,232,255,.75)';ctx.lineWidth=2;ctx.stroke()}ctx.restore()}function draw(){applySkin();drawTable();drawPrediction();for(const b of balls)drawBall(b);drawCueAndAim();if(admin().poolAuto&&phase==='playing'&&!moving()){ctx.fillStyle='rgba(104,231,189,.95)';ctx.font='900 14px system-ui';ctx.textAlign='center';ctx.fillText('AUTOPILOT',W/2,82)}}function frame(now){const dt=Math.min(.025,(now-last)/1000||0);last=now;if(phase==='playing'){const total=dt*speedValue(),steps=Math.max(1,Math.min(24,Math.ceil(total/.008))),step=total/steps;for(let i=0;i<steps;i++)physicsStep(balls,step,shot,true);if(shot&&!moving())resolveShot();runAuto()}draw();updateHud();requestAnimationFrame(frame)}
