<script src="../arcade-economy.js"></script><script src="../admin.js"></script><script>
const c=document.getElementById('c'),x=c.getContext('2d'),overlay=document.getElementById('overlay'),panel=document.getElementById('panel'),range=document.getElementById('powerRange'),fill=document.getElementById('fill'),pct=document.getElementById('pct'),shootBtn=document.getElementById('shootBtn'),statusEl=document.getElementById('status');
const W=1500,H=700,R=14,T={l:170,t:80,r:1330,b:620,w:1160,h:540},CX=(T.l+T.r)/2,CY=(T.t+T.b)/2,PR=30,MOUTH=42,PO=[{x:T.l,y:T.t},{x:CX,y:T.t-2},{x:T.r,y:T.t},{x:T.l,y:T.b},{x:CX,y:T.b+2},{x:T.r,y:T.b}],COL={1:'#f4d33e',2:'#2875d6',3:'#d4413f',4:'#7e4bbb',5:'#ef8a2d',6:'#2c9d5b',7:'#8b2831',8:'#111',9:'#f4d33e',10:'#2875d6',11:'#d4413f',12:'#7e4bbb',13:'#ef8a2d',14:'#2c9d5b',15:'#8b2831'},KEY='poolProfileV3',clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),admin=()=>window.ArcadeAdmin?.getSettings?.()||{god:false,speed:1,poolAuto:false,poolPrediction:false};

async function tryLandscape(){
  try{if(screen.orientation&&screen.orientation.lock)await screen.orientation.lock('landscape')}catch{}
}
let balls=[],mode='cpu',turn=0,groups=[null,null],phase='menu',winner=null,aim=0,power=58,spin=0,last=performance.now(),shot=null,autoAt=0,rewarded=false,notice='Drag on the table to aim.',cache=null,cacheKey='',drag=false;
function prof(){try{return{wins:0,losses:0,...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch{return{wins:0,losses:0}}}function saveProf(p){localStorage.setItem(KEY,JSON.stringify(p))}function speed(){const v=+admin().speed;return Number.isFinite(v)&&v>0?v:1}function skin(){document.body.dataset.skin=window.ArcadeEconomy?.gameCosmetic?.('pool')||'default'}function cue(w=balls){return w.find(b=>b.n===0)}function live(w=balls){return w.filter(b=>!b.p)}function grp(n){return n===0?'cue':n===8?'eight':n<=7?'solids':'stripes'}function opp(i){return i?0:1}function name(i){if(mode==='2p')return i?'Player 2':'Player 1';return i?'CPU':'You'}function remain(g,w=balls){return g?w.filter(b=>!b.p&&grp(b.n)===g).length:7}function target(i,w=balls){const g=groups[i];return g&&remain(g,w)===0?'eight':g}function legal(b,i,w=balls){if(!b||b.p||b.n===0)return false;const g=target(i,w);return !g?b.n!==8:g==='eight'?b.n===8:grp(b.n)===g}function moving(w=balls){return live(w).some(b=>Math.hypot(b.vx,b.vy)>3)}function shotSpeed(p){p=clamp(p,0,100)/100;return 250+p*p*1050}function clone(w=balls){return w.map(b=>({...b}))}function dirty(){cacheKey='';cache=null}function cssPoint(e){const r=c.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height}}
function rack(){const cueX=T.l+T.w*.22,rackX=T.l+T.w*.69;balls=[{n:0,x:cueX,y:CY,vx:0,vy:0,p:false}];const a=[1,10,2,11,8,3,12,4,13,5,14,6,15,7,9];let k=0;for(let row=0;row<5;row++)for(let j=0;j<=row;j++)balls.push({n:a[k++],x:rackX+row*R*1.78,y:CY+(j-row/2)*R*2.04,vx:0,vy:0,p:false})}
function start(){tryLandscape();rack();groups=[null,null];turn=0;winner=null;phase='play';aim=0;power=62;range.value=62;spin=0;shot=null;autoAt=performance.now()+650;rewarded=false;notice='Break the rack.';overlay.classList.add('hidden');syncPower();dirty();hud()}
function menu(){phase='menu';overlay.classList.remove('hidden');const p=prof();panel.innerHTML=`<h1>8 Ball Pool</h1><p>Arcade Hub pool with proper ball collisions, real shot simulation, accurate prediction, spin, CPU matches, local 2-player and practice.</p><div class="modes"><button class="mode ${mode==='cpu'?'active':''}" data-m="cpu">VS CPU<span>Smart opponent</span></button><button class="mode ${mode==='2p'?'active':''}" data-m="2p">2 Player<span>Pass & play</span></button><button class="mode ${mode==='practice'?'active':''}" data-m="practice">Practice<span>Free table</span></button></div><div class="stats"><div><b>${p.wins}</b><span>WINS</span></div><div><b>${p.losses}</b><span>LOSSES</span></div><div><b>+45</b><span>WIN COINS</span></div></div><button class="big" id="play">RACK 'EM</button><a class="big alt" style="display:block;text-decoration:none" href="../shop.html">POOL SHOP</a>`;panel.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{mode=b.dataset.m;menu()});panel.querySelector('#play').onclick=start}
function spinMenu(){overlay.classList.remove('hidden');panel.innerHTML=`<h2>Cue Ball Spin</h2><p>Draw pulls the cue ball backward after contact. Follow carries it forward. Prediction uses the same spin.</p><div class="spinChoice"><button data-s="-1" class="${spin<0?'active':''}">DRAW</button><button data-s="0" class="${spin===0?'active':''}">CENTER</button><button data-s="1" class="${spin>0?'active':''}">FOLLOW</button></div><button class="big alt" id="done">DONE</button>`;panel.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{spin=+b.dataset.s;dirty();spinMenu()});panel.querySelector('#done').onclick=()=>overlay.classList.add('hidden')}
function syncPower(){power=+range.value;fill.style.height=power+'%';pct.textContent=power;dirty()}range.oninput=syncPower;
function dots(i){const g=groups[i],n=g?remain(g):7;return Array.from({length:7},(_,k)=>`<i class="dot ${k<n?'on':''}"></i>`).join('')}function hud(){n0.textContent=name(0);n1.textContent=name(1);g0.textContent=groups[0]?`${groups[0].toUpperCase()} • ${remain(groups[0])} LEFT`:'OPEN TABLE';g1.textContent=groups[1]?`${groups[1].toUpperCase()} • ${remain(groups[1])} LEFT`:'OPEN TABLE';d0.innerHTML=dots(0);d1.innerHTML=dots(1);p0.classList.toggle('active',phase==='play'&&turn===0);p1.classList.toggle('active',phase==='play'&&turn===1);const human=mode==='practice'||mode==='2p'||turn===0,can=phase==='play'&&!winner&&!moving()&&human&&!admin().poolAuto;shootBtn.disabled=!can;range.disabled=!can;statusEl.textContent=notice+(admin().poolAuto?' • AUTOPILOT':'')+(admin().poolPrediction?' • PREDICTOR':'')}
function nearPocket(b){let q=null,d=1e9;for(const p of PO){const z=Math.hypot(b.x-p.x,b.y-p.y);if(z<d){d=z;q=p}}return d<PR?q:null}function mouth(b,side){if(side==='t'||side==='b')return Math.abs(b.x-T.l)<MOUTH||Math.abs(b.x-T.r)<MOUTH||Math.abs(b.x-CX)<MOUTH;return Math.abs(b.y-T.t)<MOUTH||Math.abs(b.y-T.b)<MOUTH}
function cushion(b){const e=.93;if(b.x-R<T.l&&!mouth(b,'l')){b.x=T.l+R;b.vx=Math.abs(b.vx)*e}if(b.x+R>T.r&&!mouth(b,'r')){b.x=T.r-R;b.vx=-Math.abs(b.vx)*e}if(b.y-R<T.t&&!mouth(b,'t')){b.y=T.t+R;b.vy=Math.abs(b.vy)*e}if(b.y+R>T.b&&!mouth(b,'b')){b.y=T.b-R;b.vy=-Math.abs(b.vy)*e}}
function collide(a,b,s){let dx=b.x-a.x,dy=b.y-a.y,d2=dx*dx+dy*dy,m=R*2;if(!d2||d2>=m*m)return;let d=Math.sqrt(d2),nx=dx/d,ny=dy/d,o=m-d;a.x-=nx*o*.5;a.y-=ny*o*.5;b.x+=nx*o*.5;b.y+=ny*o*.5;const rel=(b.vx-a.vx)*nx+(b.vy-a.vy)*ny;if(rel<0){const imp=-(1+.965)*rel/2;a.vx-=imp*nx;a.vy-=imp*ny;b.vx+=imp*nx;b.vy+=imp*ny}if(s&&s.first==null){if(a.n===0&&b.n)s.first=b.n;else if(b.n===0&&a.n)s.first=a.n}if(s&&!s.spinDone&&s.first!=null){const cb=a.n===0?a:b.n===0?b:null;if(cb){if(s.spin){cb.vx+=s.dx*s.v0*.16*s.spin;cb.vy+=s.dy*s.v0*.16*s.spin}s.spinDone=true}}}
function step(w,dt,s,emit=false){const roll=Math.exp(-1.55*dt);for(const b of w){if(b.p)continue;b.x+=b.vx*dt;b.y+=b.vy*dt;if(nearPocket(b)){b.p=true;b.vx=b.vy=0;if(s&&!s.pots.includes(b.n))s.pots.push(b.n);if(emit)window.ArcadeVibes?.play?.(b.n===0?'hit':'score');continue}cushion(b);if(b.x<T.l-PR||b.x>T.r+PR||b.y<T.t-PR||b.y>T.b+PR){b.p=true;b.vx=b.vy=0;if(s&&!s.pots.includes(b.n))s.pots.push(b.n)}}for(let i=0;i<w.length;i++)for(let j=i+1;j<w.length;j++)if(!w[i].p&&!w[j].p)collide(w[i],w[j],s);for(const b of w){if(b.p)continue;b.vx*=roll;b.vy*=roll;if(Math.hypot(b.vx,b.vy)<4)b.vx=b.vy=0}}

function shoot(a=aim,p=power,who=turn,sp=spin){if(phase!=='play'||winner||moving())return false;const cb=cue();if(!cb||cb.p)return false;const v=shotSpeed(p),dx=Math.cos(a),dy=Math.sin(a);cb.vx=dx*v;cb.vy=dy*v;shot={who,first:null,pots:[],spin:sp,spinDone:false,dx,dy,v0:v,targetBefore:target(who)};notice=`${name(who)} shot`;dirty();window.ArcadeVibes?.play?.('hit');return true}
function placeCue(){const b=cue();b.p=false;b.vx=b.vy=0;b.x=T.l+T.w*.22;b.y=CY;for(let k=0;k<80;k++){if(!balls.some(q=>q!==b&&!q.p&&Math.hypot(q.x-b.x,q.y-b.y)<R*2.2))break;b.y=T.t+R+20+Math.random()*(T.h-R*2-40)}}
function finish(i,why){winner=i;phase='over';notice=`${name(i)} wins — ${why}.`;let coins=0;if(mode==='cpu'){const p=prof();if(i===0){p.wins++;coins=45;if(!rewarded){window.ArcadeEconomy?.add?.(45,'8 Ball Pool win');rewarded=true}}else p.losses++;saveProf(p)}window.ArcadeVibes?.play?.(i===0?'win':'hit');setTimeout(()=>{overlay.classList.remove('hidden');panel.innerHTML=`<h2>${name(i)} Wins</h2><p>${why}.${coins?' You earned <b>+45 Arcade Coins</b>.':''}</p><button class="big" id="again">PLAY AGAIN</button><button class="big alt" id="modes">GAME MODES</button>`;again.onclick=start;modes.onclick=menu},300)}
function resolve(){if(!shot)return;const s=shot;shot=null;const scratch=s.pots.includes(0),firstBall=balls.find(b=>b.n===s.first),legalFirst=s.targetBefore? (s.targetBefore==='eight'?s.first===8:grp(s.first)===s.targetBefore):!!firstBall&&s.first!==8,eight=s.pots.includes(8);if(mode==='practice'){if(scratch)placeCue();notice=s.pots.some(n=>n>0)?'Nice shot.':'Practice — line up the next one.';autoAt=performance.now()+400;dirty();return}if(eight){if(s.targetBefore==='eight'&&legalFirst&&!scratch)finish(s.who,'8 ball down');else finish(opp(s.who),s.targetBefore==='eight'?'scratch on the 8':'8 ball too early');return}let foul=scratch||!legalFirst;if(!groups[0]&&!foul){const first=s.pots.find(n=>n>0&&n!==8);if(first){groups[s.who]=grp(first);groups[opp(s.who)]=groups[s.who]==='solids'?'stripes':'solids'}}const legalPots=s.pots.filter(n=>n>0&&n!==8&&(!groups[s.who]||grp(n)===groups[s.who])).length;if(scratch)placeCue();if(foul){turn=opp(s.who);notice=`Foul — ${name(turn)} has the table.`}else if(legalPots){turn=s.who;notice=`${name(turn)} continues.`}else{turn=opp(s.who);notice=`${name(turn)} turn.`}autoAt=performance.now()+550;dirty();hud()}
function segDist(p,a,b){const vx=b.x-a.x,vy=b.y-a.y,l=vx*vx+vy*vy;if(l<1)return Math.hypot(p.x-a.x,p.y-a.y);const t=clamp(((p.x-a.x)*vx+(p.y-a.y)*vy)/l,0,1);return Math.hypot(p.x-a.x-vx*t,p.y-a.y-vy*t)}function clearLine(a,b,ignore=[]){return live().every(q=>ignore.includes(q.n)||segDist(q,a,b)>=R*2.05)}
function plans(player){const cb=cue(),out=[];if(!cb)return out;for(const t of live().filter(b=>legal(b,player)))for(const p of PO){const vx=p.x-t.x,vy=p.y-t.y,L=Math.hypot(vx,vy);if(L<60)continue;const ux=vx/L,uy=vy/L,g={x:t.x-ux*R*2.02,y:t.y-uy*R*2.02};if(g.x<T.l+R||g.x>T.r-R||g.y<T.t+R||g.y>T.b-R||!clearLine(t,p,[t.n,0])||!clearLine(cb,g,[0,t.n]))continue;const cd=Math.hypot(g.x-cb.x,g.y-cb.y),su={x:(g.x-cb.x)/cd,y:(g.y-cb.y)/cd},al=su.x*ux+su.y*uy;if(al<.18)continue;out.push({a:Math.atan2(g.y-cb.y,g.x-cb.x),p:clamp(31+cd*.035+L*.028+(1-al)*28,28,92),t:t.n,score:L*.25+cd*.08+(1-al)*210})}return out.sort((a,b)=>a.score-b.score)}
function simulate(a,p,sp=0,seconds=6){const w=clone(),cb=cue(w);if(!cb)return null;const v=shotSpeed(p),dx=Math.cos(a),dy=Math.sin(a),s={first:null,pots:[],spin:sp,spinDone:false,dx,dy,v0:v};cb.vx=dx*v;cb.vy=dy*v;const cuePath=[{x:cb.x,y:cb.y}],obj=new Map(),dt=1/180;let time=0,lastC={x:cb.x,y:cb.y},tracked=null;while(time<seconds&&moving(w)){physics(w,dt,s);time+=dt;const q=cue(w);if(q&&!q.p&&Math.hypot(q.x-lastC.x,q.y-lastC.y)>7){cuePath.push({x:q.x,y:q.y});lastC={x:q.x,y:q.y}}if(s.first!=null&&!tracked)tracked=w.find(b=>b.n===s.first);if(tracked&&!tracked.p){let a=obj.get(tracked.n);if(!a){a=[{x:tracked.x,y:tracked.y}];obj.set(tracked.n,a)}const z=a[a.length-1];if(Math.hypot(tracked.x-z.x,tracked.y-z.y)>7)a.push({x:tracked.x,y:tracked.y})}}return{w,s,cuePath,obj}}
function choose(player){if(live().filter(b=>b.n).length===15&&!groups[0]){const cb=cue(),apex=balls.find(b=>b.n);return{a:Math.atan2(apex.y-cb.y,apex.x-cb.x),p:94,t:apex.n,verified:false}}const base=plans(player).slice(0,9);let best=null;for(const q of base)for(const extra of [0,7]){const pp=clamp(q.p+extra,20,96),sim=simulate(q.a,pp,0,6);if(!sim)continue;const hit=sim.w.find(b=>b.n===q.t)?.p,scratch=sim.w.find(b=>b.n===0)?.p,pots=sim.s.pots.filter(n=>n&&n!==8).length,score=q.score-(hit?520:0)-pots*85+(scratch?600:0);if(!best||score<best.score)best={...q,p:pp,score,verified:!!hit}}if(best)return best;if(base[0])return base[0];const cb=cue();let fallback=null;for(const t of live().filter(b=>legal(b,player))){if(!clearLine(cb,t,[0,t.n]))continue;const d=Math.hypot(t.x-cb.x,t.y-cb.y),q={a:Math.atan2(t.y-cb.y,t.x-cb.x),p:clamp(38+d*.035,38,78),t:t.n,score:d};if(!fallback||q.score<fallback.score)fallback=q}return fallback}
function auto(){if(phase!=='play'||winner||moving()||performance.now()<autoAt)return;const cpu=mode==='cpu'&&turn===1,adm=admin().poolAuto&&(mode!=='2p'||turn===0);if(!cpu&&!adm)return;const q=choose(turn);if(!q){turn=opp(turn);notice='No clean shot found.';autoAt=performance.now()+450;return}const who=turn;aim=q.a;power=Math.round(q.p);range.value=power;syncPower();spin=0;notice=(cpu?'CPU':'Autopilot')+(q.verified?' found a pot.':' is lining up…');autoAt=performance.now()+420;setTimeout(()=>{if(phase==='play'&&!moving()&&!winner&&turn===who)shoot(q.a,q.p,who,0)},330)}
function prediction(){if(!admin().poolPrediction||phase!=='play'||moving()||winner)return null;const k=[aim,power,spin,turn,...live().map(b=>`${b.n}:${b.x.toFixed(1)}:${b.y.toFixed(1)}`)].join('|');if(k===cacheKey&&cache)return cache;cacheKey=k;return cache=simulate(aim,power,spin,6)}
function rr(a,b,c,d,r){x.beginPath();x.roundRect(a,b,c,d,r)}function diamond(a,b){x.save();x.translate(a,b);x.rotate(Math.PI/4);x.fillRect(-3,-3,6,6);x.restore()}function table(){x.clearRect(0,0,W,H);const cs=getComputedStyle(document.body),r=x.createLinearGradient(T.l-58,T.t-58,T.r+58,T.b+58);r.addColorStop(0,cs.getPropertyValue('--rail').trim()||'#9a3439');r.addColorStop(1,cs.getPropertyValue('--rail2').trim()||'#3d151b');x.save();x.shadowColor='#000b';x.shadowBlur=28;x.shadowOffsetY=12;rr(T.l-58,T.t-58,T.w+116,T.h+116,39);x.fillStyle=r;x.fill();x.restore();rr(T.l-31,T.t-31,T.w+62,T.h+62,25);x.fillStyle='#ffffff12';x.fill();const f=x.createLinearGradient(T.l,T.t,T.r,T.b);f.addColorStop(0,cs.getPropertyValue('--felt').trim()||'#1597b8');f.addColorStop(1,cs.getPropertyValue('--felt2').trim()||'#0a6986');x.fillStyle=f;x.fillRect(T.l,T.t,T.w,T.h);x.fillStyle='#f6e8c9c9';for(let i=1;i<8;i++){diamond(T.l+i*T.w/8,T.t-43);diamond(T.l+i*T.w/8,T.b+43)}for(let i=1;i<4;i++){diamond(T.l-43,T.t+i*T.h/4);diamond(T.r+43,T.t+i*T.h/4)}for(const p of PO){x.beginPath();x.arc(p.x,p.y,PR+7,0,7);x.fillStyle='#020303';x.fill();x.beginPath();x.arc(p.x,p.y,PR-5,0,7);x.fillStyle='#000';x.fill()}x.setLineDash([3,8]);x.strokeStyle='#ffffff13';x.beginPath();x.moveTo(T.l+T.w*.25,T.t+16);x.lineTo(T.l+T.w*.25,T.b-16);x.stroke();x.setLineDash([])}
function ball(b){if(b.p)return;x.save();x.translate(b.x,b.y);x.shadowColor='#0008';x.shadowBlur=7;x.shadowOffsetY=4;const base=b.n===0?'#f6f5ef':COL[b.n];x.beginPath();x.arc(0,0,R,0,7);x.fillStyle=base;x.fill();x.shadowColor='transparent';if(b.n>=9){x.save();x.beginPath();x.arc(0,0,R,0,7);x.clip();x.fillStyle='#f5f2e8';x.fillRect(-R,-R,R*2,R*.62);x.fillRect(-R,R*.38,R*2,R*.62);x.restore()}const g=x.createRadialGradient(-5,-6,1,0,0,R);g.addColorStop(0,'#ffffff80');g.addColorStop(.5,'#ffffff0f');g.addColorStop(1,'#00000038');x.beginPath();x.arc(0,0,R,0,7);x.fillStyle=g;x.fill();if(b.n){x.beginPath();x.arc(0,0,6.4,0,7);x.fillStyle='#f7f5ef';x.fill();x.fillStyle='#111';x.font='900 7px system-ui';x.textAlign='center';x.textBaseline='middle';x.fillText(b.n,0,.5)}x.restore()}
function cueDraw(){if(phase!=='play'||winner||moving())return;const b=cue(),human=mode==='practice'||mode==='2p'||turn===0;if(!b||b.p||(!human&&!admin().poolAuto))return;const ux=Math.cos(aim),uy=Math.sin(aim);if(!admin().poolPrediction){x.strokeStyle='#ffffff8c';x.lineWidth=2;x.setLineDash([7,7]);x.beginPath();x.moveTo(b.x+ux*R,b.y+uy*R);x.lineTo(b.x+ux*230,b.y+uy*230);x.stroke();x.setLineDash([])}const back=43+power*.31,a={x:b.x-ux*back,y:b.y-uy*back},z={x:b.x-ux*(back+270),y:b.y-uy*(back+270)},g=x.createLinearGradient(a.x,a.y,z.x,z.y);g.addColorStop(0,'#ead9aa');g.addColorStop(.7,'#aa713b');g.addColorStop(1,'#2a1a11');x.strokeStyle=g;x.lineWidth=8;x.lineCap='round';x.beginPath();x.moveTo(a.x,a.y);x.lineTo(z.x,z.y);x.stroke();x.lineCap='butt'}
function path(a){if(!a||a.length<2)return;x.beginPath();x.moveTo(a[0].x,a[0].y);for(let i=1;i<a.length;i++)x.lineTo(a[i].x,a[i].y);x.stroke()}function predDraw(){const p=prediction();if(!p)return;x.save();x.lineWidth=2.2;x.setLineDash([8,7]);x.strokeStyle='#6feaffdf';path(p.cuePath);x.setLineDash([5,6]);x.strokeStyle='#ffe16be8';for(const a of p.obj.values())path(a);x.setLineDash([]);const cb=p.w.find(b=>b.n===0);if(cb&&!cb.p){x.beginPath();x.arc(cb.x,cb.y,R+3,0,7);x.strokeStyle='#6feaffbf';x.stroke()}x.restore()}
function draw(){skin();table();predDraw();for(const b of balls)ball(b);cueDraw();if(admin().poolAuto&&phase==='play'&&!moving()){x.fillStyle='#7ce8ff';x.font='900 13px system-ui';x.textAlign='center';x.fillText('AUTOPILOT',CX,T.t-10)}}function frame(now){const dt=Math.min(.025,(now-last)/1000||0);last=now;if(phase==='play'){const total=dt*speed(),n=Math.max(1,Math.min(26,Math.ceil(total/.008))),z=total/n;for(let i=0;i<n;i++)physics(balls,z,shot,true);if(shot&&!moving())resolve();auto()}draw();hud();requestAnimationFrame(frame)}
addEventListener('pointerdown',()=>{if(matchMedia('(orientation:landscape)').matches)tryLandscape()},{once:true,passive:true});c.addEventListener('pointerdown',e=>{if(phase!=='play'||moving()||winner)return;const human=mode==='practice'||mode==='2p'||turn===0;if(!human||admin().poolAuto)return;drag=true;c.setPointerCapture?.(e.pointerId);const p=cssPoint(e),b=cue();aim=Math.atan2(p.y-b.y,p.x-b.x);dirty();e.preventDefault()},{passive:false});c.addEventListener('pointermove',e=>{if(!drag||phase!=='play'||moving())return;const p=cssPoint(e),b=cue();aim=Math.atan2(p.y-b.y,p.x-b.x);dirty();e.preventDefault()},{passive:false});c.addEventListener('pointerup',e=>{drag=false;c.releasePointerCapture?.(e.pointerId)});shootBtn.onclick=()=>shoot();spinBtn.onclick=spinMenu;shopBtn.onclick=()=>location.href='../shop.html';menuBtn.onclick=menu;addEventListener('keydown',e=>{if(e.code==='Space'&&!shootBtn.disabled){e.preventDefault();shoot()}});addEventListener('arcade-admin-change',()=>{dirty();autoAt=performance.now()+220});addEventListener('arcade-admin-command',e=>{if(e.detail.command==='reset')start();if(e.detail.command==='boost'&&phase==='play'&&!moving()){const q=choose(turn);if(q){aim=q.a;power=Math.round(q.p);range.value=power;syncPower();notice='Best shot loaded.'}}});addEventListener('arcade-cosmetic-change',skin);menu();syncPower();skin();requestAnimationFrame(frame);
