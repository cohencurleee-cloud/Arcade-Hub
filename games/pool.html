<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#07111e">
<title>8 Ball Pool - Arcade Hub</title>
<link rel="stylesheet" href="pool.css">
</head>
<body>
<div class="portraitGate" id="portraitGate"><div class="gateBox"><span class="phone">📱</span><h2>Rotate your phone</h2><p>8 Ball Pool is landscape-only now so the table can use the whole screen.</p></div></div>
<div class="top"><a class="menu" href="../index.html">☰</a><div class="score"><div class="player active" id="p0"><div class="avatar">YOU</div><div class="info"><div class="nameLine"><span class="lvl">65</span><span class="pname" id="n0">You</span></div><div class="group" id="g0">OPEN TABLE</div><div class="rackdots" id="d0"></div></div></div><div class="pot"></div><div class="player right" id="p1"><div class="info"><div class="nameLine"><span class="pname" id="n1">CPU</span><span class="lvl">78</span></div><div class="group" id="g1">OPEN TABLE</div><div class="rackdots" id="d1"></div></div><div class="avatar">CPU</div></div></div><button class="ballMenu" id="menuBtn">●</button></div>
<div class="rotate">Rotate sideways for the full pool layout</div><div id="stage"><canvas id="c" width="1500" height="700"></canvas></div>
<div id="power"><label>POWER</label><div class="track"><div class="fill" id="fill"></div><input id="powerRange" type="range" min="15" max="100" value="58"></div><div id="pct">58</div></div>
<div class="status" id="status">Drag on the table to aim.</div><div class="tools"><button class="small" id="cueBtn">CUE</button><button class="small" id="spinBtn">SPIN</button><button class="small" id="shopBtn">SHOP</button></div><button class="shoot" id="shootBtn">SHOOT</button>
<div class="overlay" id="overlay"><div class="panel" id="panel"></div></div>
<script src="../arcade-economy.js"></script>
<script src="../admin.js"></script>
<script src="pool-core.js"></script>
<script src="pool-ai.js"></script>
<script src="pool-render.js"></script>
</body>
</html>
