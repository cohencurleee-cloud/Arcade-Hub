<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><style>html,body{margin:0;height:100%;background:#08090d;color:#fff;font-family:system-ui;overflow:hidden}body{display:grid;place-items:center}canvas{width:min(100vw,760px);height:min(78vh,560px);background:#0e1320;touch-action:none}.top{position:fixed;top:10px;left:10px;right:86px;display:flex;justify-content:space-between;z-index:2}a,button{color:#fff;background:#171c28;border:1px solid #2b3346;padding:9px 12px;border-radius:12px;text-decoration:none;font-weight:700}.hint{position:fixed;bottom:10px;left:50%;transform:translateX(-50%);background:#171c28;padding:8px 12px;border-radius:999px;color:#bec5d6;font-size:12px;white-space:nowrap}</style></head><body><div class="top"><a href="../index.html">← Games</a><button onclick="reset()">Restart</button></div><canvas id="c" width="760" height="560"></canvas><div class="hint" id="hint">Swipe to steer</div><script src="../admin.js"></script><script>const c=document.getElementById('c'),x=c.getContext('2d'),COLS=25,ROWS=18,CELL=30,DIRS=[{x:1,y:0},{x:-1,y:0},{x:0,y:1},{x:0,y:-1}];let s,dir,food,last=0,dead=false,won=false;const admin=()=>window.ArcadeAdmin?.getSettings?.()||{god:false,speed:1,snakeAuto:false};const key=p=>p.x+','+p.y;const same=(a,b)=>a.x===b.x&&a.y===b.y;const inside=p=>p.x>=0&&p.y>=0&&p.x<COLS&&p.y<ROWS;function norm(p,wrap){return wrap?{x:(p.x+COLS)%COLS,y:(p.y+ROWS)%ROWS}:p}function spawnFood(){const free=[];for(let yy=0;yy<ROWS;yy++)for(let xx=0;xx<COLS;xx++)if(!s.some(q=>q.x===xx&&q.y===yy))free.push({x:xx,y:yy});if(!free.length){food=null;won=true;dead=true;return}food=free[Math.floor(Math.random()*free.length)]}function reset(){s=[{x:10,y:10},{x:9,y:10},{x:8,y:10}];dir={x:1,y:0};dead=false;won=false;last=0;food={x:15,y:10}}function setd(a,b){if(admin().snakeAuto)return;if(dir.x!==-a||dir.y!==-b)dir={x:a,y:b}}addEventListener('keydown',e=>{if(e.key==='ArrowUp')setd(0,-1);if(e.key==='ArrowDown')setd(0,1);if(e.key==='ArrowLeft')setd(-1,0);if(e.key==='ArrowRight')setd(1,0)});let sx,sy;c.addEventListener('pointerdown',e=>{sx=e.clientX;sy=e.clientY});c.addEventListener('pointerup',e=>{if(admin().snakeAuto)return;let dx=e.clientX-sx,dy=e.clientY-sy;if(Math.abs(dx)>Math.abs(dy))setd(dx>0?1:-1,0);else setd(0,dy>0?1:-1)});function neighbors(p,wrap){const out=[];for(const d of DIRS){let n=norm({x:p.x+d.x,y:p.y+d.y},wrap);if(wrap||inside(n))out.push(n)}return out}function findPath(start,target,body,wrap){if(!target)return null;const blocked=new Set(body.slice(0,-1).map(key));blocked.delete(key(start));const q=[start],seen=new Set([key(start)]),prev=new Map();for(let i=0;i<q.length;i++){const cur=q[i];if(same(cur,target)){const path=[];let k=key(cur);while(k!==key(start)){const node=curFromKey(k);path.unshift(node);k=prev.get(k)}return path}for(const n of neighbors(cur,wrap)){const nk=key(n);if(seen.has(nk)||blocked.has(nk))continue;seen.add(nk);prev.set(nk,key(cur));q.push(n)}}return null}function curFromKey(k){const [a,b]=k.split(',').map(Number);return{x:a,y:b}}function simulateMove(n){const eat=food&&same(n,food),body=[n,...s.map(q=>({...q}))];if(!eat)body.pop();return{body,eat}}function tailReachable(body,wrap){if(body.length<4)return true;const tail=body[body.length-1];return !!findPath(body[0],tail,body,wrap)}function freeArea(start,body,wrap){const blocked=new Set(body.slice(0,-1).map(key));blocked.delete(key(start));const q=[start],seen=new Set([key(start)]);for(let i=0;i<q.length;i++)for(const n of neighbors(q[i],wrap)){const nk=key(n);if(seen.has(nk)||blocked.has(nk))continue;seen.add(nk);q.push(n)}return seen.size}function directionTo(a,b,wrap){let dx=b.x-a.x,dy=b.y-a.y;if(wrap){if(dx>1)dx=-1;if(dx<-1)dx=1;if(dy>1)dy=-1;if(dy<-1)dy=1}return{x:Math.sign(dx),y:Math.sign(dy)}}function candidateSafe(n,wrap){if(!wrap&&!inside(n))return false;const eat=food&&same(n,food),bodyToCheck=eat?s:s.slice(0,-1);return !bodyToCheck.some(q=>same(q,n))}function autoDirection(wrap){const head=s[0];const toFood=findPath(head,food,s,wrap);if(toFood&&toFood.length){const next=toFood[0],sim=simulateMove(next);if(tailReachable(sim.body,wrap)||sim.body.length<8)return directionTo(head,next,wrap)}const toTail=findPath(head,s[s.length-1],s,wrap);if(toTail&&toTail.length){const next=toTail[0];if(candidateSafe(next,wrap))return directionTo(head,next,wrap)}let best=null,bestScore=-1e9;for(const n0 of neighbors(head,wrap)){const n=norm(n0,wrap);if(!candidateSafe(n,wrap))continue;const sim=simulateMove(n),area=freeArea(n,sim.body,wrap);const dist=food?Math.abs(n.x-food.x)+Math.abs(n.y-food.y):0;const score=area*100-dist;if(score>bestScore){bestScore=score;best=n}}return best?directionTo(head,best,wrap):null}function step(){const a=admin(),wrap=!!a.god;if(a.snakeAuto){const nd=autoDirection(wrap);if(nd)dir=nd;else if(!a.god){dead=true;return}}let h=norm({x:s[0].x+dir.x,y:s[0].y+dir.y},wrap);if(!wrap&&!inside(h)){dead=true;return}const eat=food&&same(h,food),bodyToCheck=eat?s:s.slice(0,-1);if(!a.god&&bodyToCheck.some(q=>same(q,h))){dead=true;return}s.unshift(h);if(eat)spawnFood();else s.pop()}function loop(n){const a=admin();if(n-last>95/a.speed&&!dead){last=n;step()}x.fillStyle='#0e1320';x.fillRect(0,0,760,560);for(let i=s.length-1;i>=0;i--){x.fillStyle=i===0?'#8bff9e':'#5ee18a';x.fillRect(s[i].x*CELL+5,s[i].y*CELL+5,24,24)}if(food){x.fillStyle='#ff5f6d';x.fillRect(food.x*CELL+5,food.y*CELL+5,24,24)}x.fillStyle='white';x.font='24px system-ui';x.fillText('Score '+(s.length-3),20,40);if(a.snakeAuto){x.textAlign='right';x.fillStyle='#8bff9e';x.font='800 18px system-ui';x.fillText('AUTOPILOT',735,38);x.textAlign='left';hint.textContent='Autopilot is steering'}else hint.textContent='Swipe to steer';if(dead){x.fillStyle='white';x.textAlign='center';x.font='40px system-ui';x.fillText(won?'BOARD CLEARED':'Game over — Restart',380,280);x.textAlign='left'}requestAnimationFrame(loop)}addEventListener('arcade-admin-command',e=>{if(e.detail.command==='boost'){for(let i=0;i<5;i++){const tail=s[s.length-1];s.push({...tail})}}if(e.detail.command==='reset')reset()});reset();requestAnimationFrame(loop);</script></body></html>
