<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><style>html,body{margin:0;height:100%;background:#08090d;color:#fff;font-family:system-ui;overflow:hidden}body{display:grid;place-items:center}canvas{width:min(100vw,760px);height:min(78vh,560px);background:#0e1320;touch-action:none}.top{position:fixed;top:10px;left:10px;right:86px;display:flex;justify-content:space-between;z-index:2}a,button{color:#fff;background:#171c28;border:1px solid #2b3346;padding:9px 12px;border-radius:12px;text-decoration:none;font-weight:700}.hint{position:fixed;bottom:10px;left:50%;transform:translateX(-50%);background:#171c28;padding:8px 12px;border-radius:999px;color:#bec5d6;font-size:12px;white-space:nowrap}</style></head><body><div class="top"><a href="../index.html">← Games</a><button onclick="reset()">Restart</button></div><canvas id="c" width="760" height="560"></canvas><div class="hint">Swipe to steer</div><script src="../admin.js"></script><script>const c=document.getElementById('c'),x=c.getContext('2d');let s,dir,food,last=0,dead=false;const admin=()=>window.ArcadeAdmin?.getSettings?.()||{god:false,speed:1};function reset(){s=[{x:10,y:10},{x:9,y:10},{x:8,y:10}];dir={x:1,y:0};food={x:15,y:10};dead=false;last=0}function setd(a,b){if(dir.x!==-a||dir.y!==-b)dir={x:a,y:b}}addEventListener('keydown',e=>{if(e.key==='ArrowUp')setd(0,-1);if(e.key==='ArrowDown')setd(0,1);if(e.key==='ArrowLeft')setd(-1,0);if(e.key==='ArrowRight')setd(1,0)});let sx,sy;c.addEventListener('pointerdown',e=>{sx=e.clientX;sy=e.clientY});c.addEventListener('pointerup',e=>{let dx=e.clientX-sx,dy=e.clientY-sy;if(Math.abs(dx)>Math.abs(dy))setd(dx>0?1:-1,0);else setd(0,dy>0?1:-1)});function loop(n){const a=admin();if(n-last>95/a.speed&&!dead){last=n;let h={x:s[0].x+dir.x,y:s[0].y+dir.y};if(a.god){h.x=(h.x+25)%25;h.y=(h.y+18)%18}else if(h.x<0||h.y<0||h.x>=25||h.y>=18){dead=true}if(!dead){if(!a.god&&s.some(q=>q.x===h.x&&q.y===h.y))dead=true;else{s.unshift(h);if(h.x===food.x&&h.y===food.y)food={x:Math.floor(Math.random()*25),y:Math.floor(Math.random()*18)};else s.pop()}}}x.fillStyle='#0e1320';x.fillRect(0,0,760,560);x.fillStyle='#5ee18a';s.forEach(a=>x.fillRect(a.x*30+5,a.y*30+5,24,24));x.fillStyle='#ff5f6d';x.fillRect(food.x*30+5,food.y*30+5,24,24);x.fillStyle='white';x.font='24px system-ui';x.fillText('Score '+(s.length-3),20,40);if(dead){x.font='40px system-ui';x.fillText('Game over — Restart',190,280)}requestAnimationFrame(loop)}addEventListener('arcade-admin-command',e=>{if(e.detail.command==='boost'){const tail=s[s.length-1];for(let i=0;i<5;i++)s.push({...tail})}if(e.detail.command==='reset')reset()});reset();requestAnimationFrame(loop);</script></body></html>
