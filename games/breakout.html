<!doctype html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Breakout - Arcade Hub</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07090d;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif}
#game{position:fixed;inset:0;width:100vw;height:100dvh;display:block;background:#0b1019;touch-action:none}
.top{position:fixed;z-index:30;top:max(10px,env(safe-area-inset-top));left:10px;right:82px;display:flex;align-items:center;justify-content:space-between;gap:8px;pointer-events:none}.top a,.top button{pointer-events:auto;color:#fff;background:rgba(16,20,29,.86);border:1px solid rgba(255,255,255,.14);padding:9px 11px;border-radius:12px;text-decoration:none;font-weight:800;backdrop-filter:blur(12px)}
.stats{position:fixed;z-index:20;top:max(58px,calc(env(safe-area-inset-top) + 48px));left:50%;transform:translateX(-50%);display:flex;gap:6px;align-items:center;justify-content:center;flex-wrap:wrap;width:min(96vw,820px);pointer-events:none}.stat{background:rgba(15,19,28,.72);border:1px solid rgba(255,255,255,.09);border-radius:999px;padding:6px 9px;font-size:11px;font-weight:850;backdrop-filter:blur(10px)}
#effects{position:fixed;z-index:20;bottom:max(10px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);display:flex;gap:5px;justify-content:center;flex-wrap:wrap;width:min(96vw,820px);pointer-events:none}.effect{background:rgba(17,22,32,.88);border:1px solid #3a445d;border-radius:999px;padding:6px 9px;font-size:10px;font-weight:850;white-space:nowrap}.effect.good{border-color:#4d805d}.effect.warn{border-color:#8a6544}
#overlay{position:fixed;z-index:100000;inset:0;background:rgba(4,6,10,.76);display:grid;place-items:center;padding:18px;backdrop-filter:blur(8px)}#overlay.hidden{display:none}.panel{width:min(92vw,430px);max-height:82dvh;overflow:auto;background:#111620;border:1px solid #30394d;border-radius:24px;padding:20px;box-shadow:0 30px 90px rgba(0,0,0,.55)}.panel h1,.panel h2{margin:0 0 6px}.panel p{margin:0 0 16px;color:#aeb6c7;line-height:1.45}.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.choices button,.panel .big,.settingsRow button{border:1px solid #354057;background:#1a2230;color:#fff;border-radius:14px;padding:12px 10px;font-weight:850;font-size:14px}.choices button.active{background:#eef3ff;color:#101522;border-color:#aab7d4}.panel .big{width:100%;margin-top:12px;padding:13px}.settingsRow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid #262e3e}.settingsRow small{display:block;color:#8f99ad;margin-top:3px}.toggle{min-width:90px}.legend{margin-top:14px;border-top:1px solid #262e3e;padding-top:12px;color:#9ca6b9;font-size:12px;line-height:1.55}
@media(max-width:520px){.top{right:74px}.top a,.top button{padding:8px 9px;font-size:12px}.stats{top:max(51px,calc(env(safe-area-inset-top) + 42px));gap:4px}.stat{font-size:9px;padding:5px 7px}.panel{padding:17px}.choices{gap:6px}.choices button{padding:11px 5px;font-size:12px}}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div class="top"><a href="../index.html">← Games</a><div><button id="restartBtn">Restart</button> <button id="settingsBtn">Settings</button></div></div>
<div class="stats"><div class="stat" id="livesStat">Lives 3</div><div class="stat" id="scoreStat">Score 0</div><div class="stat" id="levelStat">Level 1/5</div><div class="stat" id="difficultyStat">Normal</div><div class="stat" id="autoStat" style="display:none">AUTOPILOT</div></div>
<div id="effects"></div>
<div id="overlay"><div class="panel" id="panel"></div></div>
<script src="../admin.js"></script>
<script>
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),MAX_LEVEL=5;
let W=innerWidth,H=innerHeight,DPR=1;
const DIFFICULTIES={easy:{name:'Easy',speed:.58,paddle:.24,power:.22,rows:5},normal:{name:'Normal',speed:.70,paddle:.19,power:.17,rows:6},hard:{name:'Hard',speed:.84,paddle:.15,power:.13,rows:7}};
const POWER_TYPES=['balls','double','pierce','slow','expand','multi'];
const POWER_INFO={balls:{label:'+2 Balls',symbol:'+2',color:'#66d9ff'},double:{label:'Double Speed',symbol:'2×',color:'#ffb84d'},pierce:{label:'Pierce',symbol:'P',color:'#c797ff'},slow:{label:'Slow Motion',symbol:'S',color:'#73e5b4'},expand:{label:'Paddle Expand',symbol:'↔',color:'#6aa7ff'},multi:{label:'Multi-hit',symbol:'2H',color:'#ff7d91'}};
let difficulty='normal',phase='menu',paused=true,lives=3,score=0,level=1,bricks=[],balls=[],drops=[],particles=[],last=performance.now(),soundOn=true,launchWait=0;
let paddle={x:0,y:0,w:120,h:15},autoAimSide=1;
let effectsState={doubleUntil:0,slowUntil:0,expandUntil:0,pierceHits:0,multiActive:false};
const admin=()=>window.ArcadeAdmin?.getSettings?.()||{god:false,speed:1,breakoutAuto:false};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const now=()=>performance.now();
function cfg(){return DIFFICULTIES[difficulty]}
function baseBallSpeed(){return clamp(Math.min(W,H)*cfg().speed+(level-1)*14,220,620)}
function basePaddleWidth(){return clamp(W*cfg().paddle,72,210)}
function currentPaddleWidth(){return now()<effectsState.expandUntil?paddle.w*1.5:paddle.w}
function currentSpeedScale(){let s=admin().speed||1;if(now()<effectsState.doubleUntil)s*=2;if(now()<effectsState.slowUntil)s*=.52;return s}
function resetEffects(){effectsState={doubleUntil:0,slowUntil:0,expandUntil:0,pierceHits:0,multiActive:false}}
function beep(freq=440,dur=.05,vol=.025){if(!soundOn)return;try{const A=beep.ctx||(beep.ctx=new (window.AudioContext||window.webkitAudioContext)()),o=A.createOscillator(),g=A.createGain();o.frequency.value=freq;o.type='sine';g.gain.value=vol;o.connect(g);g.connect(A.destination);o.start();g.gain.exponentialRampToValueAtTime(.0001,A.currentTime+dur);o.stop(A.currentTime+dur)}catch{}}
function resize(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=Math.round(W*DPR);canvas.height=Math.round(H*DPR);canvas.style.width=W+'px';canvas.style.height=H+'px';ctx.setTransform(DPR,0,0,DPR,0,0);paddle.y=H-55;paddle.w=basePaddleWidth();paddle.x=clamp(paddle.x||((W-paddle.w)/2),6,W-currentPaddleWidth()-6);if(phase==='playing'||phase==='levelclear')layoutBricks(true)}
addEventListener('resize',()=>{clearTimeout(resize.t);resize.t=setTimeout(resize,80)});
function makeBall(x=paddle.x+currentPaddleWidth()/2,y=paddle.y-13,angle=-Math.PI/2,speed=baseBallSpeed(),attached=false){return{x,y,vx:Math.cos(angle)*speed,vy:Math.sin(angle)*speed,r:Math.max(6,Math.min(W,H)*.012),attached}}
function layoutBricks(keepHp=false){const old=keepHp?bricks:[],cols=W<560?8:10,rows=Math.min(9,cfg().rows+level-1),gap=W<560?5:7,margin=Math.max(9,W*.035),top=Math.max(96,H*.13),maxArea=Math.max(150,H*.36),bh=clamp((maxArea-gap*(rows-1))/rows,18,28),bw=(W-margin*2-gap*(cols-1))/cols,newBricks=[];for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){const idx=r*cols+c,prior=old[idx];let hp=1;if(level>=3&&((r+c+level)%5===0))hp=2;if(difficulty==='hard'&&level>=2&&((r*3+c)%7===0))hp=2;newBricks.push({x:margin+c*(bw+gap),y:top+r*(bh+gap),w:bw,h:bh,hp:prior?prior.hp:hp,maxHp:prior?prior.maxHp:hp,alive:prior?prior.alive:true,row:r})}bricks=newBricks}
function startGame(diff=difficulty){difficulty=diff;phase='playing';paused=false;lives=3;score=0;level=1;resetEffects();startLevel(true);hideOverlay();updateHud()}
function startLevel(first=false){drops=[];particles=[];resetEffects();autoAimSide=level%2?1:-1;paddle.w=basePaddleWidth();paddle.y=H-55;paddle.x=(W-paddle.w)/2;layoutBricks(false);balls=[makeBall(undefined,undefined,-Math.PI/2,baseBallSpeed(),true)];launchWait=.28;phase='playing';last=performance.now();if(!first)beep(620,.09,.035);updateHud()}
function restartGame(){startGame(difficulty)}
function launchAttached(){for(const b of balls)if(b.attached){b.attached=false;const auto=admin().breakoutAuto,offset=auto?autoAimSide*.58:(Math.random()-.5)*.5,a=-Math.PI/2+offset,s=baseBallSpeed();b.vx=Math.cos(a)*s;b.vy=Math.sin(a)*s;if(auto)autoAimSide*=-1;beep(540,.05)}}
function setPaddleX(px){const w=currentPaddleWidth();paddle.x=clamp(px-w/2,6,W-w-6);for(const b of balls)if(b.attached){b.x=paddle.x+w/2;b.y=paddle.y-b.r-3}}
function pointerToPaddle(e){const r=canvas.getBoundingClientRect();setPaddleX((e.clientX-r.left)*W/r.width)}
canvas.addEventListener('pointerdown',e=>{e.preventDefault();if(!admin().breakoutAuto){pointerToPaddle(e);if(phase==='playing'&&!paused)launchAttached()}},{passive:false});
canvas.addEventListener('pointermove',e=>{if(!admin().breakoutAuto&&(e.pointerType==='touch'||e.pointerType==='mouse')){e.preventDefault();pointerToPaddle(e)}},{passive:false});
addEventListener('keydown',e=>{if(admin().breakoutAuto)return;if(e.code==='Space'&&phase==='playing'){e.preventDefault();launchAttached()}if(e.key==='ArrowLeft')setPaddleX(paddle.x-30);if(e.key==='ArrowRight')setPaddleX(paddle.x+currentPaddleWidth()+30)});
function spawnDrop(brick){if(Math.random()>cfg().power)return;const type=POWER_TYPES[Math.floor(Math.random()*POWER_TYPES.length)];drops.push({x:brick.x+brick.w/2,y:brick.y+brick.h/2,vy:110,type,r:12})}
function spark(x,y,color,n=8){for(let i=0;i<n;i++)particles.push({x,y,vx:(Math.random()-.5)*170,vy:(Math.random()-.5)*170,life:.45+Math.random()*.25,color})}
function brickColor(b){const colors=['#6ab7ff','#7f8cff','#a477ff','#dd73f2','#ff7594','#ff9b66','#ffd05e','#7edc92','#64d8d2'];return colors[b.row%colors.length]}
function destroyBrick(brick,spawn=true){if(!brick.alive)return;brick.alive=false;score+=100*level;if(spawn)spawnDrop(brick);spark(brick.x+brick.w/2,brick.y+brick.h/2,brickColor(brick),9);beep(650+brick.row*35,.035,.018)}
function hitBrick(brick,ball){if(!brick.alive)return false;if(effectsState.pierceHits>0){effectsState.pierceHits--;destroyBrick(brick,true);return false}brick.hp--;if(brick.hp<=0)destroyBrick(brick,true);else{score+=25*level;spark(ball.x,ball.y,'#fff',4);beep(390,.035,.015)}return true}
function circleRect(ball,rect){const nx=clamp(ball.x,rect.x,rect.x+rect.w),ny=clamp(ball.y,rect.y,rect.y+rect.h),dx=ball.x-nx,dy=ball.y-ny;return dx*dx+dy*dy<ball.r*ball.r}
function bounceFromBrick(ball,b){const left=Math.abs((ball.x+ball.r)-b.x),right=Math.abs((b.x+b.w)-(ball.x-ball.r)),top=Math.abs((ball.y+ball.r)-b.y),bottom=Math.abs((b.y+b.h)-(ball.y-ball.r)),m=Math.min(left,right,top,bottom);if(m===left){ball.x=b.x-ball.r-1;ball.vx=-Math.abs(ball.vx)}else if(m===right){ball.x=b.x+b.w+ball.r+1;ball.vx=Math.abs(ball.vx)}else if(m===top){ball.y=b.y-ball.r-1;ball.vy=-Math.abs(ball.vy)}else{ball.y=b.y+b.h+ball.r+1;ball.vy=Math.abs(ball.vy)}}
function applyPower(type){const t=now();if(type==='balls'){const base=balls[0]||makeBall();for(const d of [-.43,.43]){const sp=Math.hypot(base.vx,base.vy)||baseBallSpeed(),ang=Math.atan2(base.vy,base.vx)+d;balls.push(makeBall(base.x,base.y,ang,sp,false))}}else if(type==='double'){effectsState.doubleUntil=Math.max(effectsState.doubleUntil,t)+7000}else if(type==='pierce'){effectsState.pierceHits+=5}else if(type==='slow'){effectsState.slowUntil=Math.max(effectsState.slowUntil,t)+8000}else if(type==='expand'){effectsState.expandUntil=Math.max(effectsState.expandUntil,t)+10000}else if(type==='multi'){effectsState.multiActive=true;for(const b of bricks)if(b.alive&&b.hp<2){b.hp=2;b.maxHp=Math.max(2,b.maxHp)}}score+=250;beep(880,.12,.04);spark(paddle.x+currentPaddleWidth()/2,paddle.y,'#fff',15)}
function reflectX(x){const min=8,max=W-8,span=max-min;if(span<=0)return W/2;let n=(x-min)%(span*2);if(n<0)n+=span*2;if(n>span)n=span*2-n;return min+n}
function predictedLanding(ball){if(ball.vy<=5)return ball.x;const t=(paddle.y-ball.y)/ball.vy;if(t<=0)return ball.x;return reflectX(ball.x+ball.vx*t)}
function runAutopilot(dt){const a=admin();autoStat.style.display=a.breakoutAuto?'block':'none';if(!a.breakoutAuto||phase!=='playing'||paused)return;launchWait-=dt;if(launchWait<=0&&balls.some(b=>b.attached))launchAttached();let target=null;const descending=balls.filter(b=>!b.attached&&b.vy>0).sort((a,b)=>b.y-a.y)[0],chosen=descending||balls.filter(b=>!b.attached)[0],catchable=drops.filter(d=>d.y>H*.38&&d.y<paddle.y+10).sort((a,b)=>b.y-a.y)[0];if(descending&&descending.y>H*.48){target=predictedLanding(descending)-autoAimSide*currentPaddleWidth()*.32}else if(catchable){target=catchable.x}else if(chosen){target=predictedLanding(chosen)-autoAimSide*currentPaddleWidth()*.28}if(target==null)target=W/2;const center=paddle.x+currentPaddleWidth()/2,maxStep=Math.max(180,W*.65)*dt,d=target-center;setPaddleX(center+clamp(d,-maxStep,maxStep))}
function loseBallsIfNeeded(){if(balls.length)return;const a=admin();if(a.god){balls=[makeBall(paddle.x+currentPaddleWidth()/2,paddle.y-16,-Math.PI/2,baseBallSpeed(),false)];return}lives--;beep(150,.18,.05);if(lives<=0){phase='gameover';showResult('Game Over',`Score ${score.toLocaleString()} • Reached level ${level}`,'Play Again',restartGame);return}resetEffects();balls=[makeBall(undefined,undefined,-Math.PI/2,baseBallSpeed(),true)];launchWait=.3;updateHud()}
function checkLevel(){if(phase!=='playing'||bricks.some(b=>b.alive))return;if(level>=MAX_LEVEL){phase='win';score+=lives*1000;showResult('You Win!',`Final score ${score.toLocaleString()} • ${cfg().name} difficulty`,'Play Again',restartGame)}else{phase='levelclear';score+=750*level;showResult(`Level ${level} Clear`,`Next up: Level ${level+1}`,'Continue',()=>{level++;hideOverlay();startLevel(false)})}updateHud()}
function update(dt){if(phase!=='playing'||paused)return;runAutopilot(dt);const scale=currentSpeedScale(),sub=5,stepDt=dt*scale/sub,w=currentPaddleWidth();for(const b of balls)if(b.attached){b.x=paddle.x+w/2;b.y=paddle.y-b.r-3}for(let k=0;k<sub;k++){for(const ball of balls){if(ball.attached)continue;ball.x+=ball.vx*stepDt;ball.y+=ball.vy*stepDt;if(ball.x-ball.r<3){ball.x=3+ball.r;ball.vx=Math.abs(ball.vx)}if(ball.x+ball.r>W-3){ball.x=W-3-ball.r;ball.vx=-Math.abs(ball.vx)}if(ball.y-ball.r<3){ball.y=3+ball.r;ball.vy=Math.abs(ball.vy)}if(ball.vy>0&&circleRect(ball,{x:paddle.x,y:paddle.y,w,h:paddle.h})){ball.y=paddle.y-ball.r-1;const auto=admin().breakoutAuto,sp=Math.hypot(ball.vx,ball.vy);let hit=(ball.x-(paddle.x+w/2))/(w/2);if(auto&&Math.abs(hit)<.42)hit=autoAimSide*.58;const angle=-Math.PI/2+clamp(hit,-1,1)*(auto?1.18:1.05);ball.vx=Math.cos(angle)*sp;ball.vy=Math.sin(angle)*sp;if(auto)autoAimSide*=-1;beep(430,.03,.012)}for(const brick of bricks){if(!brick.alive||!circleRect(ball,brick))continue;const bounce=hitBrick(brick,ball);if(bounce)bounceFromBrick(ball,brick);break}}balls=balls.filter(b=>b.y-b.r<H+30);for(const d of drops){d.y+=d.vy*stepDt;if(d.y+d.r>=paddle.y&&d.y-d.r<=paddle.y+paddle.h&&d.x>=paddle.x-5&&d.x<=paddle.x+w+5){d.caught=true;applyPower(d.type)}}drops=drops.filter(d=>!d.caught&&d.y<H+30)}for(const p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.985;p.vy*=.985;p.life-=dt}particles=particles.filter(p=>p.life>0);loseBallsIfNeeded();checkLevel();updateHud()}
function roundedRect(x0,y0,w,h,r){const rr=Math.min(r,w/2,h/2);ctx.beginPath();ctx.moveTo(x0+rr,y0);ctx.arcTo(x0+w,y0,x0+w,y0+h,rr);ctx.arcTo(x0+w,y0+h,x0,y0+h,rr);ctx.arcTo(x0,y0+h,x0,y0,rr);ctx.arcTo(x0,y0,x0+w,y0,rr);ctx.closePath()}
function drawBackground(){const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#0c1220');g.addColorStop(1,'#070b11');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);ctx.strokeStyle='rgba(255,255,255,.025)';for(let xx=30;xx<W;xx+=45){ctx.beginPath();ctx.moveTo(xx,0);ctx.lineTo(xx,H);ctx.stroke()}for(let yy=30;yy<H;yy+=45){ctx.beginPath();ctx.moveTo(0,yy);ctx.lineTo(W,yy);ctx.stroke()}}
function drawBricks(){for(const b of bricks){if(!b.alive)continue;const col=brickColor(b);ctx.save();ctx.shadowColor=col;ctx.shadowBlur=6;ctx.fillStyle=col;roundedRect(b.x,b.y,b.w,b.h,Math.min(7,b.h/3));ctx.fill();ctx.shadowBlur=0;const grad=ctx.createLinearGradient(b.x,b.y,b.x,b.y+b.h);grad.addColorStop(0,'rgba(255,255,255,.28)');grad.addColorStop(1,'rgba(0,0,0,.18)');ctx.fillStyle=grad;roundedRect(b.x+1,b.y+1,b.w-2,b.h-2,Math.min(6,b.h/3));ctx.fill();if(b.maxHp>1&&b.hp>1){ctx.strokeStyle='rgba(255,255,255,.8)';ctx.lineWidth=2;roundedRect(b.x+4,b.y+4,Math.max(1,b.w-8),Math.max(1,b.h-8),4);ctx.stroke()}ctx.restore()}}
function drawPaddle(){const w=currentPaddleWidth(),g=ctx.createLinearGradient(paddle.x,paddle.y,paddle.x+w,paddle.y);g.addColorStop(0,'#59d0ff');g.addColorStop(.5,'#8c8cff');g.addColorStop(1,'#d884ff');ctx.save();ctx.shadowColor='#6ac7ff';ctx.shadowBlur=13;ctx.fillStyle=g;roundedRect(paddle.x,paddle.y,w,paddle.h,9);ctx.fill();ctx.restore()}
function drawBalls(){for(const b of balls){ctx.save();ctx.shadowColor='#ffe680';ctx.shadowBlur=12;const g=ctx.createRadialGradient(b.x-3,b.y-3,1,b.x,b.y,b.r);g.addColorStop(0,'#fff8c4');g.addColorStop(.45,'#ffd95e');g.addColorStop(1,'#f2a82d');ctx.fillStyle=g;ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,Math.PI*2);ctx.fill();ctx.restore()}}
function drawDrops(){for(const d of drops){const info=POWER_INFO[d.type];ctx.save();ctx.shadowColor=info.color;ctx.shadowBlur=10;ctx.fillStyle=info.color;roundedRect(d.x-18,d.y-12,36,24,12);ctx.fill();ctx.shadowBlur=0;ctx.fillStyle='#0c111a';ctx.font='900 11px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(info.symbol,d.x,d.y+1);ctx.restore()}ctx.textAlign='left';ctx.textBaseline='alphabetic'}
function drawParticles(){for(const p of particles){ctx.globalAlpha=clamp(p.life/.6,0,1);ctx.fillStyle=p.color;ctx.fillRect(p.x-2,p.y-2,4,4)}ctx.globalAlpha=1}
function draw(){drawBackground();drawBricks();drawDrops();drawPaddle();drawBalls();drawParticles();if(phase==='playing'&&balls.some(b=>b.attached)){ctx.fillStyle='rgba(255,255,255,.78)';ctx.font='800 15px system-ui';ctx.textAlign='center';ctx.fillText(admin().breakoutAuto?'Autopilot launching…':'Tap to launch',W/2,paddle.y-24);ctx.textAlign='left'}}
function updateHud(){livesStat.textContent=`Lives ${lives}`;scoreStat.textContent=`Score ${score.toLocaleString()}`;levelStat.textContent=`Level ${level}/${MAX_LEVEL}`;difficultyStat.textContent=cfg().name;autoStat.style.display=admin().breakoutAuto?'block':'none';const list=[],t=now();if(t<effectsState.doubleUntil)list.push(`<span class="effect good">2× Speed ${Math.ceil((effectsState.doubleUntil-t)/1000)}s</span>`);if(t<effectsState.slowUntil)list.push(`<span class="effect good">Slow ${Math.ceil((effectsState.slowUntil-t)/1000)}s</span>`);if(t<effectsState.expandUntil)list.push(`<span class="effect good">Wide Paddle ${Math.ceil((effectsState.expandUntil-t)/1000)}s</span>`);if(effectsState.pierceHits>0)list.push(`<span class="effect good">Pierce ${effectsState.pierceHits}</span>`);if(effectsState.multiActive)list.push(`<span class="effect warn">Multi-hit</span>`);effects.innerHTML=list.join('')}
function showMenu(){phase='menu';paused=true;overlay.classList.remove('hidden');panel.innerHTML=`<h1>Breakout</h1><p>Break every brick, catch power-ups, keep your lives, and clear all ${MAX_LEVEL} levels.</p><b>Difficulty</b><div class="choices"><button data-d="easy">Easy</button><button data-d="normal" class="active">Normal</button><button data-d="hard">Hard</button></div><div class="legend">Easy: wider paddle and more power-ups.<br>Normal: balanced.<br>Hard: faster ball, smaller paddle, tougher layouts.</div><button class="big" id="startBtn">Start Game</button>`;panel.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{difficulty=b.dataset.d;panel.querySelectorAll('[data-d]').forEach(q=>q.classList.toggle('active',q.dataset.d===difficulty))});panel.querySelector('#startBtn').onclick=()=>startGame(difficulty)}
function hideOverlay(){overlay.classList.add('hidden');paused=false;last=performance.now()}
function showResult(title,text,buttonText,action){paused=true;overlay.classList.remove('hidden');panel.innerHTML=`<h2>${title}</h2><p>${text}</p><button class="big" id="resultAction">${buttonText}</button><button class="big" id="resultMenu">Change Difficulty</button>`;panel.querySelector('#resultAction').onclick=action;panel.querySelector('#resultMenu').onclick=showMenu}
function showSettings(){const wasPaused=paused;paused=true;overlay.classList.remove('hidden');panel.innerHTML=`<h2>Breakout Settings</h2><p>Gameplay options for this game.</p><div class="settingsRow"><span><b>Difficulty</b><small>Applies after restarting.</small></span><button id="cycleDifficulty">${cfg().name}</button></div><div class="settingsRow"><span><b>Sound effects</b><small>Simple in-game tones.</small></span><button id="soundToggle" class="toggle">${soundOn?'On':'Off'}</button></div><button class="big" id="settingsDone">Done</button>`;panel.querySelector('#cycleDifficulty').onclick=()=>{difficulty=difficulty==='easy'?'normal':difficulty==='normal'?'hard':'easy';panel.querySelector('#cycleDifficulty').textContent=cfg().name};panel.querySelector('#soundToggle').onclick=()=>{soundOn=!soundOn;panel.querySelector('#soundToggle').textContent=soundOn?'On':'Off'};panel.querySelector('#settingsDone').onclick=()=>{overlay.classList.add('hidden');paused=wasPaused;last=performance.now();updateHud()}}
restartBtn.onclick=restartGame;settingsBtn.onclick=showSettings;
addEventListener('arcade-admin-change',()=>updateHud());
addEventListener('arcade-admin-command',e=>{if(e.detail.command==='boost'){let n=0;for(const b of bricks)if(b.alive&&n++<6)destroyBrick(b,false);score+=600;checkLevel()}if(e.detail.command==='reset')restartGame()});
function frame(ts){const dt=Math.min(.032,(ts-last)/1000||0);last=ts;update(dt);draw();requestAnimationFrame(frame)}
resize();showMenu();requestAnimationFrame(frame);
</script>
</body>
</html>
