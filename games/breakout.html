<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><style>html,body{margin:0;height:100%;background:#08090d;color:#fff;font-family:system-ui;overflow:hidden}body{display:grid;place-items:center}canvas{width:min(100vw,760px);height:min(78vh,560px);background:#0e1320;touch-action:none}.top{position:fixed;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;z-index:2}a,button{color:#fff;background:#171c28;border:1px solid #2b3346;padding:9px 12px;border-radius:12px;text-decoration:none;font-weight:700}.hint{position:fixed;bottom:10px;left:50%;transform:translateX(-50%);background:#171c28;padding:8px 12px;border-radius:999px;color:#bec5d6;font-size:12px;white-space:nowrap}</style></head><body><div class="top"><a href="../index.html">← Games</a><button onclick="reset()">Restart</button></div><canvas id="c" width="760" height="560"></canvas><div class="hint">Move your finger left and right</div><script>const c=document.getElementById('c'),x=c.getContext('2d');let px,bx,by,vx,vy,bricks;function reset(){px=300;bx=380;by=430;vx=4;vy=-4;bricks=[];for(let r=0;r<5;r++)for(let q=0;q<9;q++)bricks.push({x:35+q*78,y:70+r*38,on:1})}c.addEventListener('pointermove',e=>{let r=c.getBoundingClientRect();px=(e.clientX-r.left)*760/r.width-70});function loop(){bx+=vx;by+=vy;if(bx<8||bx>752)vx*=-1;if(by<8)vy*=-1;if(by>520&&by<545&&bx>px&&bx<px+140)vy=-Math.abs(vy);if(by>570)reset();for(const b of bricks)if(b.on&&bx>b.x&&bx<b.x+68&&by>b.y&&by<b.y+24){b.on=0;vy*=-1}x.clearRect(0,0,760,560);x.fillStyle='#6ad1ff';x.fillRect(px,525,140,16);x.fillStyle='#ffd85a';x.beginPath();x.arc(bx,by,9,0,7);x.fill();x.fillStyle='#9c7cff';bricks.forEach(b=>b.on&&x.fillRect(b.x,b.y,68,24));requestAnimationFrame(loop)}reset();loop();</script></body></html>
