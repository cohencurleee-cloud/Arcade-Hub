<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#080a12">
<title>Memory Match - Arcade Hub</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#070910;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif}body{--accent:#a979ff;--accent2:#62d8ff;--panel:#101522;--card:#171e2d;--card2:#222b40;--muted:#98a5b8;background:radial-gradient(circle at 50% 18%,color-mix(in srgb,var(--accent) 14%,transparent),transparent 35%),linear-gradient(180deg,#090d16,#070910)}body[data-memory-skin="holo"]{--accent:#6ce7ff;--accent2:#a67bff;--card:#102532;--card2:#17374a}body[data-memory-skin="galaxy"]{--accent:#9b76ff;--accent2:#ef88ff;--card:#19132d;--card2:#2b1e49}a,button{font:inherit}.top{position:fixed;z-index:40;top:max(10px,env(safe-area-inset-top));left:10px;right:10px;display:flex;justify-content:space-between;align-items:center;gap:8px;pointer-events:none}.top a,.top button{pointer-events:auto;color:#fff;background:rgba(12,17,27,.78);border:1px solid rgba(255,255,255,.13);padding:9px 11px;border-radius:12px;text-decoration:none;font-weight:850;backdrop-filter:blur(12px)}.topActions{display:flex;gap:7px}.stats{position:fixed;z-index:25;top:max(58px,calc(env(safe-area-inset-top) + 48px));left:50%;transform:translateX(-50%);display:flex;gap:5px;max-width:94vw;pointer-events:none}.pill{white-space:nowrap;padding:6px 9px;border-radius:999px;background:rgba(10,15,24,.68);border:1px solid rgba(255,255,255,.09);color:#dbe4f3;font-size:10px;font-weight:850;backdrop-filter:blur(10px)}.gameWrap{position:fixed;inset:0;padding:max(104px,calc(env(safe-area-inset-top) + 90px)) 12px max(58px,calc(env(safe-area-inset-bottom) + 48px));display:grid;place-items:center;overflow:auto}.board{width:min(94vw,700px);display:grid;grid-template-columns:repeat(var(--cols,4),minmax(0,1fr));gap:clamp(6px,1.7vw,12px)}.card{position:relative;aspect-ratio:1;border:1px solid rgba(255,255,255,.09);border-radius:clamp(12px,2.8vw,18px);background:linear-gradient(145deg,var(--card2),var(--card));color:#fff;font-size:clamp(24px,7vw,50px);font-weight:900;box-shadow:inset 0 0 0 1px rgba(255,255,255,.025),0 10px 24px rgba(0,0,0,.22);transform:translateZ(0);transition:transform .14s ease,background .16s ease,border-color .16s ease,opacity .16s ease}.card:active{transform:scale(.96)}.card::before{content:"";position:absolute;inset:10%;border-radius:30%;border:1px solid rgba(255,255,255,.05);background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 12%,transparent),transparent)}.card .face{position:relative;z-index:1}.card.open{background:linear-gradient(145deg,color-mix(in srgb,var(--accent) 48%,#20283a),color-mix(in srgb,var(--accent2) 28%,#111827));border-color:color-mix(in srgb,var(--accent) 55%,white 10%);transform:scale(1.035)}.card.done{background:linear-gradient(145deg,color-mix(in srgb,var(--accent) 25%,#16202e),color-mix(in srgb,var(--accent2) 16%,#10151e));opacity:.56}.card.xray:not(.open):not(.done){border-color:color-mix(in srgb,var(--accent2) 40%,transparent);color:rgba(255,255,255,.58)}.card.xray:not(.open):not(.done) .face{filter:saturate(.7);opacity:.68}.hint{position:fixed;z-index:22;left:50%;bottom:max(10px,env(safe-area-inset-bottom));transform:translateX(-50%);padding:7px 11px;border-radius:999px;background:rgba(10,15,24,.72);border:1px solid rgba(255,255,255,.09);font-size:11px;font-weight:800;color:#cbd5e6;white-space:nowrap;max-width:80vw;overflow:hidden;text-overflow:ellipsis;pointer-events:none}.overlay{position:fixed;z-index:100000;inset:0;display:grid;place-items:center;background:rgba(4,6,11,.70);backdrop-filter:blur(9px);padding:18px}.overlay.hidden{display:none}.panel{width:min(92vw,440px);max-height:84dvh;overflow:auto;background:rgba(15,20,31,.98);border:1px solid rgba(255,255,255,.12);border-radius:24px;padding:20px;box-shadow:0 28px 90px #000a;text-align:center}.panel h1,.panel h2{margin:0 0 7px}.panel p{margin:0 0 14px;color:#9eabbd;line-height:1.45;font-size:13px}.modeGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}.mode{border:1px solid #303a4e;background:#161e2b;color:#fff;border-radius:14px;padding:11px 7px;font-weight:900}.mode span{display:block;color:#8f9db2;font-size:10px;margin-top:4px}.mode.active{background:#eef3ff;color:#111723;border-color:#b9c6de}.mode.active span{color:#526174}.big{width:100%;border:1px solid #344056;background:#eef3ff;color:#101522;border-radius:14px;padding:12px;font-weight:950;margin-top:8px}.big.secondary{background:#192230;color:#fff}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}.summary div{border:1px solid #273145;background:#0c121c;border-radius:13px;padding:10px 6px}.summary b{display:block;font-size:18px}.summary span{display:block;color:#8996aa;font-size:9px;font-weight:850;text-transform:uppercase;margin-top:2px}.stars{font-size:28px;letter-spacing:3px;margin:4px 0 10px}.reward{color:#f6d66d;font-weight:900}.mini{font-size:11px;color:#8290a5;margin-top:10px}@media(max-width:520px){.top a,.top button{padding:8px 9px;font-size:11px}.stats{gap:3px}.pill{font-size:9px;padding:5px 7px}.gameWrap{padding-left:8px;padding-right:8px}.board{width:min(96vw,580px)}.panel{padding:17px}.mode{padding:10px 5px;font-size:12px}}
</style>
</head>
<body>
<div class="top"><a href="../index.html">← Games</a><div class="topActions"><button id="peekBtn">Peek</button><button id="restartBtn">Restart</button></div></div>
<div class="stats"><div class="pill" id="movesHud">Moves 0</div><div class="pill" id="pairsHud">Pairs 0/8</div><div class="pill" id="timeHud">Time 0:00</div><div class="pill" id="streakHud">Streak 0</div></div>
<div class="gameWrap"><div class="board" id="board"></div></div>
<div class="hint" id="hint">Match every pair</div>
<div class="overlay" id="overlay"><div class="panel" id="panel"></div></div>
<script src="../arcade-economy.js"></script>
<script src="../admin.js"></script>
<script>
const ICONS=['🍕','🚀','👾','⚡','🎮','💎','🔥','🧠','🍉','🛸','🎯','👑','🦖','🌙','🎲','🍩','🧪','🦊'];
const MODES={classic:{name:'Classic',pairs:8,cols:4,reward:12},medium:{name:'Medium',pairs:10,cols:5,reward:20},expert:{name:'Expert',pairs:12,cols:6,reward:30}};
const BEST_KEY='memoryBestV3',ADMIN_KEY='arcadeAdminSettings';
const board=document.getElementById('board'),overlay=document.getElementById('overlay'),panel=document.getElementById('panel'),hint=document.getElementById('hint');
const movesHud=document.getElementById('movesHud'),pairsHud=document.getElementById('pairsHud'),timeHud=document.getElementById('timeHud'),streakHud=document.getElementById('streakHud'),peekBtn=document.getElementById('peekBtn'),restartBtn=document.getElementById('restartBtn');
let modeKey='classic',cards=[],first=null,lock=false,moves=0,matched=0,streak=0,state='menu',startedAt=0,finishedTime=0,peekUntil=0,peekUsed=false,autoTimer=null,runRewarded=false;
const admin=()=>window.ArcadeAdmin?.getSettings?.()||{god:false,speed:1,memoryAuto:false,memoryXray:false};
function speedValue(){const v=Number(admin().speed);return Number.isFinite(v)&&v>0?v:1}
function bests(){try{return JSON.parse(localStorage.getItem(BEST_KEY)||'{}')}catch{return{}}}
function saveBests(v){localStorage.setItem(BEST_KEY,JSON.stringify(v))}
function formatTime(ms){const sec=Math.max(0,Math.floor(ms/1000)),m=Math.floor(sec/60),s=sec%60;return `${m}:${String(s).padStart(2,'0')}`}
function currentTime(){return state==='playing'?performance.now()-startedAt:finishedTime}
function memorySkin(){return window.ArcadeEconomy?.gameCosmetic?.('memory')||(()=>{try{return JSON.parse(localStorage.getItem('arcadeGameCosmeticsV1')||'{}').memory||'default'}catch{return'default'}})()}
function applySkin(){document.body.dataset.memorySkin=memorySkin();document.documentElement.dataset.memorySkin=memorySkin()}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function mode(){return MODES[modeKey]}
function xrayOn(){return !!admin().god||!!admin().memoryXray||Date.now()<peekUntil}
function updateHud(){movesHud.textContent=`Moves ${moves}`;pairsHud.textContent=`Pairs ${matched}/${mode().pairs}`;timeHud.textContent=`Time ${formatTime(currentTime())}`;streakHud.textContent=`Streak ${streak}`;hint.textContent=admin().memoryAuto?`AUTOPILOT • ${speedValue()}x`:admin().memoryXray?'XRAY ON':peekUsed?'Match every pair':'Peek available'}
function draw(){
  applySkin();board.style.setProperty('--cols',mode().cols);const xr=xrayOn();
  board.innerHTML=cards.map(c=>{
    const visible=c.open||c.done||xr;const classes=['card',c.open?'open':'',c.done?'done':'',xr&&!c.open&&!c.done?'xray':''].filter(Boolean).join(' ');
    return `<button class="${classes}" data-i="${c.i}" aria-label="${c.done?'Matched card':visible?c.v:'Hidden card'}"><span class="face">${visible?c.v:'?'}</span></button>`
  }).join('');
  board.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{if(!admin().memoryAuto)flip(+b.dataset.i)});updateHud()
}
function buildDeck(){const values=ICONS.slice(0,mode().pairs);cards=shuffle([...values,...values]).map((v,i)=>({v,i,open:false,done:false}))}
function reset(start=true){clearTimeout(autoTimer);autoTimer=null;buildDeck();first=null;lock=false;moves=0;matched=0;streak=0;peekUntil=0;peekUsed=false;runRewarded=false;finishedTime=0;startedAt=performance.now();state=start?'playing':'menu';draw();if(admin().memoryAuto&&start)scheduleAuto(180)}
function showMenu(){state='menu';clearTimeout(autoTimer);overlay.classList.remove('hidden');const b=bests();panel.innerHTML=`<h1>Memory Match</h1><p>Match every pair, build streaks, beat your best time, and earn Arcade Coins.</p><div class="modeGrid">${Object.entries(MODES).map(([k,m])=>`<button class="mode ${k===modeKey?'active':''}" data-mode="${k}">${m.name}<span>${m.cols} columns • ${m.pairs} pairs</span></button>`).join('')}</div><div class="summary"><div><b>${b[modeKey]?.moves??'—'}</b><span>Best moves</span></div><div><b>${b[modeKey]?.time?formatTime(b[modeKey].time):'—'}</b><span>Best time</span></div><div><b>◈ ${mode().reward}</b><span>Win reward</span></div></div><button class="big" id="startBtn">Start ${mode().name}</button><a class="big secondary" style="display:block;text-decoration:none" href="../shop.html">Open Arcade Shop</a><div class="mini">Admin tools can add Memory Autopilot and XRAY.</div>`;
  panel.querySelectorAll('[data-mode]').forEach(bn=>bn.onclick=()=>{modeKey=bn.dataset.mode;showMenu()});panel.querySelector('#startBtn').onclick=()=>{overlay.classList.add('hidden');reset(true)}
}
function starsForWin(){const p=mode().pairs;if(moves<=p+1)return 3;if(moves<=Math.ceil(p*1.55))return 2;return 1}
function finish(){state='won';finishedTime=performance.now()-startedAt;clearTimeout(autoTimer);autoTimer=null;const b=bests(),old=b[modeKey]||{};b[modeKey]={moves:old.moves?Math.min(old.moves,moves):moves,time:old.time?Math.min(old.time,finishedTime):finishedTime};saveBests(b);let reward=0;if(!runRewarded){reward=mode().reward;window.ArcadeEconomy?.add?.(reward,'Memory Match win');runRewarded=true}window.ArcadeVibes?.play?.('win');const stars=starsForWin();setTimeout(()=>{overlay.classList.remove('hidden');panel.innerHTML=`<h2>Board Cleared</h2><div class="stars">${'★'.repeat(stars)}${'☆'.repeat(3-stars)}</div><p>You finished ${mode().name} in <b>${moves} moves</b> and <b>${formatTime(finishedTime)}</b>.</p><div class="summary"><div><b>${moves}</b><span>Moves</span></div><div><b>${formatTime(finishedTime)}</b><span>Time</span></div><div><b class="reward">+${reward}</b><span>Arcade Coins</span></div></div><button class="big" id="againBtn">Play Again</button><button class="big secondary" id="menuBtn">Change Mode</button>`;panel.querySelector('#againBtn').onclick=()=>{overlay.classList.add('hidden');reset(true)};panel.querySelector('#menuBtn').onclick=showMenu},Math.max(40,220/speedValue()))}
function flip(i){
  if(state!=='playing'||lock||!cards[i]||cards[i].done||cards[i].open)return;
  cards[i].open=true;window.ArcadeVibes?.play?.('level');
  if(first===null){first=i;draw();return}
  moves++;const a=first,b=i;
  if(cards[a].v===cards[b].v){cards[a].done=cards[b].done=true;matched++;streak++;first=null;window.ArcadeVibes?.play?.('score');draw();if(matched===mode().pairs)finish();else if(admin().memoryAuto)scheduleAuto(160)}
  else{streak=0;lock=true;draw();setTimeout(()=>{cards[a].open=cards[b].open=false;first=null;lock=false;draw();if(admin().memoryAuto)scheduleAuto(120)},Math.max(70,650/speedValue()))}
}
function nextAutoPair(){const groups=new Map();cards.forEach((c,i)=>{if(c.done)return;if(!groups.has(c.v))groups.set(c.v,[]);groups.get(c.v).push(i)});for(const arr of groups.values())if(arr.length>=2)return arr.slice(0,2);return null}
function scheduleAuto(delay=220){clearTimeout(autoTimer);if(!admin().memoryAuto||state!=='playing')return;autoTimer=setTimeout(autoStep,Math.max(30,delay/speedValue()))}
function autoStep(){if(!admin().memoryAuto||state!=='playing'||lock)return scheduleAuto(100);if(first!==null){const mate=cards.findIndex((c,i)=>i!==first&&!c.done&&!c.open&&c.v===cards[first].v);if(mate>=0){flip(mate);return}}const pair=nextAutoPair();if(!pair)return;if(first===null){flip(pair[0]);autoTimer=setTimeout(()=>{if(admin().memoryAuto&&state==='playing')flip(pair[1])},Math.max(45,230/speedValue()))}}
peekBtn.onclick=()=>{if(state!=='playing'||peekUsed||admin().memoryXray||admin().god)return;peekUsed=true;moves+=2;peekUntil=Date.now()+1400;draw();setTimeout(draw,1450)};
restartBtn.onclick=()=>{overlay.classList.add('hidden');reset(true)};
addEventListener('arcade-admin-change',()=>{draw();if(admin().memoryAuto)scheduleAuto(80);else{clearTimeout(autoTimer);autoTimer=null}});
addEventListener('arcade-admin-command',e=>{if(e.detail.command==='boost'){if(state==='playing'){const pair=nextAutoPair();if(pair){flip(pair[0]);setTimeout(()=>flip(pair[1]),Math.max(40,160/speedValue()))}}}if(e.detail.command==='reset'){overlay.classList.add('hidden');reset(true)}});
function setMemorySetting(key,value){let s={};try{s=JSON.parse(localStorage.getItem(ADMIN_KEY)||'{}')}catch{}s[key]=value;localStorage.setItem(ADMIN_KEY,JSON.stringify(s));window.dispatchEvent(new CustomEvent('arcade-admin-change',{detail:{settings:s}}))}
function injectMemoryAdmin(){const box=document.querySelector('#arcadeAdminPanel .box');if(!box||box.querySelector('#aaMemoryAuto'))return;const buttons=box.querySelector('.buttons');if(!buttons)return;const a=admin(),wrap=document.createElement('div');wrap.innerHTML=`<div class="row"><span><b>Memory autopilot</b><small>Automatically finds and matches every pair.</small></span><input id="aaMemoryAuto" type="checkbox" ${a.memoryAuto?'checked':''}></div><div class="row"><span><b>Memory XRAY</b><small>Shows every hidden card while still letting you play.</small></span><input id="aaMemoryXray" type="checkbox" ${a.memoryXray?'checked':''}></div>`;while(wrap.firstChild)buttons.parentNode.insertBefore(wrap.firstChild,buttons);box.querySelector('#aaMemoryAuto').onchange=e=>setMemorySetting('memoryAuto',e.target.checked);box.querySelector('#aaMemoryXray').onchange=e=>setMemorySetting('memoryXray',e.target.checked)}
new MutationObserver(injectMemoryAdmin).observe(document.body,{childList:true,subtree:true});
setInterval(()=>{if(state==='playing')updateHud()},200);
window.addEventListener('arcade-cosmetic-change',applySkin);applySkin();reset(false);showMenu();
</script>
</body>
</html>
