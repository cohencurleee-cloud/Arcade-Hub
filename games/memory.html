<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><style>html,body{margin:0;width:100%;height:100%;background:#08090d;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{display:grid;place-items:center;padding:70px 14px 40px;box-sizing:border-box}.top{position:fixed;top:12px;left:12px;right:86px;display:flex;justify-content:space-between;align-items:center}.top a,.top button{color:#fff;background:#171c28;border:1px solid #2b3346;padding:9px 12px;border-radius:12px;text-decoration:none;font-weight:700}.ui{font-weight:800}.hint{position:fixed;bottom:max(14px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);color:#c8cbda;background:rgba(0,0,0,.35);padding:8px 12px;border-radius:999px;font-size:12px}#board{width:min(92vw,620px);display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.card{aspect-ratio:1;border:0;border-radius:16px;background:#1b1f2e;color:#fff;font-size:clamp(28px,9vw,54px);box-shadow:inset 0 0 0 1px #2c3145}.card.open,.card.done{background:#342a5d}.card.done{opacity:.65}</style></head><body><div class="top"><a href="../index.html">← Games</a><div class="ui" id="score">0 moves</div><button onclick="reset()">Restart</button></div><div id="board"></div><div class="hint">Match every pair</div><script src="../admin.js"></script><script>const icons=['🍕','🚀','👾','⚡','🎮','💎','🔥','🧠'];let cards=[],first=null,lock=false,moves=0,done=0,peekUntil=0;const admin=()=>window.ArcadeAdmin?.getSettings?.()||{god:false,speed:1};function reset(){cards=[...icons,...icons].sort(()=>Math.random()-.5).map((v,i)=>({v,open:false,done:false,i}));first=null;lock=false;moves=0;done=0;peekUntil=0;draw()}function draw(){const peek=admin().god||Date.now()<peekUntil;board.innerHTML=cards.map(c=>`<button class="card ${c.open?'open':''} ${c.done?'done':''}" data-i="${c.i}">${c.open||c.done||peek?c.v:'?'}</button>`).join('');score.textContent=`${moves} moves`;document.querySelectorAll('.card').forEach(b=>b.onclick=()=>flip(+b.dataset.i))}function flip(i){if(lock||cards[i].done||cards[i].open)return;cards[i].open=true;if(first===null){first=i;draw();return}moves++;const a=first,b=i;if(cards[a].v===cards[b].v){cards[a].done=cards[b].done=true;done+=2;first=null;draw();if(done===cards.length)setTimeout(()=>alert(`You won in ${moves} moves!`),100)}else{lock=true;draw();setTimeout(()=>{cards[a].open=cards[b].open=false;first=null;lock=false;draw()},650/admin().speed)}}addEventListener('arcade-admin-change',draw);addEventListener('arcade-admin-command',e=>{if(e.detail.command==='boost'){peekUntil=Date.now()+2500;draw();setTimeout(draw,2550)}if(e.detail.command==='reset')reset()});reset();</script></body></html>
