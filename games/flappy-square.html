<!doctype html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Flappy Bird - Arcade Hub</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#08090d;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overflow:hidden}
body{display:grid;place-items:center}
canvas{display:block;width:min(100vw,432px);height:min(100vh,768px);max-height:100vh;background:#70c5ce;touch-action:none;image-rendering:pixelated;box-shadow:0 0 0 1px #222}
.top{position:fixed;z-index:20;top:max(10px,env(safe-area-inset-top));left:10px;right:86px;display:flex;justify-content:space-between;pointer-events:none}
.top a,.top button{pointer-events:auto;color:#fff;background:rgba(10,14,20,.72);border:1px solid rgba(255,255,255,.18);padding:9px 12px;border-radius:12px;text-decoration:none;font-weight:800;backdrop-filter:blur(10px)}
.hint{position:fixed;z-index:15;bottom:max(12px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:rgba(10,14,20,.72);padding:8px 12px;border-radius:999px;color:#fff;font-size:12px;white-space:nowrap;pointer-events:none}
</style>
</head>
<body>
<div class="top"><a href="../index.html">← Games</a><button id="restart">Restart</button></div>
<canvas id="c" width="432" height="768"></canvas>
<div class="hint" id="hint">Tap to flap</div>
<script src="../admin.js"></script>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const W=c.width,H=c.height,GROUND=690,BX=92,BW=44,BH=32,PIPE_W=72;
const GRAVITY=1450,FLAP=-430,MAX_FALL=680,BASE_PIPE_SPEED=155,BASE_PIPE_GAP=178,BASE_PIPE_TIME=1.48,FLAP_LOCK=.095;
const BIRD_LEFT=BX+5,BIRD_RIGHT=BX+BW-6,BIRD_CX=BX+BW/2;
let birdY=330,vel=0,pipes=[],score=0,best=+(localStorage.getItem('flappyBest')||0),state='ready',spawn=.65,last=performance.now(),wing=0,autoCooldown=0,deathAt=0,lastGapY=330;
let aiPipe=null,aiTargetY=330,aiDecisionTimer=0,aiPath=[];
function admin(){return window.ArcadeAdmin?.getSettings?.()||{god:false,speed:1,flappyAuto:false}}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function difficulty(){return Math.min(10,1+Math.floor(score/5))}
function pipeGap(){return Math.max(140,BASE_PIPE_GAP-Math.min(score,50)*.76)}
function pipeSpeed(){return BASE_PIPE_SPEED+Math.min(score,50)*1.15}
function pipeTime(){return Math.max(1.18,BASE_PIPE_TIME-Math.min(score,50)*.006)}
function reset(){birdY=330;vel=0;pipes=[];score=0;spawn=.65;state='ready';last=performance.now();wing=0;autoCooldown=0;deathAt=0;lastGapY=330;aiPipe=null;aiTargetY=330;aiDecisionTimer=0;aiPath=[]}
function flap(){vel=FLAP;wing=1;autoCooldown=FLAP_LOCK}
function startFlap(){if(state==='dead'){reset();state='playing'}else if(state==='ready')state='playing';flap()}
function die(){if(admin().god)return;state='dead';deathAt=performance.now();best=Math.max(best,score);localStorage.setItem('flappyBest',best)}
function addPipe(){
  const gap=pipeGap(),min=108+gap/2,max=GROUND-108-gap/2;
  const raw=min+Math.random()*(max-min);
  const maxStep=104;
  const gapY=clamp(raw,lastGapY-maxStep,lastGapY+maxStep);
  lastGapY=gapY;
  pipes.push({x:W+25,gapY,gap,passed:false})
}
function pipeBounds(p){return{top:p.gapY-p.gap/2,bottom:p.gapY+p.gap/2}}
function centerSafeBounds(p,pad=9){const b=pipeBounds(p);return{top:b.top+(BH-8)/2+pad,bottom:b.bottom-(BH-8)/2-pad}}
function collisionAt(centerY,p,px=p.x){const b=pipeBounds(p),top=centerY-BH/2+4,bottom=centerY+BH/2-4;return BIRD_RIGHT>px&&BIRD_LEFT<px+PIPE_W&&(top<b.top||bottom>b.bottom)}
function upcomingAt(t=0){const sp=pipeSpeed();return pipes.map(p=>({p,x:p.x-sp*t})).filter(o=>o.x+PIPE_W>BIRD_LEFT-4).sort((a,b)=>a.x-b.x)}
function targetFor(list){
  const first=list[0];if(!first)return 330;
  const safe=centerSafeBounds(first.p,10),dx=(first.x+PIPE_W/2)-BIRD_CX,time=Math.max(0,dx/pipeSpeed());
  let target=first.p.gapY;
  if(time>.95){const blend=clamp((1.55-time)/.60,.18,1);target=330+(target-330)*blend}
  if(time<.12&&list[1])target=first.p.gapY*.88+list[1].p.gapY*.12;
  return clamp(target,safe.top+4,safe.bottom-4)
}
function simulateState(s,action,step,t){
  let vy=action?FLAP:s.vy,cool=action?FLAP_LOCK:s.cool;
  cool=Math.max(0,cool-step);
  vy=Math.min(MAX_FALL,vy+GRAVITY*step);
  const y=s.y+vy*step;
  if(y-BH/2+4<1||y+BH/2-4>GROUND-1)return null;
  const list=upcomingAt(t);
  for(const o of list.slice(0,4))if(collisionAt(y,o.p,o.x))return null;
  let reward=2.2-Math.abs(vy)*.00045-(action?1.2:0);
  const first=list[0];
  if(first){
    const target=targetFor(list),dx=first.x-BIRD_RIGHT,proximity=dx<0?1:1-clamp(dx/260,0,1),safe=centerSafeBounds(first.p,7);
    reward-=Math.abs(y-target)*(.008+.070*proximity);
    const margin=Math.min(y-safe.top,safe.bottom-y);
    if(dx<120)reward+=clamp(margin,-30,28)*.10;
    if(first.x+PIPE_W<BIRD_LEFT+6)reward+=18;
  }else reward-=Math.abs(y-330)*.005;
  return{y,vy,cool,score:s.score+reward,first:s.first,path:s.path.concat([{y,t}])}
}
function chooseAI(){
  const step=.035,horizon=1.75,steps=Math.ceil(horizon/step),beamWidth=70;
  const center=birdY+BH/2;
  let beam=[{y:center,vy:vel,cool:autoCooldown,score:0,first:null,path:[]}];
  for(let i=0;i<steps;i++){
    const t=(i+1)*step,next=[];
    for(const s of beam){
      const actions=s.cool<=.0001?[0,1]:[0];
      for(const action of actions){
        const ns=simulateState(s,action,step,t);if(!ns)continue;
        ns.first=s.first===null?action:s.first;
        next.push(ns)
      }
    }
    if(!next.length)break;
    next.sort((a,b)=>b.score-a.score);beam=next.slice(0,beamWidth)
  }
  if(!beam.length)return emergencyDecision();
  beam.sort((a,b)=>b.score-a.score);aiPath=beam[0].path;return beam[0].first||0
}
function emergencyDecision(){
  const list=upcomingAt(0),center=birdY+BH/2,target=targetFor(list),first=list[0];
  if(center>GROUND-76)return 1;
  if(!first)return center>350&&vel>0?1:0;
  const safe=centerSafeBounds(first.p,8),time=Math.max(.03,(first.x-BIRD_RIGHT)/pipeSpeed());
  const horizon=clamp(time,.06,.42),no=center+vel*horizon+.5*GRAVITY*horizon*horizon,yes=center+FLAP*horizon+.5*GRAVITY*horizon*horizon;
  if(center>safe.bottom-7)return 1;
  if(no>target+8&&yes>safe.top-6)return 1;
  return 0
}
function runAIPilot(gameDt){
  const a=admin();
  if(!a.flappyAuto){hint.textContent='Tap to flap';aiPipe=null;aiPath=[];return}
  autoCooldown=Math.max(0,autoCooldown-gameDt);
  if(state==='dead'){
    hint.textContent='AI PILOT • restarting';
    if(performance.now()-deathAt>260){reset();state='playing';flap()}
    return
  }
  if(state==='ready'){state='playing';flap();return}
  const list=upcomingAt(0);aiPipe=list[0]?.p||null;aiTargetY=targetFor(list);
  aiDecisionTimer-=gameDt;
  if(aiDecisionTimer<=0){
    aiDecisionTimer=.028;
    const action=chooseAI();
    if(action&&autoCooldown<=.0001)flap()
  }
  if(autoCooldown<=.0001&&emergencyDecision())flap();
  hint.textContent=`AI PILOT • jumping • ${Number(a.speed||1).toFixed(1)}x • Lv ${difficulty()}`
}
function drawCloud(x,y,s){ctx.fillStyle='rgba(255,255,255,.72)';ctx.fillRect(x,y,34*s,15*s);ctx.fillRect(x+8*s,y-9*s,22*s,12*s);ctx.fillRect(x+18*s,y-15*s,18*s,18*s)}
function drawBackground(t){ctx.fillStyle='#70c5ce';ctx.fillRect(0,0,W,H);drawCloud(25,165,1);drawCloud(280,105,.85);drawCloud(185,260,.65);ctx.fillStyle='#d9f0d2';for(let i=0;i<8;i++){const xx=((i*66-(t*.012)%66)+66)%528-48,h=45+(i%3)*18;ctx.fillRect(xx,GROUND-92-h,48,h);ctx.fillStyle='#b5ddb6';ctx.fillRect(xx+8,GROUND-83-h,8,h-7);ctx.fillStyle='#d9f0d2'}ctx.fillStyle='#87c56b';ctx.fillRect(0,GROUND-20,W,20);ctx.fillStyle='#ded895';ctx.fillRect(0,GROUND,W,H-GROUND);ctx.fillStyle='#8fcf55';ctx.fillRect(0,GROUND,W,12);ctx.fillStyle='#5f9b35';ctx.fillRect(0,GROUND+12,W,5);ctx.fillStyle='rgba(255,255,255,.25)';for(let xx=-20;xx<W;xx+=28)ctx.fillRect(xx+(t*.04)%28,GROUND+23,14,4)}
function pipePart(x,y,w,h,top){if(h<=0)return;ctx.fillStyle='#3d3d3d';ctx.fillRect(x-3,y,w+6,h);ctx.fillStyle='#76b947';ctx.fillRect(x,y,w,h);ctx.fillStyle='#a8f05a';ctx.fillRect(x+8,y,11,h);ctx.fillStyle='#4c8430';ctx.fillRect(x+w-13,y,10,h);const capH=36,capY=top?Math.max(0,y+h-capH):y;ctx.fillStyle='#3d3d3d';ctx.fillRect(x-9,capY-3,w+18,capH+6);ctx.fillStyle='#76b947';ctx.fillRect(x-6,capY,w+12,capH);ctx.fillStyle='#b0f35d';ctx.fillRect(x+4,capY,10,capH);ctx.fillStyle='#4d8530';ctx.fillRect(x+w-4,capY,10,capH)}
function drawPipe(p){const b=pipeBounds(p);pipePart(p.x,0,PIPE_W,b.top,true);pipePart(p.x,b.bottom,PIPE_W,GROUND-b.bottom,false)}
function drawBird(){ctx.save();ctx.translate(BX+BW/2,birdY+BH/2);const rot=Math.max(-.38,Math.min(.85,vel/760));ctx.rotate(rot);ctx.translate(-BW/2,-BH/2);ctx.fillStyle='#111';ctx.fillRect(0,5,38,23);ctx.fillRect(6,1,25,30);ctx.fillRect(28,8,16,17);ctx.fillStyle='#f9e713';ctx.fillRect(4,8,24,18);ctx.fillRect(9,4,18,24);ctx.fillStyle='#ffb400';ctx.fillRect(5,wing?18:20,19,8);ctx.fillStyle='#fff';ctx.fillRect(23,4,13,14);ctx.fillStyle='#f1f1f1';ctx.fillRect(25,7,10,12);ctx.fillStyle='#111';ctx.fillRect(32,8,4,8);ctx.fillStyle='#f15a24';ctx.fillRect(32,17,12,7);ctx.fillRect(29,22,12,6);ctx.restore()}
function drawAIGuide(){if(!admin().flappyAuto||!aiPipe)return;const safe=centerSafeBounds(aiPipe,8);ctx.save();ctx.fillStyle='rgba(255,255,255,.10)';ctx.fillRect(aiPipe.x+3,safe.top,PIPE_W-6,Math.max(2,safe.bottom-safe.top));ctx.strokeStyle='rgba(255,255,255,.42)';ctx.setLineDash([5,5]);ctx.beginPath();ctx.moveTo(BX+BW+5,aiTargetY);ctx.lineTo(Math.max(BX+BW+5,aiPipe.x-4),aiTargetY);ctx.stroke();ctx.setLineDash([]);if(aiPath.length){ctx.fillStyle='rgba(255,255,255,.35)';for(let i=0;i<aiPath.length;i+=3){const p=aiPath[i];ctx.beginPath();ctx.arc(Math.min(W-8,BIRD_CX+i*3.6),p.y,1.8,0,Math.PI*2);ctx.fill()}}ctx.restore()}
function centerText(text,y,size){ctx.textAlign='center';ctx.font=`900 ${size}px system-ui`;ctx.lineWidth=5;ctx.strokeStyle='rgba(0,0,0,.35)';ctx.strokeText(text,W/2,y);ctx.fillStyle='#fff';ctx.fillText(text,W/2,y)}
function drawUI(){centerText(String(score),72,42);ctx.textAlign='right';ctx.font='800 13px system-ui';ctx.fillStyle='rgba(255,255,255,.9)';ctx.fillText(`LV ${difficulty()}`,W-18,70);if(state==='ready'){centerText('FLAPPY BIRD',250,36);centerText(admin().flappyAuto?'AI pilot ready':'Tap to start',305,21)}if(state==='dead'){ctx.fillStyle='rgba(0,0,0,.55)';ctx.fillRect(65,245,302,190);centerText('GAME OVER',292,32);ctx.textAlign='left';ctx.font='800 19px system-ui';ctx.fillStyle='#fff';ctx.fillText('Score',105,345);ctx.fillText('Best',105,385);ctx.textAlign='right';ctx.fillText(score,325,345);ctx.fillText(best,325,385);centerText(admin().flappyAuto?'AI restarting…':'Tap to restart',420,16)}}
function physicsStep(step){
  const a=admin();
  runAIPilot(step);
  if(state!=='playing')return;
  if(!a.flappyAuto)autoCooldown=Math.max(0,autoCooldown-step);
  vel=Math.min(MAX_FALL,vel+GRAVITY*step);birdY+=vel*step;wing=Math.max(0,wing-step*7);
  spawn+=step;const pTime=pipeTime();while(spawn>=pTime){spawn-=pTime;addPipe()}
  const sp=pipeSpeed();
  for(const p of pipes){p.x-=sp*step;if(!p.passed&&p.x+PIPE_W<BX){p.passed=true;score++}if(collisionAt(birdY+BH/2,p))die()}
  pipes=pipes.filter(p=>p.x>-PIPE_W-20);
  if(birdY<0){if(a.god){birdY=0;vel=0}else die()}
  if(birdY+BH>GROUND){if(a.god){birdY=GROUND-BH;vel=-160}else die()}
}
function update(dt){
  const speed=clamp(Number(admin().speed)||1,.5,2),total=dt*speed,maxStep=.008;
  const n=Math.max(1,Math.ceil(total/maxStep)),step=total/n;
  for(let i=0;i<n;i++){physicsStep(step);if(state==='dead')break}
}
function frame(now){const dt=Math.min(.033,(now-last)/1000||0);last=now;update(dt);drawBackground(now);pipes.forEach(drawPipe);drawAIGuide();drawBird();drawUI();requestAnimationFrame(frame)}
c.addEventListener('pointerdown',e=>{e.preventDefault();if(!admin().flappyAuto)startFlap()},{passive:false});
addEventListener('keydown',e=>{if(e.code==='Space'&&!admin().flappyAuto){e.preventDefault();startFlap()}});
restart.onclick=reset;
addEventListener('arcade-admin-change',()=>{if(admin().flappyAuto&&state==='ready'){state='playing';flap()}});
addEventListener('arcade-admin-command',e=>{if(e.detail.command==='boost')score+=10;if(e.detail.command==='reset')reset()});
reset();requestAnimationFrame(frame);
</script>
</body>
</html>
