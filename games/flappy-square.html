<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Flappy Bird - Arcade Hub</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#08090d;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overflow:hidden}body{display:grid;place-items:center}canvas{display:block;width:min(100vw,432px);height:min(100vh,768px);max-height:100vh;background:#70c5ce;touch-action:none;image-rendering:pixelated;box-shadow:0 0 0 1px #222}.top{position:fixed;z-index:20;top:max(10px,env(safe-area-inset-top));left:10px;right:86px;display:flex;justify-content:space-between;pointer-events:none}.top a,.top button{pointer-events:auto;color:#fff;background:rgba(10,14,20,.72);border:1px solid rgba(255,255,255,.18);padding:9px 12px;border-radius:12px;text-decoration:none;font-weight:800;backdrop-filter:blur(10px)}.hint{position:fixed;z-index:15;bottom:max(12px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:rgba(10,14,20,.72);padding:8px 12px;border-radius:999px;color:#fff;font-size:12px;white-space:nowrap;pointer-events:none}</style></head><body><div class="top"><a href="../index.html">← Games</a><button id="restart">Restart</button></div><canvas id="c" width="432" height="768"></canvas><div class="hint" id="hint">Tap to flap</div><script src="../admin.js"></script><script>const c=document.getElementById('c'),ctx=c.getContext('2d');const W=c.width,H=c.height,GROUND=690,BX=92,BW=44,BH=32,PIPE_W=72;let birdY=330,vel=0,pipes=[],score=0,best=+(localStorage.getItem('flappyBest')||0),state='ready',spawn=0,last=performance.now(),wing=0,autoCooldown=0,deathAt=0;const GRAVITY=1450,FLAP=-430,MAX_FALL=680,PIPE_SPEED=155,PIPE_GAP=178,PIPE_TIME=1.48;function admin(){return window.ArcadeAdmin?.getSettings?.()||{god:false,speed:1,flappyAuto:false}}function reset(){birdY=330;vel=0;pipes=[];score=0;spawn=.65;state='ready';last=performance.now();autoCooldown=0;deathAt=0}function startFlap(){if(state==='dead'){reset();state='playing'}else if(state==='ready')state='playing';vel=FLAP;wing=1}function die(){if(admin().god)return;state='dead';deathAt=performance.now();best=Math.max(best,score);localStorage.setItem('flappyBest',best)}function addPipe(){const margin=112,min=margin+PIPE_GAP/2,max=GROUND-margin-PIPE_GAP/2,gapY=min+Math.random()*(max-min);pipes.push({x:W+25,gapY,passed:false})}function collision(p){const left=BX+5,right=BX+BW-6,top=birdY+4,bottom=birdY+BH-4,pt=p.gapY-PIPE_GAP/2,pb=p.gapY+PIPE_GAP/2;return right>p.x&&left<p.x+PIPE_W&&(top<pt||bottom>pb)}function runAutopilot(dt){const a=admin();if(!a.flappyAuto){hint.textContent='Tap to flap';return}hint.textContent='AUTOPILOT • steering';autoCooldown=Math.max(0,autoCooldown-dt);if(state==='dead'){if(performance.now()-deathAt>650){reset();state='playing';vel=FLAP;wing=1;autoCooldown=.2}return}if(state==='ready'){state='playing';vel=FLAP;wing=1;autoCooldown=.2;return}const upcoming=pipes.filter(p=>p.x+PIPE_W>BX-6).sort((a,b)=>a.x-b.x)[0];let target=330;if(upcoming){const dx=Math.max(0,upcoming.x-BX),time=Math.min(.58,dx/(PIPE_SPEED*Math.max(.5,a.speed)));target=upcoming.gapY-8;const predicted=birdY+vel*time+.5*GRAVITY*time*time;if(predicted>target+14&&autoCooldown<=0){vel=FLAP;wing=1;autoCooldown=.13}}else{const predicted=birdY+vel*.24+.5*GRAVITY*.24*.24;if(predicted>target+28&&autoCooldown<=0){vel=FLAP;wing=1;autoCooldown=.15}}if(birdY>GROUND-110&&autoCooldown<=0){vel=FLAP;wing=1;autoCooldown=.12}}function drawCloud(x,y,s){ctx.fillStyle='rgba(255,255,255,.72)';ctx.fillRect(x,y,34*s,15*s);ctx.fillRect(x+8*s,y-9*s,22*s,12*s);ctx.fillRect(x+18*s,y-15*s,18*s,18*s)}function drawBackground(t){ctx.fillStyle='#70c5ce';ctx.fillRect(0,0,W,H);drawCloud(25,165,1);drawCloud(280,105,.85);drawCloud(185,260,.65);ctx.fillStyle='#d9f0d2';for(let i=0;i<8;i++){const xx=((i*66-(t*.012)%66)+66)%528-48,h=45+(i%3)*18;ctx.fillRect(xx,GROUND-92-h,48,h);ctx.fillStyle='#b5ddb6';ctx.fillRect(xx+8,GROUND-83-h,8,h-7);ctx.fillStyle='#d9f0d2'}ctx.fillStyle='#87c56b';ctx.fillRect(0,GROUND-20,W,20);ctx.fillStyle='#ded895';ctx.fillRect(0,GROUND,W,H-GROUND);ctx.fillStyle='#8fcf55';ctx.fillRect(0,GROUND,W,12);ctx.fillStyle='#5f9b35';ctx.fillRect(0,GROUND+12,W,5);ctx.fillStyle='rgba(255,255,255,.25)';for(let xx=-20;xx<W;xx+=28)ctx.fillRect(xx+(t*.04)%28,GROUND+23,14,4)}function drawPipe(p){const topH=p.gapY-PIPE_GAP/2,bottomY=p.gapY+PIPE_GAP/2;pipePart(p.x,0,PIPE_W,topH,true);pipePart(p.x,bottomY,PIPE_W,GROUND-bottomY,false)}function pipePart(x,y,w,h,top){if(h<=0)return;ctx.fillStyle='#3d3d3d';ctx.fillRect(x-3,y,w+6,h);ctx.fillStyle='#76b947';ctx.fillRect(x,y,w,h);ctx.fillStyle='#a8f05a';ctx.fillRect(x+8,y,11,h);ctx.fillStyle='#4c8430';ctx.fillRect(x+w-13,y,10,h);const capH=36,capY=top?Math.max(0,y+h-capH):y;ctx.fillStyle='#3d3d3d';ctx.fillRect(x-9,capY-3,w+18,capH+6);ctx.fillStyle='#76b947';ctx.fillRect(x-6,capY,w+12,capH);ctx.fillStyle='#b0f35d';ctx.fillRect(x+4,capY,10,capH);ctx.fillStyle='#4d8530';ctx.fillRect(x+w-4,capY,10,capH)}function drawBird(){ctx.save();ctx.translate(BX+BW/2,birdY+BH/2);const rot=Math.max(-.38,Math.min(.85,vel/760));ctx.rotate(rot);ctx.translate(-BW/2,-BH/2);ctx.fillStyle='#111';ctx.fillRect(0,5,38,23);ctx.fillRect(6,1,25,30);ctx.fillRect(28,8,16,17);ctx.fillStyle='#f9e713';ctx.fillRect(4,8,24,18);ctx.fillRect(9,4,18,24);ctx.fillStyle='#ffb400';ctx.fillRect(5,wing?18:20,19,8);ctx.fillStyle='#fff';ctx.fillRect(23,4,13,14);ctx.fillStyle='#f1f1f1';ctx.fillRect(25,7,10,12);ctx.fillStyle='#111';ctx.fillRect(32,8,4,8);ctx.fillStyle='#f15a24';ctx.fillRect(32,17,12,7);ctx.fillRect(29,22,12,6);ctx.restore()}function centerText(text,y,size){ctx.textAlign='center';ctx.font=`900 ${size}px system-ui`;ctx.lineWidth=5;ctx.strokeStyle='rgba(0,0,0,.35)';ctx.strokeText(text,W/2,y);ctx.fillStyle='#fff';ctx.fillText(text,W/2,y)}function drawUI(){centerText(String(score),72,42);if(state==='ready'){centerText('FLAPPY BIRD',250,36);centerText(admin().flappyAuto?'Autopilot ready':'Tap to start',305,21)}if(state==='dead'){ctx.fillStyle='rgba(0,0,0,.55)';ctx.fillRect(65,245,302,190);centerText('GAME OVER',292,32);ctx.textAlign='left';ctx.font='800 19px system-ui';ctx.fillStyle='#fff';ctx.fillText('Score',105,345);ctx.fillText('Best',105,385);ctx.textAlign='right';ctx.fillText(score,325,345);ctx.fillText(best,325,385);centerText(admin().flappyAuto?'Autopilot restarting…':'Tap to restart',420,16)}}function update(dt){runAutopilot(dt);if(state!=='playing')return;const a=admin();vel=Math.min(MAX_FALL,vel+GRAVITY*dt);birdY+=vel*dt;wing=Math.max(0,wing-dt*7);spawn+=dt*a.speed;if(spawn>=PIPE_TIME){spawn-=PIPE_TIME;addPipe()}for(const p of pipes){p.x-=PIPE_SPEED*dt*a.speed;if(!p.passed&&p.x+PIPE_W<BX){p.passed=true;score++}if(collision(p))die()}pipes=pipes.filter(p=>p.x>-PIPE_W-20);if(birdY<0){if(a.god){birdY=0;vel=0}else die()}if(birdY+BH>GROUND){if(a.god){birdY=GROUND-BH;vel=-160}else die()}}function frame(now){const dt=Math.min(.033,(now-last)/1000||0);last=now;update(dt);drawBackground(now);pipes.forEach(drawPipe);drawBird();drawUI();requestAnimationFrame(frame)}c.addEventListener('pointerdown',e=>{e.preventDefault();if(!admin().flappyAuto)startFlap()},{passive:false});addEventListener('keydown',e=>{if(e.code==='Space'&&!admin().flappyAuto){e.preventDefault();startFlap()}});restart.onclick=reset;addEventListener('arcade-admin-command',e=>{if(e.detail.command==='boost')score+=10;if(e.detail.command==='reset')reset()});reset();requestAnimationFrame(frame);</script></body></html>
