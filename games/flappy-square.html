<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><style>html,body{margin:0;height:100%;background:#08090d;color:#fff;font-family:system-ui;overflow:hidden}body{display:grid;place-items:center}canvas{width:min(100vw,760px);height:min(78vh,560px);background:#0e1320;touch-action:none}.top{position:fixed;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;z-index:2}a,button{color:#fff;background:#171c28;border:1px solid #2b3346;padding:9px 12px;border-radius:12px;text-decoration:none;font-weight:700}.hint{position:fixed;bottom:10px;left:50%;transform:translateX(-50%);background:#171c28;padding:8px 12px;border-radius:999px;color:#bec5d6;font-size:12px;white-space:nowrap}</style></head><body><div class="top"><a href="../index.html">← Games</a><button onclick="reset()">Restart</button></div><canvas id="c" width="760" height="560"></canvas><div class="hint">Tap anywhere to flap</div><script>const c=document.getElementById('c'),x=c.getContext('2d');let y,v,pipes,score,dead;function reset(){y=280;v=0;pipes=[];score=0;dead=false}function flap(){if(dead)reset();v=-8}addEventListener('pointerdown',flap);addEventListener('keydown',e=>{if(e.code==='Space')flap()});function loop(){x.clearRect(0,0,760,560);v+=.42;y+=v;if(Math.random()<.018)pipes.push({x:760,g:100+Math.random()*260,pass:false});pipes.forEach(p=>p.x-=3.5);pipes=pipes.filter(p=>p.x>-80);x.fillStyle='#57d38c';for(const p of pipes){x.fillRect(p.x,0,60,p.g);x.fillRect(p.x,p.g+150,60,560-p.g-150);if(!p.pass&&p.x<100){p.pass=true;score++}if(100+26>p.x&&100<p.x+60&&(y<p.g||y+26>p.g+150))dead=true}if(y<0||y+26>560)dead=true;x.fillStyle='#ffd85a';x.fillRect(100,y,26,26);x.fillStyle='white';x.font='28px system-ui';x.fillText(score,370,50);if(dead){x.font='42px system-ui';x.fillText('Tap to restart',245,280)}requestAnimationFrame(loop)}reset();loop();</script></body></html>
