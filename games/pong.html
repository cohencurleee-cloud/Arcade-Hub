<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><style>html,body{margin:0;height:100%;background:#08090d;color:#fff;font-family:system-ui;overflow:hidden}body{display:grid;place-items:center}canvas{width:min(100vw,760px);height:min(78vh,560px);background:#0e1320;touch-action:none}.top{position:fixed;top:10px;left:10px;right:86px;display:flex;justify-content:space-between;z-index:2}a,button{color:#fff;background:#171c28;border:1px solid #2b3346;padding:9px 12px;border-radius:12px;text-decoration:none;font-weight:700}.hint{position:fixed;bottom:10px;left:50%;transform:translateX(-50%);background:#171c28;padding:8px 12px;border-radius:999px;color:#bec5d6;font-size:12px;white-space:nowrap}</style></head><body><div class="top"><a href="../index.html">← Games</a><button onclick="reset()">Restart</button></div><canvas id="c" width="760" height="560"></canvas><div class="hint" id="hint">Move your finger up and down</div><script src="../admin.js"></script><script>const c=document.getElementById('c'),x=c.getContext('2d');let py,ay,bx,by,vx,vy,score,last=performance.now(),tickBank=0;const admin=()=>window.ArcadeAdmin?.getSettings?.()||{god:false,speed:1};function speedValue(){const v=Number(admin().speed);return Number.isFinite(v)&&v>0?v:1}function reset(){py=230;ay=230;bx=380;by=280;vx=5;vy=3;score=[0,0];last=performance.now();tickBank=0}c.addEventListener('pointermove',e=>{let r=c.getBoundingClientRect();py=(e.clientY-r.top)*560/r.height-55});function tick(){const a=admin();ay+=(by-(ay+55))*.07;bx+=vx;by+=vy;if(by<10||by>550)vy*=-1;if(bx<45&&by>py&&by<py+110){vx=Math.abs(vx)*1.03}else if(bx>715&&by>ay&&by<ay+110){vx=-Math.abs(vx)*1.03}if(bx<0){if(a.god){bx=45;vx=Math.abs(vx)}else{score[1]++;bx=380;by=280;vx=5}}if(bx>760){score[0]++;bx=380;by=280;vx=-5}}function draw(){x.clearRect(0,0,760,560);x.fillStyle='white';x.fillRect(25,py,15,110);x.fillRect(720,ay,15,110);x.beginPath();x.arc(bx,by,10,0,7);x.fill();x.font='30px system-ui';x.fillText(score[0]+'   '+score[1],345,45);hint.textContent='Move your finger up and down • '+speedValue()+'x'}function loop(ts){const dt=Math.min(.12,Math.max(0,(ts-last)/1000||0));last=ts;tickBank+=dt*60*speedValue();let steps=Math.floor(tickBank);if(steps>240){steps=240;tickBank=0}else tickBank-=steps;for(let i=0;i<steps;i++)tick();draw();requestAnimationFrame(loop)}addEventListener('arcade-admin-command',e=>{if(e.detail.command==='boost')score[0]+=3;if(e.detail.command==='reset')reset()});reset();requestAnimationFrame(loop);</script></body></html>
