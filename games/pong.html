<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#07111b">
<title>Pong - Arcade Hub</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05090f;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif}button,a{font:inherit}
#game{position:fixed;inset:0;width:100vw;height:100vh;display:block;touch-action:none;background:#07111b}@supports(height:100dvh){#game{height:100dvh}}
.top{position:fixed;z-index:50;top:max(10px,env(safe-area-inset-top));left:10px;right:86px;display:flex;justify-content:space-between;align-items:center;gap:8px;pointer-events:none}.topLeft,.topRight{display:flex;gap:7px;align-items:center}.top a,.top button{pointer-events:auto;color:#fff;background:rgba(8,14,23,.78);border:1px solid rgba(255,255,255,.14);padding:9px 11px;border-radius:12px;text-decoration:none;font-weight:850;backdrop-filter:blur(12px)}
#status{position:fixed;z-index:42;left:50%;top:max(12px,env(safe-area-inset-top));transform:translateX(-50%);padding:7px 12px;border:1px solid rgba(255,255,255,.1);border-radius:999px;background:rgba(7,12,20,.65);font-size:11px;font-weight:850;color:#d0d9e7;white-space:nowrap;pointer-events:none;backdrop-filter:blur(10px)}
#overlay{position:fixed;z-index:1000;inset:0;display:grid;place-items:center;padding:max(76px,calc(env(safe-area-inset-top) + 68px)) 16px max(88px,calc(env(safe-area-inset-bottom) + 76px));background:rgba(3,7,12,.58);backdrop-filter:blur(8px)}#overlay.hidden{display:none}
.panel{width:min(92vw,460px);max-height:76dvh;overflow:auto;-webkit-overflow-scrolling:touch;background:rgba(12,18,28,.97);border:1px solid rgba(255,255,255,.13);border-radius:24px;padding:19px;box-shadow:0 30px 100px #000b}.panel h1,.panel h2,.panel h3{margin:0 0 6px}.panel p{margin:0 0 13px;color:#a8b5c9;line-height:1.43}.panel .muted{color:#8796ac;font-size:12px}.modeGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}.modeGrid button,.choices button,.big,.skinCard{border:1px solid rgba(255,255,255,.12);background:#172131;color:#fff;border-radius:14px;padding:12px 9px;font-weight:850}.modeGrid button.active,.choices button.active{background:#eef4ff;color:#101522;border-color:#c6d3ec}.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:9px 0 12px}.big{width:100%;margin-top:9px}.statsBox{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:11px 0}.stat{border:1px solid rgba(255,255,255,.08);background:#0b111b;border-radius:13px;padding:9px 6px;text-align:center}.stat b{display:block;font-size:17px}.stat span{font-size:9px;color:#8492a8;font-weight:850;text-transform:uppercase;letter-spacing:.04em}.skinGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}.skinCard{text-align:left;padding:11px}.skinCard.selected{outline:2px solid #77ddff}.skinCard.locked{opacity:.48}.skinSwatch{height:28px;border-radius:9px;margin-bottom:8px}.skinCard small{display:block;color:#8594aa;margin-top:4px;font-weight:650;line-height:1.3}.tourRow{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:9px 0;border-top:1px solid rgba(255,255,255,.08)}
@media(max-width:640px){.top{right:78px}.top a,.top button{padding:8px 9px;font-size:11px}#status{font-size:9px;max-width:54vw;overflow:hidden;text-overflow:ellipsis}.panel{padding:16px;border-radius:20px;max-height:72dvh}.panel h1{font-size:25px}.panel p{font-size:12px}.modeGrid button,.choices button,.big{font-size:12px;padding:10px 7px}.statsBox{gap:5px}.stat{padding:7px 4px}.stat b{font-size:15px}.stat span{font-size:8px}}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div class="top"><div class="topLeft"><a href="../index.html">← Games</a></div><div class="topRight"><button id="pauseBtn">Pause</button><button id="restartBtn">Restart</button></div></div>
<div id="status">Pong</div>
<div id="overlay"><div class="panel" id="panel"></div></div>
<script src="../admin.js"></script>
<script>
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),overlay=document.getElementById('overlay'),panel=document.getElementById('panel'),statusEl=document.getElementById('status'),pauseBtn=document.getElementById('pauseBtn'),restartBtn=document.getElementById('restartBtn');
let W=innerWidth,H=innerHeight,DPR=1,last=performance.now(),phase='menu',paused=false,mode='quick',difficulty='normal',matchWinScore=7,playerScore=0,rightScore=0,rally=0,longestRally=0,serveTimer=0,serveDir=1,trail=[],pointerY=innerHeight/2,pointer2Y=innerHeight/2,keys={p1Up:false,p1Down:false,p2Up:false,p2Down:false},aiThink=0,aiTargetY=innerHeight/2,autoShotRel=.72,tournamentRound=0;const pointerSides=new Map();
const player={x:24,y:100,w:16,h:110,v:0},right={x:0,y:100,w:16,h:110,v:0},ball={x:0,y:0,vx:0,vy:0,r:8,speed:360};
const PROFILE_KEY='pongProfileV2',admin=()=>window.ArcadeAdmin?.getSettings?.()||{god:false,speed:1,pongAuto:false,pongPrediction:false};
const DIFF={easy:{name:'Easy',speed:.64,think:.31,predict:.10,error:.24,notice:.67},normal:{name:'Normal',speed:.84,think:.18,predict:.38,error:.14,notice:.55},hard:{name:'Hard',speed:1.03,think:.11,predict:.68,error:.065,notice:.44}};
const TOURNEY=[{name:'Rookie Riley',difficulty:'easy',win:5},{name:'Fast Finn',difficulty:'normal',win:5},{name:'Ace Nova',difficulty:'normal',win:6},{name:'Champion Vex',difficulty:'hard',win:7}];
const SKINS={neon:{name:'Neon',unlock:'Starter skin',a:'#8de4ff',b:'#6578ff'},crimson:{name:'Crimson',unlock:'Win 5 matches',a:'#ffb0ba',b:'#ed4164'},gold:{name:'Gold',unlock:'Win 1 tournament',a:'#fff0a2',b:'#d99a20'},galaxy:{name:'Galaxy',unlock:'Win 3 tournaments',a:'#d7a6ff',b:'#5cc9ff'}};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),lerp=(a,b,t)=>a+(b-a)*t;
function defaultProfile(){return{wins:0,losses:0,streak:0,best:0,tournaments:0,trophies:0,skin:'neon',unlocked:['neon']}}
function profile(){try{return{...defaultProfile(),...JSON.parse(localStorage.getItem(PROFILE_KEY)||'{}')}}catch{return defaultProfile()}}
function saveProfile(p){localStorage.setItem(PROFILE_KEY,JSON.stringify(p))}
function syncUnlocks(p){const u=new Set(p.unlocked||['neon']);u.add('neon');if(p.wins>=5)u.add('crimson');if(p.tournaments>=1)u.add('gold');if(p.tournaments>=3)u.add('galaxy');p.unlocked=[...u];if(!u.has(p.skin))p.skin='neon';saveProfile(p);return p}
function skin(){const p=syncUnlocks(profile());return SKINS[p.skin]||SKINS.neon}
function speedValue(){const v=Number(admin().speed);return Number.isFinite(v)&&v>0?v:1}
function sound(name){window.ArcadeVibes?.play?.(name)}
function scale(){return clamp(Math.min(W,H)/430,.72,1.55)}
function courtTop(){return Math.max(66,parseFloat(getComputedStyle(document.documentElement).fontSize)||16)}
function courtBottom(){return H-16}
function configureObjects(resetPositions=false){const s=scale(),ph=clamp(H*.17,86,150)*s/Math.max(1,s*.92),pw=clamp(W*.038,13,22);player.w=right.w=pw;player.h=right.h=ph;player.x=Math.max(18,W*.045);right.x=W-player.x-right.w;ball.r=clamp(Math.min(W,H)*.018,7,11);if(resetPositions){player.y=right.y=(H-ph)/2;pointerY=pointer2Y=H/2;ball.x=W/2;ball.y=H/2}}
function resize(){W=innerWidth;H=innerHeight;DPR=Math.min(devicePixelRatio||1,2);canvas.width=Math.max(1,Math.round(W*DPR));canvas.height=Math.max(1,Math.round(H*DPR));canvas.style.width=W+'px';canvas.style.height=H+'px';ctx.setTransform(DPR,0,0,DPR,0,0);configureObjects(phase!=='playing');if(phase==='playing'){player.y=clamp(player.y,courtTop(),courtBottom()-player.h);right.y=clamp(right.y,courtTop(),courtBottom()-right.h);right.x=W-player.x-right.w}}
addEventListener('resize',()=>{clearTimeout(resize.t);resize.t=setTimeout(resize,60)});
function rr(x,y,w,h,r){const m=Math.min(r,w/2,h/2);ctx.beginPath();ctx.moveTo(x+m,y);ctx.arcTo(x+w,y,x+w,y+h,m);ctx.arcTo(x+w,y+h,x,y+h,m);ctx.arcTo(x,y+h,x,y,m);ctx.arcTo(x,y,x+w,y,m);ctx.closePath()}
function resetPaddles(){configureObjects(true);player.v=right.v=0;aiTargetY=H/2;aiThink=0;autoShotRel=.72}
function baseBallSpeed(){return clamp(W*.92,320,620)}
function serve(dir){serveDir=dir||1;serveTimer=.9;ball.x=W/2;ball.y=(courtTop()+courtBottom())/2;ball.speed=baseBallSpeed();const a=Math.random()*.82-.41;ball.vx=Math.cos(a)*ball.speed*serveDir;ball.vy=Math.sin(a)*ball.speed;rally=0;trail=[];aiThink=0}
function beginMatch(){playerScore=rightScore=0;longestRally=0;paused=false;phase='playing';resetPaddles();serve(Math.random()<.5?-1:1);overlay.classList.add('hidden');pauseBtn.textContent='Pause';last=performance.now();updateStatus()}
function startQuick(){mode='quick';matchWinScore=7;beginMatch()}
function startTwoPlayer(){mode='2p';matchWinScore=7;beginMatch()}
function startTournament(){mode='tournament';tournamentRound=0;startTournamentRound()}
function startTournamentRound(){const r=TOURNEY[tournamentRound];difficulty=r.difficulty;matchWinScore=r.win;beginMatch()}
function modeLabel(){if(mode==='2p')return'2 Player';if(mode==='tournament')return`Tournament ${tournamentRound+1}/${TOURNEY.length}`;return DIFF[difficulty].name}
function updateStatus(){if(phase==='menu'){statusEl.textContent='Pong';return}if(phase==='gameover'){statusEl.textContent=`Final ${playerScore} - ${rightScore}`;return}const a=admin(),f=[];if(a.pongAuto&&mode!=='2p')f.push('AUTO');if(a.pongPrediction)f.push('PREDICT');statusEl.textContent=`${modeLabel()} • ${playerScore}-${rightScore} • Rally ${rally} • ${speedValue()}x${f.length?' • '+f.join(' • '):''}`}
function menuStats(){const p=syncUnlocks(profile());return`<div class="statsBox"><div class="stat"><b>${p.wins}</b><span>Wins</span></div><div class="stat"><b>${p.losses}</b><span>Losses</span></div><div class="stat"><b>${p.trophies}</b><span>Trophies</span></div><div class="stat"><b>${p.best}</b><span>Best streak</span></div></div>`}
function showMenu(){phase='menu';paused=false;overlay.classList.remove('hidden');const p=syncUnlocks(profile());panel.innerHTML=`<h1>Pong</h1><p>Quick matches, a four-round tournament, local 2 Player, and unlockable paddle skins.</p>${menuStats()}<div class="modeGrid"><button id="quickMode">Quick Match</button><button id="tourMode">Tournament</button><button id="twoMode">2 Player</button><button id="skinsMode">Paddle Skins</button></div><div class="muted">Selected skin: <b>${SKINS[p.skin].name}</b></div>`;panel.querySelector('#quickMode').onclick=showQuickMenu;panel.querySelector('#tourMode').onclick=showTournamentMenu;panel.querySelector('#twoMode').onclick=showTwoPlayerMenu;panel.querySelector('#skinsMode').onclick=showSkins;updateStatus()}
function showQuickMenu(){overlay.classList.remove('hidden');panel.innerHTML=`<h2>Quick Match</h2><p>First to 7. The CPU reacts and guesses differently on each difficulty instead of knowing the exact landing spot.</p><div class="choices"><button data-d="easy">Easy</button><button data-d="normal">Normal</button><button data-d="hard">Hard</button></div><div class="muted" id="diffNote"></div><button class="big" id="startQuick">Play</button><button class="big" id="backMenu">Back</button>`;const note=()=>difficulty==='easy'?'Slow reactions and frequent mistakes.':difficulty==='hard'?'Fast and smart, but still beatable.':'Balanced opponent with imperfect prediction.';panel.querySelector('#diffNote').textContent=note();panel.querySelectorAll('[data-d]').forEach(b=>{b.classList.toggle('active',b.dataset.d===difficulty);b.onclick=()=>{difficulty=b.dataset.d;panel.querySelectorAll('[data-d]').forEach(q=>q.classList.toggle('active',q.dataset.d===difficulty));panel.querySelector('#diffNote').textContent=note()}});panel.querySelector('#startQuick').onclick=startQuick;panel.querySelector('#backMenu').onclick=showMenu}
function showTournamentMenu(){const p=syncUnlocks(profile());panel.innerHTML=`<h2>Tournament</h2><p>Beat four opponents in a row. Winning earns a trophy and unlocks special skins.</p>${TOURNEY.map((r,i)=>`<div class="tourRow"><b>Round ${i+1}: ${r.name}</b><span class="muted">${DIFF[r.difficulty].name} • first to ${r.win}</span></div>`).join('')}<div class="muted" style="margin-top:10px">Tournament wins: <b>${p.tournaments}</b></div><button class="big" id="startTour">Start Tournament</button><button class="big" id="backMenu">Back</button>`;panel.querySelector('#startTour').onclick=startTournament;panel.querySelector('#backMenu').onclick=showMenu}
function showTwoPlayerMenu(){panel.innerHTML=`<h2>2 Player</h2><p>On touch screens, each player drags on their half. Keyboard: Player 1 uses W/S and Player 2 uses ↑/↓.</p><button class="big" id="start2p">Start 2 Player</button><button class="big" id="backMenu">Back</button>`;panel.querySelector('#start2p').onclick=startTwoPlayer;panel.querySelector('#backMenu').onclick=showMenu}
function showSkins(){const p=syncUnlocks(profile()),u=new Set(p.unlocked);panel.innerHTML=`<h2>Paddle Skins</h2><p>Unlock skins by winning matches and tournaments.</p><div class="skinGrid">${Object.entries(SKINS).map(([id,s])=>`<button class="skinCard ${p.skin===id?'selected':''} ${u.has(id)?'':'locked'}" data-skin="${id}" ${u.has(id)?'':'disabled'}><div class="skinSwatch" style="background:linear-gradient(90deg,${s.a},${s.b})"></div><b>${s.name}</b><small>${u.has(id)?'Unlocked':s.unlock}</small></button>`).join('')}</div><button class="big" id="backMenu">Back</button>`;panel.querySelectorAll('[data-skin]').forEach(b=>b.onclick=()=>{const q=syncUnlocks(profile());q.skin=b.dataset.skin;saveProfile(q);showSkins()});panel.querySelector('#backMenu').onclick=showMenu}
function finishRecorded(win){const p=syncUnlocks(profile());if(win){p.wins++;p.streak++;p.best=Math.max(p.best,p.streak)}else{p.losses++;p.streak=0}syncUnlocks(p)}
function finishMatch(win){phase='gameover';paused=false;if(mode==='2p'){overlay.classList.remove('hidden');panel.innerHTML=`<h2>${win?'Player 1':'Player 2'} Wins</h2><p>Final score ${playerScore} - ${rightScore}<br>Longest rally ${longestRally}</p><button class="big" id="again">Play Again</button><button class="big" id="menu">Main Menu</button>`;panel.querySelector('#again').onclick=startTwoPlayer;panel.querySelector('#menu').onclick=showMenu;updateStatus();return}if(mode==='tournament'){if(win){if(tournamentRound<TOURNEY.length-1){phase='gameover';overlay.classList.remove('hidden');const defeated=TOURNEY[tournamentRound].name;tournamentRound++;panel.innerHTML=`<h2>Round Won</h2><p>You beat ${defeated}. Next: ${TOURNEY[tournamentRound].name}.</p><button class="big" id="nextRound">Next Round</button><button class="big" id="quitTour">Quit Tournament</button>`;panel.querySelector('#nextRound').onclick=startTournamentRound;panel.querySelector('#quitTour').onclick=showMenu}else{const p=syncUnlocks(profile());p.tournaments++;p.trophies++;p.wins++;p.streak++;p.best=Math.max(p.best,p.streak);syncUnlocks(p);sound('win');overlay.classList.remove('hidden');panel.innerHTML=`<h2>Tournament Champion</h2><p>You beat all four opponents and earned a trophy.</p>${menuStats()}<button class="big" id="againTour">Play Tournament Again</button><button class="big" id="menu">Main Menu</button>`;panel.querySelector('#againTour').onclick=startTournament;panel.querySelector('#menu').onclick=showMenu}}else{finishRecorded(false);sound('hit');overlay.classList.remove('hidden');panel.innerHTML=`<h2>Tournament Lost</h2><p>${TOURNEY[tournamentRound].name} beat you ${rightScore}-${playerScore}. Try again from round one.</p><button class="big" id="retryTour">Retry Tournament</button><button class="big" id="menu">Main Menu</button>`;panel.querySelector('#retryTour').onclick=startTournament;panel.querySelector('#menu').onclick=showMenu}updateStatus();return}finishRecorded(win);sound(win?'win':'hit');overlay.classList.remove('hidden');panel.innerHTML=`<h2>${win?'You Win!':'You Lost'}</h2><p>Final score ${playerScore} - ${rightScore}<br>Longest rally ${longestRally}</p>${menuStats()}<button class="big" id="rematch">Rematch</button><button class="big" id="menu">Main Menu</button>`;panel.querySelector('#rematch').onclick=startQuick;panel.querySelector('#menu').onclick=showMenu;updateStatus()}
function scorePoint(leftWon){if(leftWon){playerScore++;sound('score')}else{rightScore++;sound('hit')}if(playerScore>=matchWinScore||rightScore>=matchWinScore){finishMatch(playerScore>rightScore);return}serve(leftWon?-1:1);updateStatus()}
function topBound(){return courtTop()+4}function bottomBound(){return courtBottom()-4}
function reflectY(y){const top=topBound()+ball.r,bottom=bottomBound()-ball.r,span=Math.max(1,bottom-top);let n=(y-top)%(span*2);if(n<0)n+=span*2;if(n>span)n=span*2-n;return top+n}
function predictedYAtX(targetX){if(Math.abs(ball.vx)<1)return ball.y;const t=(targetX-ball.x)/ball.vx;if(t<=0)return ball.y;return reflectY(ball.y+ball.vy*t)}
function movePlayer(dt){const a=admin(),prev=player.y,manualSpeed=clamp(H*1.25,520,980),autoSpeed=clamp(H*1.65,650,1250);if(mode!=='2p'&&a.pongAuto){let target=(topBound()+bottomBound())/2;if(ball.vx<0){const intercept=predictedYAtX(player.x+player.w+ball.r),opCenter=right.y+right.h/2;if(opCenter<(topBound()+bottomBound())*.43)autoShotRel=.82;else if(opCenter>(topBound()+bottomBound())*.57)autoShotRel=-.82;else autoShotRel=(rally%3===0?.78:rally%3===1?-.78:.56);target=intercept-autoShotRel*(player.h*.5)}const center=player.y+player.h/2;player.y+=clamp(target-center,-autoSpeed*dt,autoSpeed*dt)}else{if(keys.p1Up)player.y-=manualSpeed*dt;if(keys.p1Down)player.y+=manualSpeed*dt;if(!keys.p1Up&&!keys.p1Down){const target=pointerY-player.h/2;player.y+=clamp(target-player.y,-manualSpeed*dt,manualSpeed*dt)}}player.y=clamp(player.y,topBound(),bottomBound()-player.h);player.v=(player.y-prev)/Math.max(dt,.0001)}
function moveRight(dt){const prev=right.y;if(mode==='2p'){const sp=clamp(H*1.25,520,980);if(keys.p2Up)right.y-=sp*dt;if(keys.p2Down)right.y+=sp*dt;if(!keys.p2Up&&!keys.p2Down){const target=pointer2Y-right.h/2;right.y+=clamp(target-right.y,-sp*dt,sp*dt)}}else{const d=DIFF[difficulty],attacking=ball.vx>0,mid=(topBound()+bottomBound())/2;aiThink-=dt;if(!attacking){aiTargetY=lerp(aiTargetY,mid,.06);aiThink=0}else if(ball.x<W*d.notice){aiTargetY=lerp(aiTargetY,mid,.055)}else if(aiThink<=0){const exact=predictedYAtX(right.x-ball.r),rough=lerp(ball.y,exact,d.predict),mistake=(Math.random()*2-1)*(bottomBound()-topBound())*d.error;aiTargetY=clamp(rough+mistake,topBound()+right.h/2,bottomBound()-right.h/2);aiThink=d.think*(.8+Math.random()*.7)}const center=right.y+right.h/2,max=clamp(H*.82,350,720)*d.speed*dt;right.y+=clamp(aiTargetY-center,-max,max)}right.y=clamp(right.y,topBound(),bottomBound()-right.h);right.v=(right.y-prev)/Math.max(dt,.0001)}
function hitPaddle(p,left){let rel=clamp((ball.y-(p.y+p.h/2))/(p.h/2),-1,1);if(left&&admin().pongAuto&&mode!=='2p'&&Math.abs(rel)<.28)rel=autoShotRel;rel=clamp(rel+(p.v||0)*.00028,-.97,.97);ball.speed=Math.min(clamp(W*2.25,760,1500),ball.speed*1.04+3);const angle=rel*1.12;ball.vx=Math.cos(angle)*ball.speed*(left?1:-1);ball.vy=Math.sin(angle)*ball.speed;ball.x=left?p.x+p.w+ball.r+1:p.x-ball.r-1;rally++;longestRally=Math.max(longestRally,rally);if(!left)aiThink=0;sound('level')}
function physicsStep(dt){const a=admin();movePlayer(dt);moveRight(dt);if(serveTimer>0){serveTimer-=dt;ball.x=W/2;ball.y=(topBound()+bottomBound())/2;return}trail.push({x:ball.x,y:ball.y});if(trail.length>18)trail.shift();ball.x+=ball.vx*dt;ball.y+=ball.vy*dt;if(ball.y-ball.r<topBound()){ball.y=topBound()+ball.r;ball.vy=Math.abs(ball.vy)}else if(ball.y+ball.r>bottomBound()){ball.y=bottomBound()-ball.r;ball.vy=-Math.abs(ball.vy)}if(ball.vx<0&&ball.x-ball.r<=player.x+player.w&&ball.x+ball.r>=player.x&&ball.y+ball.r>=player.y&&ball.y-ball.r<=player.y+player.h)hitPaddle(player,true);if(ball.vx>0&&ball.x+ball.r>=right.x&&ball.x-ball.r<=right.x+right.w&&ball.y+ball.r>=right.y&&ball.y-ball.r<=right.y+right.h)hitPaddle(right,false);if(ball.x+ball.r<0){if(a.god&&mode!=='2p'){ball.x=player.x+player.w+ball.r+1;ball.vx=Math.abs(ball.vx)}else scorePoint(false)}else if(ball.x-ball.r>W)scorePoint(true)}
function update(dt){if(phase!=='playing'||paused)return;const total=dt*speedValue();if(!Number.isFinite(total)||total<=0)return;let steps=Math.max(1,Math.ceil(total/.0035));steps=Math.min(360,steps);const step=total/steps;for(let i=0;i<steps&&phase==='playing';i++)physicsStep(step);updateStatus()}
function drawArena(){const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#10253a');g.addColorStop(.42,'#0b1c2b');g.addColorStop(1,'#06101a');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);const glow=ctx.createRadialGradient(W/2,H*.2,20,W/2,H*.2,Math.max(W,H)*.7);glow.addColorStop(0,'rgba(94,170,230,.12)');glow.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=glow;ctx.fillRect(0,0,W,H);ctx.strokeStyle='rgba(255,255,255,.075)';ctx.lineWidth=1.5;ctx.strokeRect(8,topBound(),W-16,bottomBound()-topBound());ctx.setLineDash([14,16]);ctx.strokeStyle='rgba(255,255,255,.16)';ctx.beginPath();ctx.moveTo(W/2,topBound());ctx.lineTo(W/2,bottomBound());ctx.stroke();ctx.setLineDash([]);for(let i=0;i<6;i++){const y=topBound()+20+i*18;ctx.fillStyle=`rgba(110,190,255,${.06-i*.006})`;ctx.fillRect(W*.22,y,W*.56,2)}const vig=ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*.25,W/2,H/2,Math.max(W,H)*.8);vig.addColorStop(.45,'rgba(0,0,0,0)');vig.addColorStop(1,'rgba(0,0,0,.38)');ctx.fillStyle=vig;ctx.fillRect(0,0,W,H)}
function drawPrediction(){if(!admin().pongPrediction||phase!=='playing'||serveTimer>0||Math.abs(ball.vx)<1)return;let px=ball.x,py=ball.y,vx=ball.vx,vy=ball.vy;const targetX=vx<0?player.x+player.w+ball.r:right.x-ball.r,pts=[{x:px,y:py}],dt=.012;for(let i=0;i<520;i++){px+=vx*dt;py+=vy*dt;if(py-ball.r<topBound()){py=topBound()+ball.r;vy=Math.abs(vy)}else if(py+ball.r>bottomBound()){py=bottomBound()-ball.r;vy=-Math.abs(vy)}if(i%7===0)pts.push({x:px,y:py});if((vx<0&&px<=targetX)||(vx>0&&px>=targetX)){pts.push({x:targetX,y:predictedYAtX(targetX)});break}}if(pts.length<2)return;ctx.save();ctx.strokeStyle='rgba(116,229,255,.72)';ctx.lineWidth=2.5;ctx.setLineDash([9,9]);ctx.beginPath();ctx.moveTo(pts[0].x,pts[0].y);for(let i=1;i<pts.length;i++)ctx.lineTo(pts[i].x,pts[i].y);ctx.stroke();ctx.setLineDash([]);const e=pts[pts.length-1];ctx.fillStyle='rgba(116,229,255,.95)';ctx.beginPath();ctx.arc(e.x,e.y,5.5,0,Math.PI*2);ctx.fill();ctx.restore()}
function drawPaddle(p,isLeft){const s=isLeft?skin():{a:'#ffb3c4',b:'#d96cff'};ctx.save();ctx.shadowColor=s.a;ctx.shadowBlur=16;const g=ctx.createLinearGradient(p.x,p.y,p.x+p.w,p.y);g.addColorStop(0,s.a);g.addColorStop(1,s.b);ctx.fillStyle=g;rr(p.x,p.y,p.w,p.h,Math.min(10,p.w*.55));ctx.fill();ctx.shadowBlur=0;ctx.fillStyle='rgba(255,255,255,.24)';rr(p.x+2,p.y+4,Math.max(2,p.w-4),Math.max(7,p.h*.14),6);ctx.fill();ctx.fillStyle='rgba(0,0,0,.16)';rr(p.x+2,p.y+p.h*.68,Math.max(2,p.w-4),p.h*.22,6);ctx.fill();ctx.restore()}
function drawBall(){for(let i=0;i<trail.length;i++){const t=trail[i],a=(i+1)/trail.length*.16;ctx.fillStyle=`rgba(255,242,170,${a})`;ctx.beginPath();ctx.arc(t.x,t.y,ball.r*(.35+.55*i/trail.length),0,Math.PI*2);ctx.fill()}ctx.save();ctx.shadowColor='rgba(255,238,147,.9)';ctx.shadowBlur=18;const g=ctx.createRadialGradient(ball.x-ball.r*.25,ball.y-ball.r*.3,1,ball.x,ball.y,ball.r);g.addColorStop(0,'#fffef0');g.addColorStop(.5,'#fff0a0');g.addColorStop(1,'#e8b83d');ctx.fillStyle=g;ctx.beginPath();ctx.arc(ball.x,ball.y,ball.r,0,Math.PI*2);ctx.fill();ctx.restore()}
function drawScore(){const y=topBound()+48,fs=clamp(Math.min(W,H)*.11,36,62);ctx.textAlign='center';ctx.font=`900 ${fs}px system-ui`;ctx.fillStyle='rgba(255,255,255,.94)';ctx.fillText(playerScore,W/2-fs*1.25,y);ctx.fillText(rightScore,W/2+fs*1.25,y);ctx.font=`800 ${clamp(fs*.2,10,13)}px system-ui`;ctx.fillStyle='rgba(255,255,255,.48)';ctx.fillText(mode==='2p'?'P1':'YOU',W/2-fs*1.25,y+25);ctx.fillText(mode==='2p'?'P2':'CPU',W/2+fs*1.25,y+25);if(serveTimer>0&&phase==='playing'){ctx.font=`900 ${clamp(W*.045,16,24)}px system-ui`;ctx.fillStyle='rgba(255,255,255,.8)';ctx.fillText('GET READY',W/2,(topBound()+bottomBound())/2-24)}if(admin().pongAuto&&mode!=='2p'&&phase==='playing'){ctx.font='900 12px system-ui';ctx.fillStyle='rgba(115,229,255,.9)';ctx.fillText('AUTOPILOT',W/2,y+52)}if(paused){ctx.fillStyle='rgba(0,0,0,.48)';ctx.fillRect(0,0,W,H);ctx.font=`900 ${clamp(W*.1,34,54)}px system-ui`;ctx.fillStyle='#fff';ctx.fillText('PAUSED',W/2,H/2)}}
function draw(){drawArena();drawPrediction();drawPaddle(player,true);drawPaddle(right,false);drawBall();drawScore()}
function frame(ts){const dt=Math.min(.04,Math.max(0,(ts-last)/1000||0));last=ts;update(dt);draw();requestAnimationFrame(frame)}
function localPoint(e){const r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left),y:(e.clientY-r.top)}}
canvas.addEventListener('pointerdown',e=>{if(phase!=='playing')return;const p=localPoint(e),side=p.x<W/2?'left':'right';pointerSides.set(e.pointerId,side);canvas.setPointerCapture?.(e.pointerId);if(side==='left'){if(!(admin().pongAuto&&mode!=='2p'))pointerY=p.y}else if(mode==='2p')pointer2Y=p.y;e.preventDefault()},{passive:false});
canvas.addEventListener('pointermove',e=>{if(phase!=='playing')return;const side=pointerSides.get(e.pointerId),p=localPoint(e);if(side==='left'){if(!(admin().pongAuto&&mode!=='2p'))pointerY=p.y}else if(side==='right'&&mode==='2p')pointer2Y=p.y;if(side)e.preventDefault()},{passive:false});
const clearPointer=e=>pointerSides.delete(e.pointerId);canvas.addEventListener('pointerup',clearPointer);canvas.addEventListener('pointercancel',clearPointer);
addEventListener('keydown',e=>{if(e.code==='Space'&&phase==='playing'){paused=!paused;pauseBtn.textContent=paused?'Resume':'Pause';last=performance.now();e.preventDefault();return}if(e.key==='w'||e.key==='W'){keys.p1Up=true;e.preventDefault()}if(e.key==='s'||e.key==='S'){keys.p1Down=true;e.preventDefault()}if(e.key==='ArrowUp'){if(mode==='2p')keys.p2Up=true;else if(!(admin().pongAuto&&mode!=='2p'))keys.p1Up=true;e.preventDefault()}if(e.key==='ArrowDown'){if(mode==='2p')keys.p2Down=true;else if(!(admin().pongAuto&&mode!=='2p'))keys.p1Down=true;e.preventDefault()}});
addEventListener('keyup',e=>{if(e.key==='w'||e.key==='W')keys.p1Up=false;if(e.key==='s'||e.key==='S')keys.p1Down=false;if(e.key==='ArrowUp'){keys.p1Up=false;keys.p2Up=false}if(e.key==='ArrowDown'){keys.p1Down=false;keys.p2Down=false}});
pauseBtn.onclick=()=>{if(phase!=='playing')return;paused=!paused;pauseBtn.textContent=paused?'Resume':'Pause';last=performance.now()};restartBtn.onclick=()=>{if(phase==='playing'||phase==='gameover'){if(mode==='tournament')startTournamentRound();else if(mode==='2p')startTwoPlayer();else startQuick()}else showMenu()};
addEventListener('arcade-admin-change',()=>{keys.p1Up=keys.p1Down=keys.p2Up=keys.p2Down=false;updateStatus()});addEventListener('arcade-admin-command',e=>{if(e.detail.command==='boost'){playerScore=Math.min(matchWinScore-1,playerScore+3);updateStatus()}if(e.detail.command==='reset'){if(mode==='tournament')startTournamentRound();else if(mode==='2p')startTwoPlayer();else startQuick()}});
resize();showMenu();requestAnimationFrame(frame);
</script>
