<!doctype html>
<html lang="en">
<head>

<title>Pong - Arcade Hub</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05080d;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif}button,a{font:inherit}
#viewport{position:fixed;inset:0;display:grid;place-items:center;background:radial-gradient(circle at 50% 18%,#15283d 0,#09111c 48%,#04070c 100%);overflow:hidden}
#gameWrap{position:relative;width:min(100vw,calc(100vh * 16 / 9));height:min(100vh,calc(100vw * 9 / 16));max-width:100vw;max-height:100vh;overflow:hidden;background:#07101a;box-shadow:0 0 90px #000a}
@supports(height:100dvh){#gameWrap{width:min(100vw,calc(100dvh * 16 / 9));height:min(100dvh,calc(100vw * 9 / 16));max-height:100dvh}}
#game{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}.top{position:absolute;z-index:40;top:max(10px,env(safe-area-inset-top));left:10px;right:78px;display:flex;justify-content:space-between;align-items:center;gap:8px;pointer-events:none}.topLeft,.topRight{display:flex;gap:7px;align-items:center}.top a,.top button{pointer-events:auto;color:#fff;background:rgba(9,14,23,.76);border:1px solid rgba(255,255,255,.14);padding:9px 11px;border-radius:12px;text-decoration:none;font-weight:850;backdrop-filter:blur(12px)}
#status{position:absolute;z-index:35;left:50%;top:max(11px,env(safe-area-inset-top));transform:translateX(-50%);padding:7px 12px;border:1px solid rgba(255,255,255,.1);border-radius:999px;background:rgba(7,11,18,.64);font-size:11px;font-weight:850;color:#cbd6e7;white-space:nowrap;pointer-events:none;backdrop-filter:blur(10px)}
#overlay{position:absolute;z-index:100;inset:0;display:grid;place-items:center;padding:18px;background:rgba(3,6,10,.64);backdrop-filter:blur(9px)}#overlay.hidden{display:none}.panel{width:min(92%,460px);max-height:min(88%,610px);overflow:auto;background:rgba(12,18,28,.97);border:1px solid rgba(255,255,255,.12);border-radius:24px;padding:19px;box-shadow:0 28px 90px #000b}.panel h1,.panel h2,.panel h3{margin:0 0 6px}.panel p{margin:0 0 13px;color:#a8b4c7;line-height:1.43}.panel .muted{color:#8492a8;font-size:12px}
.modeGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}.modeGrid button,.choices button,.big,.skinCard{border:1px solid rgba(255,255,255,.12);background:#172131;color:#fff;border-radius:14px;padding:12px 9px;font-weight:850}.modeGrid button.active,.choices button.active{background:#eef4ff;color:#101522;border-color:#c6d3ec}.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:9px 0 12px}.big{width:100%;margin-top:9px}.statsBox{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:11px 0}.stat{border:1px solid rgba(255,255,255,.08);background:#0b111b;border-radius:13px;padding:9px 6px;text-align:center}.stat b{display:block;font-size:17px}.stat span{font-size:9px;color:#8492a8;font-weight:850;text-transform:uppercase;letter-spacing:.04em}
.skinGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}.skinCard{text-align:left;padding:11px}.skinCard.selected{outline:2px solid #77ddff}.skinCard.locked{opacity:.48}.skinSwatch{height:28px;border-radius:9px;margin-bottom:8px}.skinCard small{display:block;color:#8594aa;margin-top:4px;font-weight:650;line-height:1.3}.tourRow{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:9px 0;border-top:1px solid rgba(255,255,255,.08)}
@media(max-width:640px){.top{right:72px}.top a,.top button{padding:8px 9px;font-size:11px}#status{font-size:9px;top:max(9px,env(safe-area-inset-top));max-width:58%;overflow:hidden;text-overflow:ellipsis}.panel{padding:15px;border-radius:19px}.panel h1{font-size:23px}.panel p{font-size:12px}.modeGrid button,.choices button,.big{font-size:12px;padding:10px 7px}.statsBox{gap:5px}.stat{padding:7px 4px}.stat b{font-size:15px}.stat span{font-size:8px}}

<body>
<div id="viewport"><div id="gameWrap"><canvas id="game"></canvas><div class="top"><div class="topLeft"><a href="../index.html">← Games</a></div><div class="topRight"><button id="pauseBtn">Pause</button><button id="restartBtn">Restart</button></div></div><div id="status">Pong</div><div id="overlay"><div class="panel" id="panel"></div></div></div></div>
<script src="../admin.js"></script>
<script>
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),wrap=document.getElementById('gameWrap'),overlay=document.getElementById('overlay'),panel=document.getElementById('panel'),statusEl=document.getElementById('status'),pauseBtn=document.getElementById('pauseBtn'),restartBtn=document.getElementById('restartBtn');
const VW=960,VH=540;let last=performance.now(),phase='menu',paused=false,mode='quick',difficulty='normal',matchWinScore=7,playerScore=0,rightScore=0,rally=0,longestRally=0,serveTimer=0,serveDir=1,trail=[],pointerY=VH/2,pointer2Y=VH/2,keys={p1Up:false,p1Down:false,p2Up:false,p2Down:false},aiThink=0,aiTargetY=VH/2,autoShotRel=.72,tournamentRound=0;const pointerSides=new Map();
const player={x:34,y:VH/2-62,w:20,h:124,v:0},right={x:VW-54,y:VH/2-62,w:20,h:124,v:0},ball={x:VW/2,y:VH/2,vx:0,vy:0,r:9,speed:400};
const PROFILE_KEY='pongProfileV2',admin=()=>window.ArcadeAdmin?.getSettings?.()||{god:false,speed:1,pongAuto:false,pongPrediction:false};
const DIFF={easy:{name:'Easy',aiSpeed:225,think:.30,predict:.10,error:132,notice:680},normal:{name:'Normal',aiSpeed:315,think:.18,predict:.36,error:72,notice:560},hard:{name:'Hard',aiSpeed:405,think:.11,predict:.66,error:34,notice:450}};
const TOURNEY=[{name:'Rookie Riley',difficulty:'easy',win:5},{name:'Fast Finn',difficulty:'normal',win:5},{name:'Ace Nova',difficulty:'normal',win:6},{name:'Champion Vex',difficulty:'hard',win:7}];
const SKINS={neon:{name:'Neon',unlock:'Starter skin',a:'#8de4ff',b:'#6578ff'},crimson:{name:'Crimson',unlock:'Win 5 matches',a:'#ffb0ba',b:'#ed4164'},gold:{name:'Gold',unlock:'Win 1 tournament',a:'#fff0a2',b:'#d99a20'},galaxy:{name:'Galaxy',unlock:'Win 3 tournaments',a:'#d7a6ff',b:'#5cc9ff'}};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),lerp=(a,b,t)=>a+(b-a)*t;
function defaultProfile(){return{wins:0,losses:0,streak:0,best:0,tournaments:0,trophies:0,skin:'neon',unlocked:['neon']}}function profile(){try{return{...defaultProfile(),...JSON.parse(localStorage.getItem(PROFILE_KEY)||'{}')}}catch{return defaultProfile()}}function saveProfile(p){localStorage.setItem(PROFILE_KEY,JSON.stringify(p))}function syncUnlocks(p){const u=new Set(p.unlocked||['neon']);u.add('neon');if(p.wins>=5)u.add('crimson');if(p.tournaments>=1)u.add('gold');if(p.tournaments>=3)u.add('galaxy');p.unlocked=[...u];if(!u.has(p.skin))p.skin='neon';saveProfile(p);return p}function skin(){const p=syncUnlocks(profile());return SKINS[p.skin]||SKINS.neon}function speedValue(){const v=Number(admin().speed);return Number.isFinite(v)&&v>0?v:1}function sound(name){window.ArcadeVibes?.play?.(name)}
function rr(x,y,w,h,r){const m=Math.min(r,w/2,h/2);ctx.beginPath();ctx.moveTo(x+m,y);ctx.arcTo(x+w,y,x+w,y+h,m);ctx.arcTo(x+w,y+h,x,y+h,m);ctx.arcTo(x,y+h,x,y,m);ctx.arcTo(x,y,x+w,y,m);ctx.closePath()}function resize(){const r=wrap.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);canvas.width=Math.max(1,Math.round(r.width*d));canvas.height=Math.max(1,Math.round(r.height*d));ctx.setTransform(canvas.width/VW,0,0,canvas.height/VH,0,0)}addEventListener('resize',()=>{clearTimeout(resize.t);resize.t=setTimeout(resize,60)});
function resetPaddles(){player.y=VH/2-player.h/2;right.y=VH/2-right.h/2;player.v=right.v=0;pointerY=pointer2Y=VH/2;aiTargetY=VH/2;aiThink=0;autoShotRel=.72}function serve(dir){serveDir=dir||1;serveTimer=.9;ball.x=VW/2;ball.y=VH/2;ball.speed=400;const a=Math.random()*.86-.43;ball.vx=Math.cos(a)*ball.speed*serveDir;ball.vy=Math.sin(a)*ball.speed;rally=0;trail=[];aiThink=0}function beginMatch(){playerScore=rightScore=0;longestRally=0;paused=false;phase='playing';resetPaddles();serve(Math.random()<.5?-1:1);overlay.classList.add('hidden');pauseBtn.textContent='Pause';last=performance.now();updateStatus()}function startQuick(){mode='quick';matchWinScore=7;beginMatch()}function startTwoPlayer(){mode='2p';matchWinScore=7;beginMatch()}function startTournament(){mode='tournament';tournamentRound=0;startTournamentRound()}function startTournamentRound(){const r=TOURNEY[tournamentRound];difficulty=r.difficulty;matchWinScore=r.win;beginMatch()}
function modeLabel(){if(mode==='2p')return'2 Player';if(mode==='tournament')return`Tournament ${tournamentRound+1}/${TOURNEY.length}`;return DIFF[difficulty].name}function updateStatus(){if(phase==='menu'){statusEl.textContent='Pong';return}if(phase==='gameover'){statusEl.textContent=`Final ${playerScore} - ${rightScore}`;return}const a=admin(),f=[];if(a.pongAuto&&mode!=='2p')f.push('AUTO');if(a.pongPrediction)f.push('PREDICT');statusEl.textContent=`${modeLabel()} • ${playerScore}-${rightScore} • Rally ${rally} • ${speedValue()}x${f.length?' • '+f.join(' • '):''}`}
function menuStats(){const p=syncUnlocks(profile());return`<div class="statsBox"><div class="stat"><b>${p.wins}</b><span>Wins</span></div><div class="stat"><b>${p.losses}</b><span>Losses</span></div><div class="stat"><b>${p.trophies}</b><span>Trophies</span></div><div class="stat"><b>${p.best}</b><span>Best streak</span></div></div>`}
function showMenu(){phase='menu';paused=false;overlay.classList.remove('hidden');const p=syncUnlocks(profile());panel.innerHTML=`<h1>Pong</h1><p>Play a normal match, climb a four-round tournament, or play two players on one device.</p>${menuStats()}<div class="modeGrid"><button id="quickMode">Quick Match</button><button id="tourMode">Tournament</button><button id="twoMode">2 Player</button><button id="skinsMode">Paddle Skins</button></div><div class="muted">Selected skin: <b>${SKINS[p.skin].name}</b></div>`;panel.querySelector('#quickMode').onclick=showQuickMenu;panel.querySelector('#tourMode').onclick=showTournamentMenu;panel.querySelector('#twoMode').onclick=showTwoPlayerMenu;panel.querySelector('#skinsMode').onclick=showSkins;updateStatus()}
function showQuickMenu(){overlay.classList.remove('hidden');panel.innerHTML=`<h2>Quick Match</h2><p>First to 7. The CPU has reaction delay and imperfect guesses instead of perfect prediction.</p><div class="choices"><button data-d="easy">Easy</button><button data-d="normal">Normal</button><button data-d="hard">Hard</button></div><div class="muted" id="diffNote"></div><button class="big" id="startQuick">Play</button><button class="big" id="backMenu">Back</button>`;const note=()=>difficulty==='easy'?'Slow reactions and lots of mistakes.':difficulty==='hard'?'Fast and smart, but still beatable.':'Balanced opponent with imperfect prediction.';panel.querySelector('#diffNote').textContent=note();panel.querySelectorAll('[data-d]').forEach(b=>{b.classList.toggle('active',b.dataset.d===difficulty);b.onclick=()=>{difficulty=b.dataset.d;panel.querySelectorAll('[data-d]').forEach(q=>q.classList.toggle('active',q.dataset.d===difficulty));panel.querySelector('#diffNote').textContent=note()}});panel.querySelector('#startQuick').onclick=startQuick;panel.querySelector('#backMenu').onclick=showMenu}
function showTournamentMenu(){const p=syncUnlocks(profile());panel.innerHTML=`<h2>Tournament</h2><p>Beat four opponents in a row. Winning a tournament earns a trophy and unlocks special skins.</p>${TOURNEY.map((r,i)=>`<div class="tourRow"><b>Round ${i+1}: ${r.name}</b><span class="muted">${DIFF[r.difficulty].name} • first to ${r.win}</span></div>`).join('')}<div class="muted" style="margin-top:10px">Tournament wins: <b>${p.tournaments}</b></div><button class="big" id="startTour">Start Tournament</button><button class="big" id="backMenu">Back</button>`;panel.querySelector('#startTour').onclick=startTournament;panel.querySelector('#backMenu').onclick=showMenu}
function showTwoPlayerMenu(){panel.innerHTML=`<h2>2 Player</h2><p>One device, two paddles. On touch screens, each player drags on their half. Keyboard: Player 1 uses W/S, Player 2 uses ↑/↓.</p><button class="big" id="start2p">Start 2 Player</button><button class="big" id="backMenu">Back</button>`;panel.querySelector('#start2p').onclick=startTwoPlayer;panel.querySelector('#backMenu').onclick=showMenu}
function showSkins(){const p=syncUnlocks(profile()),u=new Set(p.unlocked);panel.innerHTML=`<h2>Paddle Skins</h2><p>Unlock skins by actually winning matches and tournaments.</p><div class="skinGrid">${Object.entries(SKINS).map(([id,s])=>`<button class="skinCard ${p.skin===id?'selected':''} ${u.has(id)?'':'locked'}" data-skin="${id}" ${u.has(id)?'':'disabled'}><div class="skinSwatch" style="background:linear-gradient(90deg,${s.a},${s.b})"></div><b>${s.name}</b><small>${u.has(id)?'Unlocked':s.unlock}</small></button>`).join('')}</div><button class="big" id="backMenu">Back</button>`;panel.querySelectorAll('[data-skin]').forEach(b=>b.onclick=()=>{const q=syncUnlocks(profile());q.skin=b.dataset.skin;saveProfile(q);showSkins()});panel.querySelector('#backMenu').onclick=showMenu}
function finishMatch(playerWon){phase='gameover';paused=false;if(mode==='2p'){overlay.classList.remove('hidden');panel.innerHTML=`<h2>${playerWon?'Player 1':'Player 2'} Wins!</h2><p>Final score ${playerScore} - ${rightScore}. Longest rally: ${longestRally}</p><button class="big" id="again">Rematch</button><button class="big" id="menu">Main Menu</button>`;panel.querySelector('#again').onclick=startTwoPlayer;panel.querySelector('#menu').onclick=showMenu;updateStatus();return}if(mode==='tournament'){finishTournamentMatch(playerWon);return}const p=syncUnlocks(profile());if(playerWon){p.wins++;p.streak++;p.best=Math.max(p.best,p.streak);sound('win')}else{p.losses++;p.streak=0;sound('hit')}syncUnlocks(p);overlay.classList.remove('hidden');panel.innerHTML=`<h2>${playerWon?'You Win!':'You Lost'}</h2><p>Final score ${playerScore} - ${rightScore}. Longest rally: ${longestRally}</p>${menuStats()}<button class="big" id="again">Rematch</button><button class="big" id="menu">Main Menu</button>`;panel.querySelector('#again').onclick=startQuick;panel.querySelector('#menu').onclick=showMenu;updateStatus()}
function finishTournamentMatch(playerWon){const r=TOURNEY[tournamentRound],p=syncUnlocks(profile());overlay.classList.remove('hidden');if(!playerWon){p.losses++;p.streak=0;saveProfile(p);sound('hit');panel.innerHTML=`<h2>Eliminated</h2><p>${r.name} beat you ${rightScore}-${playerScore}. You reached round ${tournamentRound+1}.</p><button class="big" id="retry">Restart Tournament</button><button class="big" id="menu">Main Menu</button>`;panel.querySelector('#retry').onclick=startTournament;panel.querySelector('#menu').onclick=showMenu;updateStatus();return}p.wins++;p.streak++;p.best=Math.max(p.best,p.streak);if(tournamentRound<TOURNEY.length-1){saveProfile(p);sound('score');panel.innerHTML=`<h2>Round ${tournamentRound+1} Won</h2><p>You beat ${r.name} ${playerScore}-${rightScore}. Next opponent: ${TOURNEY[tournamentRound+1].name}.</p><button class="big" id="next">Next Round</button><button class="big" id="menu">Quit Tournament</button>`;panel.querySelector('#next').onclick=()=>{tournamentRound++;startTournamentRound()};panel.querySelector('#menu').onclick=showMenu;updateStatus();return}p.tournaments++;p.trophies++;syncUnlocks(p);sound('win');panel.innerHTML=`<h2>Tournament Champion!</h2><p>You beat all four opponents and earned a trophy.</p>${menuStats()}<button class="big" id="again">Play Another Tournament</button><button class="big" id="skins">Check Skins</button><button class="big" id="menu">Main Menu</button>`;panel.querySelector('#again').onclick=startTournament;panel.querySelector('#skins').onclick=showSkins;panel.querySelector('#menu').onclick=showMenu;updateStatus()}
function scorePoint(leftGot){if(leftGot){playerScore++;sound('score')}else{rightScore++;sound('hit')}if(playerScore>=matchWinScore||rightScore>=matchWinScore){finishMatch(playerScore>rightScore);return}serve(leftGot?-1:1);updateStatus()}
function reflectY(y){const top=ball.r+11,bottom=VH-ball.r-11,span=bottom-top;let n=(y-top)%(span*2);if(n<0)n+=span*2;if(n>span)n=span*2-n;return top+n}function predictedYAtX(x){if(Math.abs(ball.vx)<1)return ball.y;const t=(x-ball.x)/ball.vx;if(t<=0)return ball.y;return reflectY(ball.y+ball.vy*t)}function chooseAutoShot(){const c=right.y+right.h/2;let rel=c<VH*.44?.82:c>VH*.56?-.82:(rally%2?.76:-.76);if(rally%4===3)rel*=.88;return rel}
function moveLeft(dt){const a=admin(),auto=a.pongAuto&&mode!=='2p',prev=player.y,speed=auto?980:660;if(auto){let target=VH/2;if(ball.vx<0){const intercept=predictedYAtX(player.x+player.w+ball.r);autoShotRel=chooseAutoShot();target=intercept-autoShotRel*(player.h/2)}const center=player.y+player.h/2;player.y+=clamp(target-center,-speed*dt,speed*dt)}else{if(keys.p1Up)player.y-=speed*dt;if(keys.p1Down)player.y+=speed*dt;if(!keys.p1Up&&!keys.p1Down){const target=pointerY-player.h/2;player.y+=clamp(target-player.y,-speed*dt,speed*dt)}}player.y=clamp(player.y,11,VH-player.h-11);player.v=(player.y-prev)/Math.max(dt,.0001)}
function moveRightManual(dt){const prev=right.y,speed=660;if(keys.p2Up)right.y-=speed*dt;if(keys.p2Down)right.y+=speed*dt;if(!keys.p2Up&&!keys.p2Down){const target=pointer2Y-right.h/2;right.y+=clamp(target-right.y,-speed*dt,speed*dt)}right.y=clamp(right.y,11,VH-right.h-11);right.v=(right.y-prev)/Math.max(dt,.0001)}
function moveCPU(dt){const d=DIFF[difficulty],prev=right.y,attacking=ball.vx>0;aiThink-=dt;if(!attacking){aiTargetY=lerp(aiTargetY,VH/2,.055);aiThink=0}else if(ball.x<d.notice){aiTargetY=lerp(aiTargetY,VH/2,.05)}else if(aiThink<=0){const exact=predictedYAtX(right.x-ball.r),rough=lerp(ball.y,exact,d.predict),mistake=(Math.random()*2-1)*d.error;aiTargetY=clamp(rough+mistake,24,VH-24);aiThink=d.think*(.75+Math.random()*.75)}const center=right.y+right.h/2,max=d.aiSpeed*dt;right.y+=clamp(aiTargetY-center,-max,max);right.y=clamp(right.y,11,VH-right.h-11);right.v=(right.y-prev)/Math.max(dt,.0001)}
function hitPaddle(p,leftSide){let rel=clamp((ball.y-(p.y+p.h/2))/(p.h/2),-.98,.98);if(leftSide&&admin().pongAuto&&mode!=='2p'&&Math.abs(rel)<.28)rel=autoShotRel;rel=clamp(rel+(p.v||0)*.000018,-.98,.98);ball.speed=Math.min(900,ball.speed*1.04+4);const angle=rel*1.12;ball.vx=Math.cos(angle)*ball.speed*(leftSide?1:-1);ball.vy=Math.sin(angle)*ball.speed;ball.x=leftSide?p.x+p.w+ball.r+1:p.x-ball.r-1;rally++;longestRally=Math.max(longestRally,rally);if(!leftSide)aiThink=0;sound('level')}
function physicsStep(dt){const a=admin();moveLeft(dt);mode==='2p'?moveRightManual(dt):moveCPU(dt);if(serveTimer>0){serveTimer-=dt;ball.x=VW/2;ball.y=VH/2;trail=[];return}trail.push({x:ball.x,y:ball.y});if(trail.length>16)trail.shift();ball.x+=ball.vx*dt;ball.y+=ball.vy*dt;if(ball.y-ball.r<11){ball.y=11+ball.r;ball.vy=Math.abs(ball.vy)}else if(ball.y+ball.r>VH-11){ball.y=VH-11-ball.r;ball.vy=-Math.abs(ball.vy)}if(ball.vx<0&&ball.x-ball.r<=player.x+player.w&&ball.x+ball.r>=player.x&&ball.y+ball.r>=player.y&&ball.y-ball.r<=player.y+player.h)hitPaddle(player,true);if(ball.vx>0&&ball.x+ball.r>=right.x&&ball.x-ball.r<=right.x+right.w&&ball.y+ball.r>=right.y&&ball.y-ball.r<=right.y+right.h)hitPaddle(right,false);if(ball.x+ball.r<0){if(a.god&&mode!=='2p'){ball.x=player.x+player.w+ball.r+1;ball.vx=Math.abs(ball.vx)}else scorePoint(false)}else if(ball.x-ball.r>VW)scorePoint(true)}
function update(dt){if(phase!=='playing'||paused)return;const total=dt*speedValue();if(!Number.isFinite(total)||total<=0)return;const steps=Math.max(1,Math.min(360,Math.ceil(total/.0035))),step=total/steps;for(let i=0;i<steps&&phase==='playing';i++)physicsStep(step);updateStatus()}
function drawArena(){const g=ctx.createLinearGradient(0,0,0,VH);g.addColorStop(0,'#12324a');g.addColorStop(.48,'#0b2233');g.addColorStop(1,'#07131f');ctx.fillStyle=g;ctx.fillRect(0,0,VW,VH);const glow=ctx.createRadialGradient(VW/2,VH*.48,20,VW/2,VH*.48,470);glow.addColorStop(0,'rgba(82,190,255,.08)');glow.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=glow;ctx.fillRect(0,0,VW,VH);ctx.strokeStyle='rgba(154,216,255,.055)';ctx.lineWidth=1;for(let y=150;y<VH;y+=54){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(VW,y);ctx.stroke()}for(let x=80;x<VW;x+=80){ctx.beginPath();ctx.moveTo(VW/2,130);ctx.lineTo(x,VH);ctx.stroke()}ctx.fillStyle='rgba(255,255,255,.06)';for(let y=28;y<VH;y+=31)ctx.fillRect(VW/2-2,y,4,16);ctx.strokeStyle='rgba(255,255,255,.11)';ctx.lineWidth=2;ctx.strokeRect(10,10,VW-20,VH-20);const vig=ctx.createRadialGradient(VW/2,VH/2,120,VW/2,VH/2,560);vig.addColorStop(.58,'rgba(0,0,0,0)');vig.addColorStop(1,'rgba(0,0,0,.38)');ctx.fillStyle=vig;ctx.fillRect(0,0,VW,VH)}
function drawPrediction(){if(!admin().pongPrediction||phase!=='playing'||serveTimer>0||Math.abs(ball.vx)<1)return;let px=ball.x,py=ball.y,vx=ball.vx,vy=ball.vy;const pts=[{x:px,y:py}],target=vx<0?player.x+player.w+ball.r:right.x-ball.r,dt=.014;for(let i=0;i<420;i++){px+=vx*dt;py+=vy*dt;if(py-ball.r<11){py=11+ball.r;vy=Math.abs(vy)}else if(py+ball.r>VH-11){py=VH-11-ball.r;vy=-Math.abs(vy)}if(i%5===0)pts.push({x:px,y:py});if((vx<0&&px<=target)||(vx>0&&px>=target)){pts.push({x:target,y:predictedYAtX(target)});break}}ctx.save();ctx.strokeStyle='rgba(112,230,255,.78)';ctx.lineWidth=3;ctx.setLineDash([10,10]);ctx.beginPath();ctx.moveTo(pts[0].x,pts[0].y);for(let i=1;i<pts.length;i++)ctx.lineTo(pts[i].x,pts[i].y);ctx.stroke();ctx.setLineDash([]);const e=pts[pts.length-1];ctx.fillStyle='#77e8ff';ctx.beginPath();ctx.arc(e.x,e.y,6,0,Math.PI*2);ctx.fill();ctx.restore()}
function drawPaddle(p,isLeft){const s=isLeft?skin():{a:'#ff9aae',b:'#cf63ff'};ctx.save();const g=ctx.createLinearGradient(p.x,p.y,p.x+p.w,p.y);g.addColorStop(0,s.a);g.addColorStop(1,s.b);ctx.shadowColor=s.a;ctx.shadowBlur=16;ctx.fillStyle=g;rr(p.x,p.y,p.w,p.h,10);ctx.fill();ctx.shadowBlur=0;ctx.fillStyle='rgba(255,255,255,.25)';rr(p.x+3,p.y+4,p.w-6,11,6);ctx.fill();ctx.fillStyle='rgba(0,0,0,.18)';rr(p.x+3,p.y+p.h-20,p.w-6,15,6);ctx.fill();ctx.restore()}
function drawBall(){for(let i=0;i<trail.length;i++){const t=trail[i],a=(i+1)/trail.length*.16;ctx.fillStyle=`rgba(255,239,154,${a})`;ctx.beginPath();ctx.arc(t.x,t.y,3+i/trail.length*5,0,Math.PI*2);ctx.fill()}ctx.save();ctx.shadowColor='#ffe87a';ctx.shadowBlur=18;const g=ctx.createRadialGradient(ball.x-2,ball.y-2,1,ball.x,ball.y,ball.r);g.addColorStop(0,'#fffef0');g.addColorStop(.55,'#ffe88f');g.addColorStop(1,'#d9a92e');ctx.fillStyle=g;ctx.beginPath();ctx.arc(ball.x,ball.y,ball.r,0,Math.PI*2);ctx.fill();ctx.restore()}
function drawScore(){ctx.textAlign='center';ctx.font='900 58px system-ui';ctx.fillStyle='rgba(255,255,255,.94)';ctx.fillText(playerScore,VW/2-82,76);ctx.fillText(rightScore,VW/2+82,76);ctx.font='800 11px system-ui';ctx.fillStyle='rgba(255,255,255,.52)';ctx.fillText(mode==='2p'?'PLAYER 1':'YOU',VW/2-82,99);ctx.fillText(mode==='2p'?'PLAYER 2':mode==='tournament'?TOURNEY[tournamentRound].name.toUpperCase():'CPU',VW/2+82,99);if(serveTimer>0&&phase==='playing'){ctx.font='900 20px system-ui';ctx.fillStyle='rgba(255,255,255,.8)';ctx.fillText('GET READY',VW/2,VH/2-30)}if(admin().pongAuto&&mode!=='2p'&&phase==='playing'){ctx.font='900 12px system-ui';ctx.fillStyle='#79e8ff';ctx.fillText('AUTOPILOT',VW/2,122)}if(paused){ctx.fillStyle='rgba(0,0,0,.46)';ctx.fillRect(0,0,VW,VH);ctx.font='900 42px system-ui';ctx.fillStyle='#fff';ctx.fillText('PAUSED',VW/2,VH/2)}}function draw(){drawArena();drawPrediction();drawPaddle(player,true);drawPaddle(right,false);drawBall();drawScore()}function frame(ts){const dt=Math.min(.04,Math.max(0,(ts-last)/1000||0));last=ts;update(dt);draw();requestAnimationFrame(frame)}
function eventPos(e){const r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left)*VW/r.width,y:(e.clientY-r.top)*VH/r.height}}canvas.addEventListener('pointerdown',e=>{e.preventDefault();const p=eventPos(e);if(mode==='2p'){const side=p.x<VW/2?'left':'right';pointerSides.set(e.pointerId,side);if(side==='left')pointerY=p.y;else pointer2Y=p.y}else if(!admin().pongAuto)pointerY=p.y;canvas.setPointerCapture?.(e.pointerId)},{passive:false});canvas.addEventListener('pointermove',e=>{if(!pointerSides.has(e.pointerId)&&e.buttons===0&&e.pointerType!=='touch')return;e.preventDefault();const p=eventPos(e);if(mode==='2p'){const side=pointerSides.get(e.pointerId)||(p.x<VW/2?'left':'right');if(side==='left')pointerY=p.y;else pointer2Y=p.y}else if(!admin().pongAuto)pointerY=p.y},{passive:false});const clearPointer=e=>pointerSides.delete(e.pointerId);canvas.addEventListener('pointerup',clearPointer);canvas.addEventListener('pointercancel',clearPointer);
addEventListener('keydown',e=>{if(e.code==='Space'&&phase==='playing'){paused=!paused;pauseBtn.textContent=paused?'Resume':'Pause';last=performance.now();e.preventDefault();return}if(e.key==='w'||e.key==='W'){keys.p1Up=true;e.preventDefault()}if(e.key==='s'||e.key==='S'){keys.p1Down=true;e.preventDefault()}if(e.key==='ArrowUp'){keys.p2Up=true;e.preventDefault()}if(e.key==='ArrowDown'){keys.p2Down=true;e.preventDefault()}});addEventListener('keyup',e=>{if(e.key==='w'||e.key==='W')keys.p1Up=false;if(e.key==='s'||e.key==='S')keys.p1Down=false;if(e.key==='ArrowUp')keys.p2Up=false;if(e.key==='ArrowDown')keys.p2Down=false});pauseBtn.onclick=()=>{if(phase!=='playing')return;paused=!paused;pauseBtn.textContent=paused?'Resume':'Pause';last=performance.now()};restartBtn.onclick=()=>{if(phase==='playing'||phase==='gameover'){if(mode==='quick')startQuick();else if(mode==='2p')startTwoPlayer();else startTournamentRound()}else showMenu()};addEventListener('arcade-admin-change',()=>{keys={p1Up:false,p1Down:false,p2Up:false,p2Down:false};updateStatus()});addEventListener('arcade-admin-command',e=>{if(e.detail.command==='boost'){playerScore=Math.min(matchWinScore-1,playerScore+3);updateStatus()}if(e.detail.command==='reset'){if(mode==='quick')startQuick();else if(mode==='2p')startTwoPlayer();else startTournamentRound()}});
resize();showMenu();requestAnimationFrame(frame);
</script>
