<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#070b11">
<title>Pong - Arcade Hub</title>
<style>
*{box-sizing:border-box}
html,body{
  margin:0;
  width:100%;
  height:100%;
  background:radial-gradient(circle at top,#162335 0%,#0a1018 45%,#06090e 100%);
  color:#fff;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  overflow:hidden;
}
body{
  display:grid;
  place-items:center;
  padding:max(10px,env(safe-area-inset-top)) 10px max(10px,env(safe-area-inset-bottom));
}
.shell{
  position:relative;
  width:min(96vw,980px);
}
.frame{
  position:relative;
  width:100%;
  aspect-ratio:16/9;
  border-radius:26px;
  overflow:hidden;
  border:1px solid rgba(255,255,255,.12);
  background:linear-gradient(180deg,#132033 0%,#0c141f 100%);
  box-shadow:0 28px 80px rgba(0,0,0,.55), inset 0 0 0 1px rgba(255,255,255,.04);
}
canvas{
  display:block;
  width:100%;
  height:100%;
  touch-action:none;
}
.top{
  position:absolute;
  z-index:40;
  top:10px;
  left:10px;
  right:10px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:8px;
  pointer-events:none;
}
.topLeft,.topRight{
  display:flex;
  gap:8px;
  align-items:center;
}
.top a,.top button{
  pointer-events:auto;
  border:1px solid rgba(255,255,255,.16);
  background:rgba(10,14,22,.72);
  color:#fff;
  border-radius:14px;
  padding:10px 12px;
  text-decoration:none;
  font-weight:800;
  backdrop-filter:blur(12px);
}
.status{
  position:absolute;
  z-index:35;
  left:50%;
  top:12px;
  transform:translateX(-50%);
  padding:8px 14px;
  border:1px solid rgba(255,255,255,.12);
  border-radius:999px;
  background:rgba(10,14,22,.64);
  color:#d7deeb;
  font-size:12px;
  font-weight:850;
  letter-spacing:.01em;
  backdrop-filter:blur(12px);
  white-space:nowrap;
}
.overlay{
  position:absolute;
  z-index:100;
  inset:0;
  display:grid;
  place-items:center;
  padding:18px;
  background:rgba(4,6,10,.58);
  backdrop-filter:blur(10px);
}
.overlay.hidden{display:none}
.panel{
  width:min(92vw,430px);
  background:rgba(12,17,26,.96);
  border:1px solid rgba(255,255,255,.12);
  border-radius:26px;
  padding:20px;
  box-shadow:0 30px 100px rgba(0,0,0,.6);
}
.panel h1,.panel h2{margin:0 0 6px}
.panel p{margin:0 0 14px;color:#a9b5c8;line-height:1.45}
.choices{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  margin:10px 0 12px;
}
.choices button,.big{
  border:1px solid rgba(255,255,255,.12);
  background:#182232;
  color:#fff;
  border-radius:14px;
  padding:12px 10px;
  font-weight:850;
  font-size:14px;
}
.choices button.active{
  background:#eef4ff;
  color:#111726;
  border-color:#cdd8ef;
}
.big{width:100%;margin-top:10px}
.diffNote{
  color:#8fa0ba;
  font-size:12px;
  line-height:1.45;
  margin-bottom:10px;
}
.statsBox{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  margin-top:10px;
}
.career{
  border:1px solid rgba(255,255,255,.08);
  background:#0d131d;
  border-radius:14px;
  padding:10px 8px;
  text-align:center;
}
.career b{
  display:block;
  font-size:18px;
}
.career span{
  font-size:10px;
  color:#8d9aaf;
  font-weight:800;
  text-transform:uppercase;
  letter-spacing:.05em;
}
@media(max-width:640px){
  body{padding:8px}
  .shell{width:100vw}
  .frame{border-radius:18px}
  .top a,.top button{padding:9px 10px;font-size:12px}
  .status{font-size:11px;top:10px;max-width:70vw;overflow:hidden;text-overflow:ellipsis}
  .panel{padding:18px}
  .choices button{font-size:12px;padding:11px 6px}
}
</style>
</head>
<body>
<div class="shell">
  <div class="frame">
    <canvas id="game"></canvas>

    <div class="top">
      <div class="topLeft">
        <a href="../index.html">← Games</a>
      </div>
      <div class="topRight">
        <button id="pauseBtn">Pause</button>
        <button id="restartBtn">Restart</button>
      </div>
    </div>

    <div class="status" id="status">First to 7</div>

    <div class="overlay" id="overlay">
      <div class="panel" id="panel"></div>
    </div>
  </div>
</div>

<script src="../admin.js"></script>
<script>
const canvas=document.getElementById('game');
const ctx=canvas.getContext('2d');

const VW=960, VH=540, WIN_SCORE=7;
let DPR=1, last=performance.now();

let difficulty='normal';
let phase='menu';
let paused=false;
let serveTimer=0;
let serveDir=1;

let playerScore=0, aiScore=0;
let rally=0, longestRally=0;

let aiThink=0, aiTargetY=VH/2;
let pointerY=VH/2;
let keyboard={up:false,down:false};
let autoShotRel=0.68;
let trail=[];

const player={x:34,y:VH/2-62,w:20,h:124,v:0};
const ai={x:VW-54,y:VH/2-62,w:20,h:124,v:0};
const ball={x:VW/2,y:VH/2,vx:0,vy:0,r:9,speed:400};

const CAREER_KEY='pongCareer';
const admin=()=>window.ArcadeAdmin?.getSettings?.()||{god:false,speed:1,pongAuto:false,pongPrediction:false};

const DIFF={
  easy:{name:'Easy',aiSpeed:255,think:.26,predict:.16,error:120,notice:650},
  normal:{name:'Normal',aiSpeed:340,think:.16,predict:.42,error:62,notice:530},
  hard:{name:'Hard',aiSpeed:420,think:.10,predict:.68,error:26,notice:420}
};

const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;

function rr(x,y,w,h,r){
  const m=Math.min(r,w/2,h/2);
  ctx.beginPath();
  ctx.moveTo(x+m,y);
  ctx.arcTo(x+w,y,x+w,y+h,m);
  ctx.arcTo(x+w,y+h,x,y+h,m);
  ctx.arcTo(x,y+h,x,y,m);
  ctx.arcTo(x,y,x+w,y,m);
  ctx.closePath();
}

function speedValue(){
  const v=Number(admin().speed);
  return Number.isFinite(v)&&v>0?v:1;
}

function career(){
  try{
    return {wins:0,losses:0,streak:0,best:0,...JSON.parse(localStorage.getItem(CAREER_KEY)||'{}')};
  }catch{
    return {wins:0,losses:0,streak:0,best:0};
  }
}
function saveCareer(c){localStorage.setItem(CAREER_KEY,JSON.stringify(c))}
function arcadeSound(name){window.ArcadeVibes?.play?.(name)}

function resize(){
  const rect=canvas.getBoundingClientRect();
  DPR=Math.min(devicePixelRatio||1,2);
  canvas.width=Math.round(rect.width*DPR);
  canvas.height=Math.round(rect.height*DPR);
  ctx.setTransform(canvas.width/VW,0,0,canvas.height/VH,0,0);
}
addEventListener('resize',()=>{clearTimeout(resize.t);resize.t=setTimeout(resize,70)});

function resetPaddles(){
  player.y=VH/2-player.h/2;
  ai.y=VH/2-ai.h/2;
  player.v=0;
  ai.v=0;
  pointerY=VH/2;
  aiTargetY=VH/2;
  aiThink=0;
  autoShotRel=0.68;
}

function serve(dir){
  serveDir=dir||1;
  serveTimer=.95;
  ball.x=VW/2;
  ball.y=VH/2;
  ball.speed=400;
  const angle=(Math.random()*.84-.42);
  ball.vx=Math.cos(angle)*ball.speed*serveDir;
  ball.vy=Math.sin(angle)*ball.speed;
  rally=0;
  trail=[];
}

function startMatch(){
  playerScore=0;
  aiScore=0;
  longestRally=0;
  paused=false;
  phase='playing';
  resetPaddles();
  serve(Math.random()<.5?-1:1);
  overlay.classList.add('hidden');
  pauseBtn.textContent='Pause';
  last=performance.now();
  updateStatus();
}

function restartMatch(){startMatch()}

function diffDescription(){
  if(difficulty==='easy')return 'Easy is slower, reacts later, and guesses badly a lot.';
  if(difficulty==='hard')return 'Hard predicts better, but it still has reaction time and can miss.';
  return 'Normal is solid, but it no longer cheats with perfect prediction.';
}

function showMenu(){
  phase='menu';
  paused=false;
  const c=career();
  overlay.classList.remove('hidden');
  panel.innerHTML=`
    <h1>Pong</h1>
    <p>First to ${WIN_SCORE}. Drag your paddle with your finger or use arrow keys. Longer rallies make the ball a bit faster.</p>
    <b>Opponent</b>
    <div class="choices">
      <button data-d="easy">Easy</button>
      <button data-d="normal">Normal</button>
      <button data-d="hard">Hard</button>
    </div>
    <div class="diffNote" id="diffNote">${diffDescription()}</div>
    <div class="statsBox">
      <div class="career"><b>${c.wins}</b><span>Wins</span></div>
      <div class="career"><b>${c.losses}</b><span>Losses</span></div>
      <div class="career"><b>${c.best}</b><span>Best streak</span></div>
    </div>
    <button class="big" id="playBtn">Play Match</button>
  `;
  panel.querySelectorAll('[data-d]').forEach(b=>{
    b.classList.toggle('active',b.dataset.d===difficulty);
    b.onclick=()=>{
      difficulty=b.dataset.d;
      panel.querySelectorAll('[data-d]').forEach(q=>q.classList.toggle('active',q.dataset.d===difficulty));
      panel.querySelector('#diffNote').textContent=diffDescription();
    };
  });
  panel.querySelector('#playBtn').onclick=startMatch;
  updateStatus();
}

function finishMatch(playerWon){
  phase='gameover';
  paused=false;
  const c=career();
  if(playerWon){
    c.wins++;
    c.streak++;
    c.best=Math.max(c.best,c.streak);
    arcadeSound('win');
  }else{
    c.losses++;
    c.streak=0;
    arcadeSound('hit');
  }
  saveCareer(c);
  overlay.classList.remove('hidden');
  panel.innerHTML=`
    <h2>${playerWon?'You Win!':'You Lost'}</h2>
    <p>Final score: ${playerScore} - ${aiScore}<br>Longest rally: ${longestRally}</p>
    <div class="statsBox">
      <div class="career"><b>${c.wins}</b><span>Wins</span></div>
      <div class="career"><b>${c.streak}</b><span>Streak</span></div>
      <div class="career"><b>${c.best}</b><span>Best</span></div>
    </div>
    <button class="big" id="rematchBtn">Rematch</button>
    <button class="big" id="menuBtn">Change Difficulty</button>
  `;
  panel.querySelector('#rematchBtn').onclick=startMatch;
  panel.querySelector('#menuBtn').onclick=showMenu;
  updateStatus();
}

function scorePoint(playerGotPoint){
  if(playerGotPoint){
    playerScore++;
    arcadeSound('score');
  }else{
    aiScore++;
    arcadeSound('hit');
  }
  if(playerScore>=WIN_SCORE||aiScore>=WIN_SCORE){
    finishMatch(playerScore>aiScore);
    return;
  }
  serve(playerGotPoint?-1:1);
  updateStatus();
}

function updateStatus(){
  if(phase==='menu'){status.textContent='First to 7';return}
  if(phase==='gameover'){status.textContent=`Final ${playerScore} - ${aiScore}`;return}
  const a=admin(),flags=[];
  if(a.pongAuto)flags.push('AUTO');
  if(a.pongPrediction)flags.push('PREDICT');
  status.textContent=`${DIFF[difficulty].name} • ${playerScore} - ${aiScore} • Rally ${rally} • ${speedValue()}x${flags.length?' • '+flags.join(' • '):''}`;
}

function reflectY(y){
  const top=ball.r+10;
  const bottom=VH-ball.r-10;
  const span=bottom-top;
  let n=(y-top)%(span*2);
  if(n<0)n+=span*2;
  if(n>span)n=span*2-n;
  return top+n;
}

function predictedYAtX(targetX){
  if(Math.abs(ball.vx)<1)return ball.y;
  const t=(targetX-ball.x)/ball.vx;
  if(t<=0)return ball.y;
  return reflectY(ball.y+ball.vy*t);
}

function movePlayer(dt){
  const a=admin();
  const prev=player.y;
  const speed=a.pongAuto?760:660;

  if(a.pongAuto){
    let target=VH/2;

    if(ball.vx<0){
      const intercept=predictedYAtX(player.x+player.w+ball.r);
      const aiCenter=ai.y+ai.h/2;

      if(aiCenter<VH*.42) autoShotRel=.74;
      else if(aiCenter>VH*.58) autoShotRel=-.74;
      else autoShotRel=(rally%2===0?-0.68:.68);

      const targetCenter=intercept-autoShotRel*(player.h*0.5);
      target=targetCenter;
    }

    const center=player.y+player.h/2;
    player.y+=clamp(target-center,-speed*dt,speed*dt);
  }else{
    if(keyboard.up)player.y-=speed*dt;
    if(keyboard.down)player.y+=speed*dt;
    if(!keyboard.up&&!keyboard.down){
      const target=pointerY-player.h/2;
      player.y+=clamp(target-player.y,-speed*dt,speed*dt);
    }
  }

  player.y=clamp(player.y,10,VH-player.h-10);
  player.v=(player.y-prev)/Math.max(dt,.0001);
}

function moveAI(dt){
  const d=DIFF[difficulty];
  const prev=ai.y;
  const attacking=ball.vx>0;
  aiThink-=dt;

  if(!attacking){
    aiTargetY=lerp(aiTargetY,VH/2,.06);
    aiThink=0;
  }else if(ball.x<d.notice){
    aiTargetY=lerp(aiTargetY,VH/2,.06);
  }else if(aiThink<=0){
    const exact=predictedYAtX(ai.x-ball.r);
    const rough=lerp(ball.y,exact,d.predict);
    const mistake=(Math.random()*2-1)*d.error;
    aiTargetY=clamp(rough+mistake,20,VH-20);
    aiThink=d.think*(.8+Math.random()*.7);
  }

  const center=ai.y+ai.h/2;
  const max=d.aiSpeed*dt;
  ai.y+=clamp(aiTargetY-center,-max,max);
  ai.y=clamp(ai.y,10,VH-ai.h-10);
  ai.v=(ai.y-prev)/Math.max(dt,.0001);
}

function hitPaddle(p,left){
  let rel=clamp((ball.y-(p.y+p.h/2))/(p.h/2),-1,1);

  if(left && admin().pongAuto && Math.abs(rel)<.22){
    rel=autoShotRel;
  }

  const paddleVel=(p.v||0)*.03;
  rel=clamp(rel + paddleVel*.0008,-.96,.96);

  ball.speed=Math.min(900,ball.speed*1.04+4);
  const angle=rel*1.1;

  ball.vx=Math.cos(angle)*ball.speed*(left?1:-1);
  ball.vy=Math.sin(angle)*ball.speed;

  if(left) ball.x=p.x+p.w+ball.r+1;
  else ball.x=p.x-ball.r-1;

  rally++;
  longestRally=Math.max(longestRally,rally);

  if(!left) aiThink=0;
  arcadeSound('level');
}

function physicsStep(dt){
  const a=admin();

  movePlayer(dt);
  moveAI(dt);

  if(serveTimer>0){
    serveTimer-=dt;
    ball.x=VW/2;
    ball.y=VH/2;
    trail=[];
    return;
  }

  trail.push({x:ball.x,y:ball.y,a:1});
  if(trail.length>16)trail.shift();

  ball.x+=ball.vx*dt;
  ball.y+=ball.vy*dt;

  if(ball.y-ball.r<10){
    ball.y=10+ball.r;
    ball.vy=Math.abs(ball.vy);
    arcadeSound('hit');
  }else if(ball.y+ball.r>VH-10){
    ball.y=VH-10-ball.r;
    ball.vy=-Math.abs(ball.vy);
    arcadeSound('hit');
  }

  if(
    ball.vx<0 &&
    ball.x-ball.r<=player.x+player.w &&
    ball.x+ball.r>=player.x &&
    ball.y+ball.r>=player.y &&
    ball.y-ball.r<=player.y+player.h
  ){
    hitPaddle(player,true);
  }

  if(
    ball.vx>0 &&
    ball.x+ball.r>=ai.x &&
    ball.x-ball.r<=ai.x+ai.w &&
    ball.y+ball.r>=ai.y &&
    ball.y-ball.r<=ai.y+ai.h
  ){
    hitPaddle(ai,false);
  }

  if(ball.x+ball.r<0){
    if(a.god){
      ball.x=player.x+player.w+ball.r+1;
      ball.vx=Math.abs(ball.vx);
    }else{
      scorePoint(false);
    }
  }else if(ball.x-ball.r>VW){
    scorePoint(true);
  }
}

function update(dt){
  if(phase!=='playing'||paused)return;
  const total=dt*speedValue();
  if(!Number.isFinite(total)||total<=0)return;

  const steps=Math.max(1,Math.min(320,Math.ceil(total/.0035)));
  const step=total/steps;

  for(let i=0;i<steps&&phase==='playing';i++){
    physicsStep(step);
  }

  updateStatus();
}

function drawArena(){
  const g=ctx.createLinearGradient(0,0,0,VH);
  g.addColorStop(0,'#113049');
  g.addColorStop(.45,'#0c2538');
  g.addColorStop(1,'#081623');
  ctx.fillStyle=g;
  ctx.fillRect(0,0,VW,VH);

  const floor=ctx.createLinearGradient(0,VH*.52,0,VH);
  floor.addColorStop(0,'rgba(255,255,255,0)');
  floor.addColorStop(1,'rgba(255,255,255,.04)');
  ctx.fillStyle=floor;
  ctx.fillRect(0,VH*.52,VW,VH*.48);

  ctx.fillStyle='rgba(255,255,255,.04)';
  for(let y=36;y<VH;y+=34){
    ctx.fillRect(VW/2-2,y,4,18);
  }

  ctx.strokeStyle='rgba(255,255,255,.08)';
  ctx.lineWidth=2;
  ctx.strokeRect(8,8,VW-16,VH-16);

  const vignette=ctx.createRadialGradient(VW/2,VH/2,100,VW/2,VH/2,560);
  vignette.addColorStop(.6,'rgba(0,0,0,0)');
  vignette.addColorStop(1,'rgba(0,0,0,.35)');
  ctx.fillStyle=vignette;
  ctx.fillRect(0,0,VW,VH);
}

function drawPrediction(){
  if(!admin().pongPrediction||phase!=='playing'||serveTimer>0||Math.abs(ball.vx)<1)return;

  let px=ball.x, py=ball.y, vx=ball.vx, vy=ball.vy;
  const points=[{x:px,y:py}];
  const targetX=vx<0 ? player.x+player.w+ball.r : ai.x-ball.r;
  const dt=.014;

  for(let i=0;i<420;i++){
    px+=vx*dt;
    py+=vy*dt;

    if(py-ball.r<10){
      py=10+ball.r;
      vy=Math.abs(vy);
    }else if(py+ball.r>VH-10){
      py=VH-10-ball.r;
      vy=-Math.abs(vy);
    }

    if(i%5===0)points.push({x:px,y:py});

    if((vx<0&&px<=targetX)||(vx>0&&px>=targetX)){
      points.push({x:targetX,y:predictedYAtX(targetX)});
      break;
    }
  }

  if(points.length<2)return;

  ctx.save();
  ctx.strokeStyle='rgba(118,230,255,.75)';
  ctx.lineWidth=3;
  ctx.setLineDash([10,10]);
  ctx.beginPath();
  ctx.moveTo(points[0].x,points[0].y);
  for(let i=1;i<points.length;i++)ctx.lineTo(points[i].x,points[i].y);
  ctx.stroke();
  ctx.setLineDash([]);

  const end=points[points.length-1];
  ctx.fillStyle='rgba(118,230,255,.95)';
  ctx.beginPath();
  ctx.arc(end.x,end.y,6.5,0,Math.PI*2);
  ctx.fill();
  ctx.restore();
}

function drawPaddle(p,isPlayer){
  ctx.save();

  const g=ctx.createLinearGradient(p.x,p.y,p.x+p.w,p.y);
  if(isPlayer){
    g.addColorStop(0,'#8de4ff');
    g.addColorStop(.55,'#56b9ff');
    g.addColorStop(1,'#7b86ff');
  }else{
    g.addColorStop(0,'#ffb2c5');
    g.addColorStop(.55,'#ff809d');
    g.addColorStop(1,'#d46cff');
  }

  ctx.shadowColor=isPlayer?'rgba(91,208,255,.55)':'rgba(242,120,186,.45)';
  ctx.shadowBlur=16;
  ctx.fillStyle=g;
  rr(p.x,p.y,p.w,p.h,10);
  ctx.fill();

  ctx.shadowBlur=0;
  ctx.fillStyle='rgba(255,255,255,.2)';
  rr(p.x+3,p.y+4,p.w-6,Math.max(6,p.h*.12),8);
  ctx.fill();

  ctx.fillStyle='rgba(0,0,0,.14)';
  rr(p.x+3,p.y+p.h*.65,p.w-6,p.h*.24,8);
  ctx.fill();

  ctx.restore();
}

function drawBall(){
  for(let i=0;i<trail.length;i++){
    const t=trail[i];
    const alpha=(i+1)/trail.length*.18;
    ctx.fillStyle=`rgba(255,246,189,${alpha})`;
    ctx.beginPath();
    ctx.arc(t.x,t.y,ball.r*(.45+.55*i/trail.length),0,Math.PI*2);
    ctx.fill();
  }

  ctx.save();
  ctx.shadowColor='rgba(255,242,170,.85)';
  ctx.shadowBlur=18;
  const g=ctx.createRadialGradient(ball.x-2,ball.y-2,1,ball.x,ball.y,ball.r);
  g.addColorStop(0,'#fffde9');
  g.addColorStop(.55,'#fff2a8');
  g.addColorStop(1,'#f5c54d');
  ctx.fillStyle=g;
  ctx.beginPath();
  ctx.arc(ball.x,ball.y,ball.r,0,Math.PI*2);
  ctx.fill();
  ctx.restore();
}

function drawScore(){
  ctx.textAlign='center';
  ctx.font='900 60px system-ui';
  ctx.fillStyle='rgba(255,255,255,.96)';
  ctx.fillText(playerScore,VW/2-88,74);
  ctx.fillText(aiScore,VW/2+88,74);

  ctx.font='800 12px system-ui';
  ctx.fillStyle='rgba(255,255,255,.52)';
  ctx.fillText('YOU',VW/2-88,100);
  ctx.fillText('CPU',VW/2+88,100);

  if(serveTimer>0&&phase==='playing'){
    ctx.font='900 22px system-ui';
    ctx.fillStyle='rgba(255,255,255,.82)';
    ctx.fillText('GET READY',VW/2,VH/2-34);
  }

  if(admin().pongAuto&&phase==='playing'){
    ctx.font='900 13px system-ui';
    ctx.fillStyle='rgba(118,230,255,.9)';
    ctx.fillText('AUTOPILOT',VW/2,126);
  }

  if(paused){
    ctx.fillStyle='rgba(0,0,0,.42)';
    ctx.fillRect(0,0,VW,VH);
    ctx.font='900 42px system-ui';
    ctx.fillStyle='#fff';
    ctx.fillText('PAUSED',VW/2,VH/2);
  }
}

function draw(){
  drawArena();
  drawPrediction();
  drawPaddle(player,true);
  drawPaddle(ai,false);
  drawBall();
  drawScore();
}

function frame(ts){
  const dt=Math.min(.04,Math.max(0,(ts-last)/1000||0));
  last=ts;
  update(dt);
  draw();
  requestAnimationFrame(frame);
}

function pointerToY(e){
  const r=canvas.getBoundingClientRect();
  pointerY=clamp((e.clientY-r.top)*VH/r.height,0,VH);
}

canvas.addEventListener('pointerdown',e=>{
  if(admin().pongAuto)return;
  e.preventDefault();
  pointerToY(e);
  canvas.setPointerCapture?.(e.pointerId);
},{passive:false});

canvas.addEventListener('pointermove',e=>{
  if(admin().pongAuto)return;
  if(e.buttons||e.pointerType==='touch'){
    e.preventDefault();
    pointerToY(e);
  }
},{passive:false});

addEventListener('keydown',e=>{
  if(e.code==='Space'&&phase==='playing'){
    paused=!paused;
    pauseBtn.textContent=paused?'Resume':'Pause';
    last=performance.now();
    e.preventDefault();
    return;
  }

  if(admin().pongAuto)return;

  if(e.key==='ArrowUp'||e.key==='w'||e.key==='W'){
    keyboard.up=true;
    e.preventDefault();
  }
  if(e.key==='ArrowDown'||e.key==='s'||e.key==='S'){
    keyboard.down=true;
    e.preventDefault();
  }
});

addEventListener('keyup',e=>{
  if(e.key==='ArrowUp'||e.key==='w'||e.key==='W')keyboard.up=false;
  if(e.key==='ArrowDown'||e.key==='s'||e.key==='S')keyboard.down=false;
});

pauseBtn.onclick=()=>{
  if(phase!=='playing')return;
  paused=!paused;
  pauseBtn.textContent=paused?'Resume':'Pause';
  last=performance.now();
};

restartBtn.onclick=()=>{
  if(phase==='playing'||phase==='gameover')restartMatch();
  else showMenu();
};

addEventListener('arcade-admin-change',()=>{
  keyboard.up=false;
  keyboard.down=false;
  updateStatus();
});

addEventListener('arcade-admin-command',e=>{
  if(e.detail.command==='boost'){
    playerScore=Math.min(WIN_SCORE-1,playerScore+3);
    updateStatus();
  }
  if(e.detail.command==='reset'){
    restartMatch();
  }
});

resize();
showMenu();
requestAnimationFrame(frame);
</script>
</body>
</html>
