<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#08090d">
<title>Pong - Arcade Hub</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#08090d;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif}
body{display:grid;place-items:center}
#game{display:block;width:100vw;height:100dvh;background:#090d16;touch-action:none}
.top{position:fixed;z-index:30;top:max(10px,env(safe-area-inset-top));left:10px;right:82px;display:flex;align-items:center;justify-content:space-between;gap:8px;pointer-events:none}
.top a,.top button{pointer-events:auto;color:#fff;background:rgba(15,20,30,.84);border:1px solid rgba(255,255,255,.14);padding:9px 11px;border-radius:12px;text-decoration:none;font-weight:800;backdrop-filter:blur(12px)}
.topRight{display:flex;gap:7px}
#status{position:fixed;z-index:20;top:max(58px,calc(env(safe-area-inset-top) + 48px));left:50%;transform:translateX(-50%);padding:7px 11px;border:1px solid rgba(255,255,255,.1);border-radius:999px;background:rgba(12,17,26,.62);font-size:11px;font-weight:850;color:#cbd3e3;pointer-events:none;backdrop-filter:blur(10px);white-space:nowrap}
#overlay{position:fixed;z-index:1000;inset:0;display:grid;place-items:center;padding:18px;background:rgba(4,6,10,.72);backdrop-filter:blur(9px)}
#overlay.hidden{display:none}
.panel{width:min(92vw,420px);background:#111722;border:1px solid #30394c;border-radius:24px;padding:20px;box-shadow:0 28px 85px #0009}
.panel h1,.panel h2{margin:0 0 6px}.panel p{margin:0 0 16px;color:#aab4c8;line-height:1.45}.panel small{color:#8994aa}
.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.choices button,.big{border:1px solid #354057;background:#1a2230;color:#fff;border-radius:14px;padding:12px 10px;font-weight:850;font-size:14px}
.choices button.active{background:#edf3ff;color:#101522;border-color:#aab7d4}
.big{width:100%;margin-top:12px;padding:13px}
.statsBox{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:14px 0 4px}.career{border:1px solid #293246;background:#0d121b;border-radius:13px;padding:10px 7px;text-align:center}.career b{display:block;font-size:18px}.career span{font-size:10px;color:#8e99ad;font-weight:800;text-transform:uppercase;letter-spacing:.04em}
.diffNote{margin-top:10px;padding:10px 11px;border-radius:13px;border:1px solid #283247;background:#0c111a;color:#98a4ba;font-size:12px;line-height:1.4}
@media(max-width:520px){.top{right:74px}.top a,.top button{padding:8px 9px;font-size:12px}#status{top:max(51px,calc(env(safe-area-inset-top) + 42px));font-size:10px}.panel{padding:17px}.choices{gap:6px}.choices button{font-size:12px;padding:11px 6px}}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div class="top"><a href="../index.html">← Games</a><div class="topRight"><button id="pauseBtn">Pause</button><button id="restartBtn">Restart</button></div></div>
<div id="status">First to 7</div>
<div id="overlay"><div class="panel" id="panel"></div></div>
<script src="../admin.js"></script>
<script>
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
const VW=960,VH=540,WIN_SCORE=7;
let W=VW,H=VH,DPR=1,last=performance.now();
let difficulty='normal',phase='menu',paused=false,serveTimer=0,serveDir=1;
let playerScore=0,aiScore=0,rally=0,longestRally=0;
let pointerY=VH/2,keyboard={up:false,down:false};
let player={x:34,y:VH/2-58,w:18,h:116},ai={x:VW-52,y:VH/2-58,w:18,h:116};
let ball={x:VW/2,y:VH/2,vx:0,vy:0,r:10,speed:405};
let aiThink=0,aiTargetY=VH/2;
const DIFF={
  easy:{name:'Easy',aiSpeed:245,think:.24,predict:.10,error:105,notice:620},
  normal:{name:'Normal',aiSpeed:330,think:.15,predict:.34,error:62,notice:520},
  hard:{name:'Hard',aiSpeed:425,think:.09,predict:.62,error:30,notice:420}
};
const CAREER_KEY='pongCareer';
const admin=()=>window.ArcadeAdmin?.getSettings?.()||{god:false,speed:1,pongAuto:false,pongPrediction:false};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
function speedValue(){const v=Number(admin().speed);return Number.isFinite(v)&&v>0?v:1}
function career(){try{return{wins:0,losses:0,streak:0,best:0,...JSON.parse(localStorage.getItem(CAREER_KEY)||'{}')}}catch{return{wins:0,losses:0,streak:0,best:0}}}
function saveCareer(c){localStorage.setItem(CAREER_KEY,JSON.stringify(c))}
function arcadeSound(name){window.ArcadeVibes?.play?.(name)}
function resize(){DPR=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(innerWidth*DPR);canvas.height=Math.round(innerHeight*DPR);canvas.style.width=innerWidth+'px';canvas.style.height=innerHeight+'px';ctx.setTransform(canvas.width/VW,0,0,canvas.height/VH,0,0)}
addEventListener('resize',()=>{clearTimeout(resize.t);resize.t=setTimeout(resize,70)});
function resetPaddles(){player.y=VH/2-player.h/2;ai.y=VH/2-ai.h/2;pointerY=VH/2;aiTargetY=VH/2;aiThink=0}
function serve(dir){serveDir=dir||1;serveTimer=.9;ball.x=VW/2;ball.y=VH/2;ball.speed=405;const angle=(Math.random()*.9-.45);ball.vx=Math.cos(angle)*ball.speed*serveDir;ball.vy=Math.sin(angle)*ball.speed;rally=0;aiThink=0}
function startMatch(){playerScore=0;aiScore=0;longestRally=0;paused=false;phase='playing';resetPaddles();serve(Math.random()<.5?-1:1);overlay.classList.add('hidden');pauseBtn.textContent='Pause';last=performance.now();updateStatus()}
function restartMatch(){startMatch()}
function diffDescription(){if(difficulty==='easy')return'Easy reacts late, moves slower, and guesses wrong more often.';if(difficulty==='hard')return'Hard anticipates more, but it still has reaction time and can make mistakes.';return'Normal follows the ball well but does not know the exact landing spot.'}
function showMenu(){phase='menu';paused=false;const c=career();overlay.classList.remove('hidden');panel.innerHTML=`<h1>Pong</h1><p>First to ${WIN_SCORE}. Move your paddle with your finger or the arrow keys. The CPU now has reaction time and imperfect guesses instead of perfect prediction.</p><b>Opponent</b><div class="choices"><button data-d="easy">Easy</button><button data-d="normal">Normal</button><button data-d="hard">Hard</button></div><div class="diffNote" id="diffNote">${diffDescription()}</div><div class="statsBox"><div class="career"><b>${c.wins}</b><span>Wins</span></div><div class="career"><b>${c.losses}</b><span>Losses</span></div><div class="career"><b>${c.best}</b><span>Best streak</span></div></div><button class="big" id="playBtn">Play Match</button>`;panel.querySelectorAll('[data-d]').forEach(b=>{b.classList.toggle('active',b.dataset.d===difficulty);b.onclick=()=>{difficulty=b.dataset.d;panel.querySelectorAll('[data-d]').forEach(q=>q.classList.toggle('active',q.dataset.d===difficulty));panel.querySelector('#diffNote').textContent=diffDescription()}});panel.querySelector('#playBtn').onclick=startMatch;updateStatus()}
function finishMatch(playerWon){phase='gameover';paused=false;const c=career();if(playerWon){c.wins++;c.streak++;c.best=Math.max(c.best,c.streak);arcadeSound('win')}else{c.losses++;c.streak=0;arcadeSound('hit')}saveCareer(c);overlay.classList.remove('hidden');panel.innerHTML=`<h2>${playerWon?'You Win!':'You Lost'}</h2><p>Final score: ${playerScore} - ${aiScore}<br>Longest rally: ${longestRally}</p><div class="statsBox"><div class="career"><b>${c.wins}</b><span>Wins</span></div><div class="career"><b>${c.streak}</b><span>Streak</span></div><div class="career"><b>${c.best}</b><span>Best</span></div></div><button class="big" id="rematchBtn">Rematch</button><button class="big" id="menuBtn">Change Difficulty</button>`;panel.querySelector('#rematchBtn').onclick=startMatch;panel.querySelector('#menuBtn').onclick=showMenu;updateStatus()}
function scorePoint(playerGotPoint){if(playerGotPoint){playerScore++;arcadeSound('score')}else{aiScore++;arcadeSound('hit')}if(playerScore>=WIN_SCORE||aiScore>=WIN_SCORE){finishMatch(playerScore>aiScore);return}serve(playerGotPoint?-1:1);updateStatus()}
function updateStatus(){if(phase==='menu'){status.textContent='First to 7';return}if(phase==='gameover'){status.textContent=`Final ${playerScore} - ${aiScore}`;return}const a=admin(),flags=[];if(a.pongAuto)flags.push('AUTO');if(a.pongPrediction)flags.push('PREDICT');status.textContent=`${DIFF[difficulty].name} • ${playerScore} - ${aiScore} • Rally ${rally} • ${speedValue()}x${flags.length?' • '+flags.join(' • '):''}`}
function reflectY(y){const top=ball.r+7,bottom=VH-ball.r-7,span=bottom-top;let n=(y-top)%(span*2);if(n<0)n+=span*2;if(n>span)n=span*2-n;return top+n}
function predictedYAtX(targetX){if(Math.abs(ball.vx)<1)return ball.y;const t=(targetX-ball.x)/ball.vx;if(t<=0)return ball.y;return reflectY(ball.y+ball.vy*t)}
function movePlayer(dt){const a=admin(),speed=a.pongAuto?900:650;if(a.pongAuto){let target=VH/2;if(ball.vx<0)target=predictedYAtX(player.x+player.w+ball.r);const center=player.y+player.h/2;player.y+=clamp(target-center,-speed*dt,speed*dt)}else{if(keyboard.up)player.y-=speed*dt;if(keyboard.down)player.y+=speed*dt;if(!keyboard.up&&!keyboard.down){const target=pointerY-player.h/2;player.y+=clamp(target-player.y,-speed*dt,speed*dt)}}player.y=clamp(player.y,8,VH-player.h-8)}
function moveAI(dt){const d=DIFF[difficulty],attacking=ball.vx>0;aiThink-=dt;if(!attacking){aiTargetY=VH/2;aiThink=0}else if(ball.x<d.notice){aiTargetY=lerp(aiTargetY,VH/2,.06)}else if(aiThink<=0){const exact=predictedYAtX(ai.x-ball.r),rough=lerp(ball.y,exact,d.predict),mistake=(Math.random()*2-1)*d.error;aiTargetY=clamp(rough+mistake,20,VH-20);aiThink=d.think*(.72+Math.random()*.65)}const center=ai.y+ai.h/2,max=d.aiSpeed*dt;ai.y+=clamp(aiTargetY-center,-max,max);ai.y=clamp(ai.y,8,VH-ai.h-8)}
function hitPaddle(p,left){const rel=clamp((ball.y-(p.y+p.h/2))/(p.h/2),-1,1);ball.speed=Math.min(900,ball.speed*1.045+4);const maxAngle=1.05,angle=rel*maxAngle;ball.vx=Math.cos(angle)*ball.speed*(left?1:-1);ball.vy=Math.sin(angle)*ball.speed;if(left)ball.x=p.x+p.w+ball.r+1;else ball.x=p.x-ball.r-1;rally++;longestRally=Math.max(longestRally,rally);if(!left)aiThink=0;arcadeSound('level')}
function physicsStep(dt){const a=admin();movePlayer(dt);moveAI(dt);if(serveTimer>0){serveTimer-=dt;ball.x=VW/2;ball.y=VH/2;return}ball.x+=ball.vx*dt;ball.y+=ball.vy*dt;if(ball.y-ball.r<7){ball.y=7+ball.r;ball.vy=Math.abs(ball.vy)}else if(ball.y+ball.r>VH-7){ball.y=VH-7-ball.r;ball.vy=-Math.abs(ball.vy)}if(ball.vx<0&&ball.x-ball.r<=player.x+player.w&&ball.x+ball.r>=player.x&&ball.y+ball.r>=player.y&&ball.y-ball.r<=player.y+player.h)hitPaddle(player,true);if(ball.vx>0&&ball.x+ball.r>=ai.x&&ball.x-ball.r<=ai.x+ai.w&&ball.y+ball.r>=ai.y&&ball.y-ball.r<=ai.y+ai.h)hitPaddle(ai,false);if(ball.x+ball.r<0){if(a.god){ball.x=player.x+player.w+ball.r+1;ball.vx=Math.abs(ball.vx)}else scorePoint(false)}else if(ball.x-ball.r>VW)scorePoint(true)}
function update(dt){if(phase!=='playing'||paused)return;const total=dt*speedValue();if(!Number.isFinite(total)||total<=0)return;const steps=Math.max(1,Math.min(300,Math.ceil(total/.0035))),step=total/steps;for(let i=0;i<steps&&phase==='playing';i++)physicsStep(step);updateStatus()}
function drawCourt(){const g=ctx.createLinearGradient(0,0,0,VH);g.addColorStop(0,'#111a2a');g.addColorStop(1,'#070b12');ctx.fillStyle=g;ctx.fillRect(0,0,VW,VH);ctx.fillStyle='rgba(255,255,255,.05)';ctx.fillRect(VW/2-2,0,4,VH);for(let y=13;y<VH;y+=28){ctx.fillStyle='rgba(255,255,255,.24)';ctx.fillRect(VW/2-2,y,4,14)}ctx.strokeStyle='rgba(255,255,255,.08)';ctx.lineWidth=2;ctx.strokeRect(7,7,VW-14,VH-14)}
function drawPrediction(){if(!admin().pongPrediction||phase!=='playing'||serveTimer>0||Math.abs(ball.vx)<1)return;let px=ball.x,py=ball.y,vx=ball.vx,vy=ball.vy;const targetX=vx<0?player.x+player.w+ball.r:ai.x-ball.r,points=[{x:px,y:py}],dt=.014;for(let i=0;i<420;i++){px+=vx*dt;py+=vy*dt;if(py-ball.r<7){py=7+ball.r;vy=Math.abs(vy)}else if(py+ball.r>VH-7){py=VH-7-ball.r;vy=-Math.abs(vy)}if(i%5===0)points.push({x:px,y:py});if((vx<0&&px<=targetX)||(vx>0&&px>=targetX)){points.push({x:targetX,y:predictedYAtX(targetX)});break}}if(points.length<2)return;ctx.save();ctx.strokeStyle='rgba(102,225,255,.7)';ctx.lineWidth=3;ctx.setLineDash([10,10]);ctx.beginPath();ctx.moveTo(points[0].x,points[0].y);for(let i=1;i<points.length;i++)ctx.lineTo(points[i].x,points[i].y);ctx.stroke();const end=points[points.length-1];ctx.setLineDash([]);ctx.fillStyle='rgba(102,225,255,.9)';ctx.beginPath();ctx.arc(end.x,end.y,7,0,Math.PI*2);ctx.fill();ctx.restore()}
function drawPaddle(p,isPlayer){const g=ctx.createLinearGradient(p.x,p.y,p.x+p.w,p.y);if(isPlayer){g.addColorStop(0,'#62d7ff');g.addColorStop(1,'#7d86ff')}else{g.addColorStop(0,'#ff7f9e');g.addColorStop(1,'#d66cff')}ctx.save();ctx.shadowColor=isPlayer?'#61cfff':'#e86cff';ctx.shadowBlur=14;ctx.fillStyle=g;ctx.beginPath();ctx.roundRect(p.x,p.y,p.w,p.h,9);ctx.fill();ctx.restore()}
function drawBall(){ctx.save();ctx.shadowColor='#fff1a4';ctx.shadowBlur=16;ctx.fillStyle='#fff7c6';ctx.beginPath();ctx.arc(ball.x,ball.y,ball.r,0,Math.PI*2);ctx.fill();ctx.restore()}
function drawScore(){ctx.textAlign='center';ctx.font='900 58px system-ui';ctx.fillStyle='rgba(255,255,255,.94)';ctx.fillText(playerScore,VW/2-82,76);ctx.fillText(aiScore,VW/2+82,76);ctx.font='800 12px system-ui';ctx.fillStyle='rgba(255,255,255,.48)';ctx.fillText('YOU',VW/2-82,101);ctx.fillText('CPU',VW/2+82,101);if(serveTimer>0&&phase==='playing'){ctx.font='900 22px system-ui';ctx.fillStyle='rgba(255,255,255,.76)';ctx.fillText('GET READY',VW/2,VH/2-34)}if(admin().pongAuto&&phase==='playing'){ctx.font='900 13px system-ui';ctx.fillStyle='rgba(102,225,255,.85)';ctx.fillText('AUTOPILOT',VW/2,126)}if(paused){ctx.fillStyle='rgba(0,0,0,.44)';ctx.fillRect(0,0,VW,VH);ctx.font='900 42px system-ui';ctx.fillStyle='#fff';ctx.fillText('PAUSED',VW/2,VH/2)}}
function draw(){drawCourt();drawPrediction();drawPaddle(player,true);drawPaddle(ai,false);drawBall();drawScore()}
function frame(ts){const dt=Math.min(.04,Math.max(0,(ts-last)/1000||0));last=ts;update(dt);draw();requestAnimationFrame(frame)}
function pointerToY(e){const r=canvas.getBoundingClientRect();pointerY=clamp((e.clientY-r.top)*VH/r.height,0,VH)}
canvas.addEventListener('pointerdown',e=>{if(admin().pongAuto)return;e.preventDefault();pointerToY(e);canvas.setPointerCapture?.(e.pointerId)},{passive:false});
canvas.addEventListener('pointermove',e=>{if(admin().pongAuto)return;if(e.buttons||e.pointerType==='touch'){e.preventDefault();pointerToY(e)}},{passive:false});
addEventListener('keydown',e=>{if(admin().pongAuto)return;if(e.key==='ArrowUp'||e.key==='w'||e.key==='W'){keyboard.up=true;e.preventDefault()}if(e.key==='ArrowDown'||e.key==='s'||e.key==='S'){keyboard.down=true;e.preventDefault()}if(e.code==='Space'&&phase==='playing'){paused=!paused;pauseBtn.textContent=paused?'Resume':'Pause';last=performance.now();e.preventDefault()}});
addEventListener('keyup',e=>{if(e.key==='ArrowUp'||e.key==='w'||e.key==='W')keyboard.up=false;if(e.key==='ArrowDown'||e.key==='s'||e.key==='S')keyboard.down=false});
pauseBtn.onclick=()=>{if(phase!=='playing')return;paused=!paused;pauseBtn.textContent=paused?'Resume':'Pause';last=performance.now()};
restartBtn.onclick=()=>{if(phase==='playing'||phase==='gameover')restartMatch();else showMenu()};
addEventListener('arcade-admin-change',()=>{keyboard.up=false;keyboard.down=false;updateStatus()});
addEventListener('arcade-admin-command',e=>{if(e.detail.command==='boost'){playerScore=Math.min(WIN_SCORE-1,playerScore+3);updateStatus()}if(e.detail.command==='reset')restartMatch()});
resize();showMenu();requestAnimationFrame(frame);
</script>
</body>
</html>
