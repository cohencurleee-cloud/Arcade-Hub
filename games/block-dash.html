<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><style>html,body{margin:0;height:100%;background:#08090d;color:#fff;font-family:system-ui;overflow:hidden}body{display:grid;place-items:center}canvas{width:min(100vw,760px);height:min(78vh,560px);background:#0e1320;touch-action:none}.top{position:fixed;top:10px;left:10px;right:86px;display:flex;justify-content:space-between;z-index:2}a,button{color:#fff;background:#171c28;border:1px solid #2b3346;padding:9px 12px;border-radius:12px;text-decoration:none;font-weight:700}.hint{position:fixed;bottom:10px;left:50%;transform:translateX(-50%);background:#171c28;padding:8px 12px;border-radius:999px;color:#bec5d6;font-size:12px;white-space:nowrap}</style></head><body><div class="top"><a href="../index.html">← Games</a><button onclick="reset()">Restart</button></div><canvas id="c" width="760" height="560"></canvas><div class="hint" id="hint">Tap to jump</div><script src="../admin.js"></script><script>const c=document.getElementById('c'),x=c.getContext('2d');let y,v,obs,dead,score,spawn,last=performance.now(),tickBank=0;const admin=()=>window.ArcadeAdmin?.getSettings?.()||{god:false,speed:1};function speedValue(){const n=Number(admin().speed);return Number.isFinite(n)&&n>0?n:1}function reset(){y=430;v=0;obs=[];dead=false;score=0;spawn=95;last=performance.now();tickBank=0}function jump(){if(dead){reset();return}if(y>=429)v=-13}c.addEventListener('pointerdown',jump);addEventListener('keydown',e=>{if(e.code==='Space')jump()});function tick(){const a=admin();if(dead)return;spawn-=1;if(spawn<=0){obs.push({x:760,w:35+Math.random()*25,h:50+Math.random()*55});spawn=95}v+=.7;y+=v;if(y>430){y=430;v=0}obs.forEach(o=>o.x-=6);obs=obs.filter(o=>o.x>-80);score+=1;for(const o of obs)if(!a.god&&110+34>o.x&&110<o.x+o.w&&y+34>500-o.h)dead=true}function draw(){x.clearRect(0,0,760,560);x.fillStyle='#2e3548';x.fillRect(0,500,760,60);x.fillStyle='#f2d45c';x.fillRect(110,y,34,34);x.fillStyle='#ff5f6d';obs.forEach(o=>x.fillRect(o.x,500-o.h,o.w,o.h));x.fillStyle='white';x.font='24px system-ui';x.fillText('Score '+Math.floor(score/10),20,40);hint.textContent='Tap to jump • '+speedValue()+'x';if(dead){x.font='40px system-ui';x.fillText('Tap to restart',250,280)}}function loop(ts){const dt=Math.min(.12,Math.max(0,(ts-last)/1000||0));last=ts;tickBank+=dt*60*speedValue();let steps=Math.floor(tickBank);if(steps>240){steps=240;tickBank=0}else tickBank-=steps;for(let i=0;i<steps&&!dead;i++)tick();draw();requestAnimationFrame(loop)}addEventListener('arcade-admin-command',e=>{if(e.detail.command==='boost')score+=1000;if(e.detail.command==='reset')reset()});reset();requestAnimationFrame(loop);</script></body></html>
